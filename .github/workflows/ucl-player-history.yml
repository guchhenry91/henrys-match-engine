name: Champions League player history (props test data)

# Fetches player stats for past Champions League matches between big-five clubs
# (scripts/fetch_ucl_player_history.py) -- the data the Champions League props test
# needs. One API-Football request per fixture, ~310 in all, under the client's
# 1,500-a-day account floor. Commits only data-raw/ucl/player_history.json.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch_ucl_player_history.py]

concurrency:
  group: ucl-player-history
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m scripts.fetch_ucl_player_history
      - name: Commit the data
        run: |
          git config user.name "leagues-bot"
          git config user.email "leagues-bot@users.noreply.github.com"
          git add data-raw/ucl/player_history.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "auto: Champions League player history for the props test"
            git pull --rebase --autostash origin main
            git push
          fi
