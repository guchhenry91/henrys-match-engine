name: API-Football odds diagnostic

# Manual-only check of what our API-Football plan actually returns from /odds:
# bet types (Exact Score id=10, Anytime Goal Scorer id=92, player shots/SOT
# ids 240-243 all exist), bookmaker coverage (33 books incl. Bet365), and a
# sample payload for an upcoming, a past and a live fixture.
#
# KEPT DELIBERATELY, not leftover scaffolding. Last run found pre-match odds
# returning EMPTY for every non-live fixture while in-play odds worked, which
# contradicts the account's listed features. This job is how that gets
# re-tested on a real matchday before any decision about the market-calibrated
# model (see TIMESTAMPED_ODDS_COLLECTION_PLAN.md, which is blocked on it).
#
# Costs nothing idle: workflow_dispatch only, no schedule. Touches no data
# files, commits nothing, spends ~6 API requests per run.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check odds coverage
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m scripts.check_odds_coverage
