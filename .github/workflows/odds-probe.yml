name: Odds API coverage probe

# Phase 1 of the agreed odds budget (CLAUDE.md, "API credit budget"): measures
# which books and regions quote the props the site publishes, for at most 60
# Odds API credits, plus ~5 API-Football requests.
#
# MANUAL ONLY. ODDS_API_ENABLED is switched on for THIS job alone; every
# scheduled workflow still has it off. Commits only the probe result and the
# credit ledger -- never a board, never a deploy.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Which probe to run (scripts/<name>.py)"
        type: choice
        options: [probe_odds_api, probe_alt_lines]
        default: probe_odds_api

concurrency:
  group: odds-api            # one spender at a time, so the ledger can't race
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe coverage
        env:
          ODDS_API_ENABLED: "true"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m scripts.${{ inputs.script || 'probe_odds_api' }}

      - name: Commit the probe result and ledger
        run: |
          git config user.name "leagues-bot"
          git config user.email "leagues-bot@users.noreply.github.com"
          git add data-raw/odds_api
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "auto: Odds API coverage probe $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push
          fi
