name: MLB refresh

# The live MLB board: StatsAPI schedule and box scores (free), bookmaker lines
# from The Odds API (at most two checks a game, every cap in oddsapi/client.py,
# nothing at all unless ODDS_API_ENABLED is "true"), picks frozen before first
# pitch and graded from the box score.

on:
  # Team news from the cloud routine: rebuild as soon as it lands.
  push:
    branches: [main]
    paths:
      - "data-raw/mlb/news.json"
  schedule:
    # Games run ~16:00-02:30 UTC. 14:00 takes the first bookmaker check for the
    # day games, 17:30 the lock check for early games, 22:00 the lock check for
    # the night slate. Keep in step with mlb/book_lines.RUN_SLOTS.
    - cron: "0 14 * * *"
    - cron: "30 17 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: mlb-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: mlb-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Box scores (MLB StatsAPI) and bookmaker lines (The Odds API)
        continue-on-error: true
        env:
          ODDS_API_ENABLED: ${{ vars.ODDS_API_ENABLED }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m scripts.sync_mlb_odds

      - name: Publish the MLB board
        run: python -m mlb.publish

      - name: Tests
        run: python -m pytest tests/mlb tests/oddsapi -q

      - name: Commit the refreshed board
        id: commit
        run: |
          git config user.name "leagues-bot"
          git config user.email "leagues-bot@users.noreply.github.com"
          # THE CREDIT LEDGER AND THE FROZEN PICKS ARE ALWAYS KEPT, deploy or not:
          # the ledger is how the daily cap counts every run, and a frozen pick
          # that is not committed was never frozen.
          git add data-raw/odds_api data-raw/mlb/odds_api.json data-raw/mlb/picks_log.json data-raw/mlb/current 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "auto: MLB ledger, box scores and frozen picks $(date -u +%Y-%m-%d)"
            kept=true
          fi
          git add data/mlb
          if git diff --cached --quiet || ! python -m scripts.deploy_needed; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No meaningful MLB board changes to publish."
            git reset -q
            if [ "${kept:-}" = true ]; then
              git pull --rebase --autostash origin main
              git push
            fi
          else
            git commit -m "auto: MLB board $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          HOOK="$(printf '%s' "$HOOK" | tr -d '[:space:]')"
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK not set; board pushed but not deployed"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$HOOK")
          echo "deploy hook responded $code"
