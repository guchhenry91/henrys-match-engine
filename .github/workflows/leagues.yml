name: Leagues refresh

# Runs the four-league predictor in GitHub's cloud -- independent of any laptop
# being on and of Claude running. Everything it does is deterministic Python:
# fetch data -> fit model -> simulate season -> build props -> sanity-check ->
# commit -> trigger the Render deploy. No AI judgment in this path.
#
# It deliberately touches ONLY data/leagues/** and data-raw/leagues/**. The World
# Cup engine (predict.py, data/predictions.json) is never run or committed here.

on:
  schedule:
    # Independent team-news research. The script exits without network calls when
    # no Best Pick is within 72h, so this can cover midweek fixtures as well as
    # weekends without needing Claude/ChatGPT to be open.
    - cron: "15 */3 * * *"
    # Tuesday 06:00 UTC -- the weekly refit, after Monday-night football settles.
    - cron: "0 6 * * 2"
    # MATCHDAYS, every 15 minutes (was 30 until 2026-08-21). Two jobs at once: it records results as they land,
    # and -- more importantly -- it is what FREEZES each pick. A pick only locks on
    # a run that happens inside LOCK_WINDOW_HOURS of kickoff, so the publish cadence
    # must be at least as tight as that window or a fixture can slip through the gap
    # unlocked, get locked after kickoff, and be voided out of the record.
    # Every 30 minutes through the match window. This is tight because the pick now
    # locks only 45 minutes before kickoff, so that a confirmed starting XI (published
    # ~1h before) can still reach the model. The lock can only happen on a run that
    # lands inside that 45-minute window, so runs must be closer together than the
    # window is wide.
    # Every day, not only the traditional weekend windows. This covers Tuesday-
    # Thursday matchweeks and rescheduled fixtures; the interval remains narrower
    # than the 45-minute lock window.
    # HALVED AND MOVED OFF THE HOUR ON 2026-08-29, as an experiment with a stated
    # hypothesis rather than a preference.
    #
    # This asked for 48 slots a day at :00/:15/:30/:45. Measured, the honoured
    # fraction was 55-70% (26-34 runs a day) until 2026-08-26 -- then lock.yml's
    # `*/10` took the repo's total ask to ~130 slots a day and EVERYTHING
    # collapsed to 3-7 runs a day, this workflow included. That is far worse than
    # proportional, which is what makes over-asking, rather than sampling, the
    # better explanation: GitHub appears to penalise a repo that demands far more
    # scheduled runs than it is given.
    #
    # So the ask is halved to 24, and both minutes sit well away from the hour
    # boundary -- GitHub's own docs name the start of every hour as a high-load
    # window, and :00 and :30 were the two worst choices available.
    #
    # THIS MIGHT BE WRONG. If the ration is absolute rather than a penalty, fewer
    # slots simply means fewer runs. `scripts/measure_lock_reliability.py` now
    # tracks runs per day repo-wide; check it before concluding either way. The
    # cost of being wrong is much lower than it was, because every run that does
    # fire now refreshes results in the fast `lock` job rather than only in the
    # eighteen-minute refit.
    - cron: "17,47 11-22 * * *"
  workflow_dispatch:
    inputs:
      # NOTE: ONE inputs block. Adding a second one is legal YAML and silently
      # discards the first -- which is how probe_ucl vanished and the dispatch
      # came back "Unexpected inputs provided", with yaml.safe_load reporting the
      # file as perfectly valid the whole time.
      probe_ucl:
        description: "Report Champions League data coverage (prints only)"
        type: boolean
        default: false
      force_rosters:
        description: >-
          Comma-separated league keys (PL,LALIGA,BUNDESLIGA,LIGUE1,SERIEA) to
          force-refresh from API-Football regardless of the freshness window --
          e.g. to catch up a league left on the ESPN fallback. Leave blank for
          the normal quota-aware refresh, which now covers every configured
          league rather than two hardcoded pairs.
        required: false
        default: ""

concurrency:
  group: leagues-refresh        # never let two runs race on the same files
  cancel-in-progress: false

jobs:
  # FREEZE FIRST, PUBLISH SECOND. Locking needs no model -- the probability was
  # already computed and published, so freezing it is a file read, a comparison
  # and a file write. It runs in about thirty seconds, where `refresh` below needs
  # ten minutes to reach its own lock step. On a 19:00 kickoff that difference is
  # the difference between a valid pick and a late lock, which taints it, which
  # VOIDS it.
  #
  # IT LIVES HERE RATHER THAN IN ITS OWN SCHEDULED WORKFLOW, and that is the whole
  # point. lock.yml used to carry a `*/10 11-23` cron of its own. Measured over
  # the days after it was added, total SCHEDULED runs across this repo fell from
  # ~30 a day to 3-7: leagues.yml alone dropped from 27-28 runs a day to 4. The
  # extra workflow did not add locking capacity, it competed for it, and it cost
  # far more soccer locking than it bought. Riding the trigger that actually fires
  # is worth more than asking for a tighter one that does not.
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # PANDAS ONLY. LOCK_WINDOW_HOURS lives in leagues/config.py (pure stdlib)
      # precisely so this job need not import penaltyblog, scipy and sklearn to
      # learn one float -- that install alone would cost more than the job.
      - name: Install pandas
        run: pip install pandas

      - name: Freeze picks due to kick off
        run: python -m scripts.lock_picks

      # RESULTS DO NOT NEED THE MODEL. Grading a played fixture and redrawing the
      # table is a file read plus a score, but both used to happen only inside the
      # eighteen-minute refit below -- so the visible results were only ever as
      # fresh as the last full run. On 2026-08-29 that left the boards four hours
      # stale with about fifteen finished games missing. It also means results now
      # survive the refit failing (21% of scheduled runs do) or standing down
      # because a fresher run landed.
      - name: Apply results to the published boards
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          # Second source first: fixturedownload had posted nothing three hours
          # after the season's first match ended, so this fills that gap.
          python -m scripts.sync_results || echo "result sync skipped"
          python -m scripts.refresh_results

      - name: Commit frozen picks and results
        id: fastcommit
        run: |
          git config user.name  "leagues-bot"
          git config user.email "actions@github.com"
          # The picks logs ONLY. This job publishes nothing a reader sees, so it
          # must never touch a board file.
          #
          # THE SOCCER LOGS ARE PER LEAGUE -- data-raw/leagues/pl/picks_log.json
          # and so on, not one file at the top. A flat list here would freeze
          # every pick and then commit none of them, losing the lock silently on
          # every run while still printing "froze match ...".
          #
          # `find -exec` rather than a glob: an unmatched shell glob passes
          # through literally, and `git add` on a literal `*` path fails the whole
          # command. This stages what exists and nothing else.
          find data-raw/leagues -name "picks_log.json"                                 -o -name "player_picks_log.json"                                 -o -name "parlays_log.json"             | while read -r f; do git add "$f"; done
          [ -f data-raw/nfl/picks_log.json ] && git add data-raw/nfl/picks_log.json || true
          # The boards themselves, because applying results changes what a READER
          # sees -- unlike locking, which only changes the record.
          git add data/leagues data-raw/leagues/results_override.json 2>/dev/null || true
          # EVERYTHING ELSE THIS JOB WRITES, or `git pull --rebase` below refuses
          # on a dirty tree and the whole job fails. That is not hypothetical: the
          # runs at 05:21 and 11:52 on 2026-08-30 died exactly here, on
          # "cannot pull with rebase: You have unstaged changes".
          #   - locker_heartbeat.json: written by lockwindow.beat() every run
          #   - _snapshots/: fetch_fixtures re-snapshots every successful fetch
          git add data-raw/leagues/locker_heartbeat.json 2>/dev/null || true
          git add data-raw/leagues/_snapshots 2>/dev/null || true
          # Belt and braces: anything else generated under these two trees. Scoped
          # to them so a stray file elsewhere can never be swept into a commit.
          git add -A data-raw/leagues data-raw/nfl 2>/dev/null || true
          # Did anything reader-visible change? Locking alone must not deploy.
          if git diff --cached --quiet -- data/leagues; then
            echo "boards=false" >> "$GITHUB_OUTPUT"
          else
            echo "boards=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --cached --quiet; then
            echo "nothing newly frozen"
          else
            # deploy-on-push skips leagues-bot commits already; the marker keeps
            # that guard independent of authorship. THIS job now triggers Render
            # itself, but only when a board actually changed (the `boards` output
            # above). Locking alone changes the record and not the page, and
            # deploying for that spends build minutes to change nothing on screen
            # -- the exact waste that exhausted the Render spend limit on
            # 2026-08-22.
            git commit -m "auto: freeze picks and apply results [auto-deployed]"
            # NO --autostash. On 2026-08-26 an autostash here resolved into a
            # commit containing raw conflict markers and every board on the live
            # site went empty. A failed pull must abort the push and retry next
            # run, never improvise its way through.
            #
            # A losing push race is NORMAL here, not a fault: the local hourly
            # task and this job both commit. So retry once against the newer tip
            # before giving up, and treat a genuine failure as a WARNING rather
            # than an error -- nothing is lost when this job cannot push. The
            # commit is local to a throwaway runner, the next run starts from a
            # fresh checkout, and locking is idempotent, so the same freeze simply
            # happens again. Failing the job instead is what let a dirty tree take
            # the whole publish down on 2026-08-30.
            pushed=""
            for attempt in 1 2; do
              if git pull --rebase origin main && git push; then
                pushed="yes"; break
              fi
              echo "push attempt $attempt failed; retrying against the newer tip"
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            if [ -z "$pushed" ]; then
              echo "::warning::could not push the freeze; the next run redoes it"
              echo "boards=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Publish the results
        # Only when a board actually changed. A freeze on its own alters the
        # record, not the page, and must not spend a Render build on it.
        if: steps.fastcommit.outputs.boards == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          HOOK="$(printf '%s' "$HOOK" | tr -d '[:space:]')"
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK not set; results pushed but not deployed"
            exit 0
          fi
          code=$(curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 -sS -o /dev/null -w "%{http_code}" -X POST "$HOOK")
          echo "deploy hook responded $code"
          # 202 (queued) is a normal Render response; treat all three as success.
          [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "202" ]

  refresh:
    # Sequential, not parallel: `lock` pushes the frozen picks and `refresh` then
    # checks out that commit. Racing them would have two jobs in one run pushing
    # to the same branch.
    needs: lock
    # BUT NEVER BLOCKED BY IT. `needs` alone also means "only if lock SUCCEEDED",
    # and that turned a small fault in the fast job into a total outage: on
    # 2026-08-30 the lock job failed on a dirty tree at 05:21 and again at 11:52,
    # and both times the entire publish was SKIPPED. The boards then went 13 hours
    # without a refresh and the page said so.
    #
    # The fast path exists to SUPPLEMENT the refit, never to gate it. `always()`
    # keeps the ordering that stops the two jobs racing a push, while removing the
    # dependency on the outcome.
    if: always()
    runs-on: ubuntu-latest
    # WHY 120, not 30: every run so far has timed out or been cancelled before
    # completing, which means the soccerdata cache below has NEVER once been
    # saved -- actions/cache only saves at the end of a successful job, and no
    # job has ever reached the end. leagues.publish fetches shot events ONE
    # HTTP REQUEST PER HISTORICAL MATCH (soccerdata's Understat._read_match,
    # cached to disk permanently since a played match never changes). Cold,
    # across 5 seasons x 4 leagues, that is ~6,860 individual page fetches --
    # timed at ~15 minutes for the Premier League alone in the last real run,
    # so ~60 minutes for all four leagues before publish/sanity/tests/commit
    # even start. This is a ONE-TIME cost: once a single run is allowed to
    # finish, the cache is saved, every later run restores it via
    # restore-keys and only needs to fetch the handful of matches in the
    # CURRENT season (soccerdata skips its cache for the in-progress season
    # by design), which is fast. 120 minutes gives that first run room to
    # actually complete. Tighten this back down once a few warm runs have
    # been observed finishing quickly -- do not lower it before that,
    # or the cache never gets the chance to populate at all.
    timeout-minutes: 120
    permissions:
      contents: write           # needed to push the regenerated JSON

    steps:
      - uses: actions/checkout@v4

      # START FROM THE CURRENT TIP, NOT THE TRIGGER COMMIT.
      #
      # actions/checkout takes github.sha -- the commit that TRIGGERED the run --
      # so this job never contained the commit its own `lock` sibling had just
      # pushed. At the end it compared origin against that stale base, saw it had
      # "advanced", concluded a fresher run had landed, and stood down. Every
      # time.
      #
      # The effect was total and silent: between 2026-08-30 18:48 and 2026-08-31
      # 13:45 EVERY commit on main was "auto: freeze picks and apply results" and
      # not one "auto: leagues refresh" landed. The model recomputed on schedule,
      # produced 29 files of new predictions, and threw them away on every run --
      # which is why the page said the predictions were 19 hours old while the
      # scores beside them were current.
      #
      # Pulling here is safe in a way that rebasing at the END would not be: the
      # tree is a clean checkout and nothing has been computed yet, so there is
      # nothing to conflict. The stand-down guard below then means what it
      # originally meant -- a genuinely rival publish landed mid-run.
      - name: Start from the current tip of main
        run: |
          git fetch -q origin main
          git reset -q --hard origin/main
          echo "publishing from $(git rev-parse --short HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # soccerdata caches scraped pages here; re-using it across runs keeps us
      # light on Understat/football-data rather than re-downloading every time.
      - name: Cache soccerdata
        uses: actions/cache@v4
        with:
          path: ~/soccerdata
          key: soccerdata-${{ github.run_id }}
          restore-keys: soccerdata-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fail fast, and legibly, on a malformed hand/agent-edited data file. On
      # 2026-08-02 a single missing comma in transfers.json aborted all four
      # publishes with a cryptic "0/4 succeeded" and froze the site for a day.
      # This turns that into an immediate "transfers.json: line 206 ..." at the
      # very start of the run, before the slow model fetch even begins.
      - name: Validate data JSON
        run: python -m scripts.validate_data_json

      - name: Probe Champions League coverage
        # Reconnaissance only, on request. How many seasons exist, and how much
        # history each drawn club has, decide whether a UCL board is buildable.
        if: inputs.probe_ucl
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m scripts.probe_ucl

      - name: Refresh Champions League history
        # One request per uncached season; the past never changes so only the
        # current season is refetched. Sixteen calls on the first run, one after.
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m scripts.sync_ucl_history

      - name: Champions League gate and board
        # The gate is cheap here (no network -- it reads the cached history) so it
        # runs every time rather than on a separate cadence.
        run: |
          python -m scripts.ucl_backtest
          python -m ucl.publish

      # Free public roster evidence. This is deliberately before the model: a
      # missing/thin club roster makes that club's player markets disappear
      # instead of allowing last season's departed players to survive silently.
      - name: Refresh and audit current rosters
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FORCE_ROSTER_LEAGUES: ${{ inputs.force_rosters }}
        run: |
          python -m scripts.sync_rosters
          python -m scripts.roster_integrity_check

      # Research every fixture inside 72h directly from the fixture feed, not the
      # previous best.json. This guarantees that a newly generated Best Pick was
      # checked before the final publish and cannot deadlock the freshness gate.
      # Explicit absences still require two different original publishers.
      - name: Refresh multi-source team news
        run: python -m scripts.sync_team_news

      # Final scores. fixturedownload has published 1 of 380 results this season,
      # so every grade until now came from the LOCAL scheduled task writing
      # results_override.json -- meaning the record only advanced while the
      # owner's laptop was on. API-Football's key is already a secret here, so
      # this closes the loop in the cloud. Runs BEFORE publish so anything it
      # records is graded in the same run.
      - name: Fetch final scores
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m scripts.sync_results

      # Understat is the player-grading feed and it filed NOTHING for 2026-27
      # while 26 fixtures were played -- its newest row was the previous May.
      # Because the frame was full of last season it did not look absent, so
      # every player pick graded against a fixture the feed had never seen and
      # the board published 0 correct / 18 wrong, none of it real. publish now
      # refuses to grade an uncovered side; this fills the silence so those
      # picks settle honestly instead of hanging. Runs BEFORE publish so what it
      # fetches is graded in the same run, and costs nothing once Understat
      # catches up.
      - name: Fetch per-match player stats
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m scripts.sync_player_stats

      - name: Refresh confirmed pre-match lineups
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m scripts.sync_lineups

      - name: Publish all four leagues
        run: python -m leagues.publish
        env:
          # publish makes no API call itself, but it must state whether a pick
          # WILL be settleable (players.grading_feed_available). Bundesliga's
          # answer depends on the fallback being usable, and without the key in
          # this step publish read "no key" and kept branding the whole league
          # ungradeable -- the exact exclusion the fallback was meant to lift.
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # Two independent leagues at once roughly halves a cold Understat build
          # without aggressively fanning out against a free public service.
          PUBLISH_WORKERS: "2"

      # The gate: refuses to ship output that contradicts itself (a pick against
      # its own scoreline, a table that doesn't add up, an eliminated team still
      # favoured). Non-zero exit fails the job BEFORE anything is committed.
      - name: Sanity-check the published payloads
        run: python -m scripts.sanity_check

      - name: Run tests
        run: python -m pytest tests/ -q

      # Sends each pick to Telegram exactly ONCE, the run it first locks (see
      # scripts/telegram_picks.py) -- not fresh spam every 30-minute republish.
      # Runs BEFORE the commit step deliberately: it writes which picks it sent
      # to data-raw/leagues/telegram_sent.json, and that file must be swept into
      # THIS run's commit below or the dedup memory never reaches the repo --
      # the next scheduled run starts from a fresh checkout and would resend
      # everything already sent. Never fails the job (see the script itself);
      # a Telegram outage must not block publishing.
      - name: Send newly-locked picks to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.telegram_picks

      - name: Commit refreshed league data
        id: commit
        run: |
          git config user.name  "leagues-bot"
          git config user.email "actions@github.com"
          # ONLY league files -- never the World Cup app's data.
          git add data/leagues data-raw/leagues data-raw/ucl data/ucl
          # A byte-level diff is ALWAYS non-empty: publish rewrites `updated` in
          # every league file each run. With the matchday cadence at 15 minutes
          # that meant 48 Render deploys a day, nearly all of them shipping only
          # a new timestamp -- which is how the account hit its build-minute
          # spend limit on 2026-08-22 and stopped deploying at all. The gate
          # below asks whether anything a reader would SEE actually changed.
          if git diff --cached --quiet || ! python -m scripts.deploy_needed; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No meaningful league changes to publish."
            git reset -q
          else
            # Captured BEFORE committing: the commit this job actually started
            # from. A cold-cache publish can take 50+ minutes, comfortably
            # longer than the gap between scheduled triggers, so by the time we
            # get here another run may already have finished and pushed FRESHER
            # data. A bare `git push` failing on that is not really a failure --
            # it means someone else's more current publish already landed.
            BASE=$(git rev-parse HEAD)
            git commit -m "auto: leagues refresh $(date -u +%Y-%m-%d)"
            git fetch -q origin main
            REMOTE=$(git rev-parse origin/main)
            if [ "$REMOTE" != "$BASE" ]; then
              # Deliberately do NOT rebase/merge and retry: two independent runs
              # rarely produce byte-identical JSON, so forcing our (now-stale)
              # commit on top would risk a real conflict on the data files
              # themselves. The other run's data supersedes ours and its own
              # push already triggered its own deploy, so standing down here is
              # correct, not a compromise -- and it lets the job conclude as a
              # SUCCESS, which is what allows the soccerdata cache below to
              # actually save. A job that fails at this step, for any reason,
              # skips that save every time, which is why the cache had never
              # once warmed up despite several genuinely successful publishes.
              echo "origin/main advanced from $BASE to $REMOTE while this run was publishing -- a fresher run already landed, standing down instead of forcing stale data over it."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              git push
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Render is connected by public Git URL and does NOT auto-deploy on push,
      # so the redeploy must be triggered explicitly.
      - name: Trigger Render deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          # Strip whitespace defensively (cheap, never hurts), but this was NOT
          # the actual cause of the failures found today -- the real one was
          # worse: the secret held the local FILE PATH used for manual deploys
          # (C:\Users\...\...txt) instead of the URL that file contains. The
          # leading "C:" got parsed as a host with a non-numeric "port", which
          # is why curl's own error was "Port number was not a decimal number
          # between 0 and 65535". The shape check below catches that class of
          # mistake with a clear message instead of a cryptic curl exit code.
          HOOK="$(printf '%s' "$HOOK" | tr -d '[:space:]')"
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set -- data was pushed but the site was not redeployed."
            exit 1
          fi
          case "$HOOK" in
            https://api.render.com/deploy/*) ;;
            *) echo "::error::RENDER_DEPLOY_HOOK does not look like a Render deploy hook URL -- check the secret holds the hook itself, not a file path or something else pasted by mistake."
               exit 1 ;;
          esac
          code=$(curl --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 30 -sS -o /dev/null \
            -w "%{http_code}" -X POST "$HOOK")
          echo "deploy hook responded $code"
          # 202 = accepted (queued async) is Render's normal response too -- a run
          # on 2026-07-24 got 202, was flagged FAILED here, and the deploy went
          # through fine anyway. Treat all three as success.
          [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "202" ]

      # Nothing above this line reaches a human. The gate correctly refuses to ship
      # a bad publish and the page correctly warns readers after 72h, but the owner
      # only finds out via GitHub's failure email -- which is easy to miss for a job
      # that normally succeeds silently every week. This says it out loud.
      #
      # if: failure() so it fires for ANY failed step above (fetch, gate, tests,
      # deploy), not just the last one. Skipped silently when the secret is absent,
      # because a missing notifier must never itself fail the run.
      - name: Alert on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "No Telegram secrets set; skipping alert."
            exit 0
          fi
          TEXT="Leagues pipeline FAILED ($(date -u +%Y-%m-%d\ %H:%M) UTC).
          Check the named failed step in Actions. A failure after the commit step may mean data was pushed but Render was not refreshed.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${TEXT}" >/dev/null
          echo "Alert sent."
