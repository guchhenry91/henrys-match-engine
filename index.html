// Reliability / calibration: does a stated confidence actually match its real
// hit rate? Confidence tiers (1-5) already map to fixed probability bands via
// publish.py's _confidence(), and by_confidence already tracks correct/total
// per tier on BOTH boards -- this is a pure display of data that already
// exists, not a new measurement. Tiers are pooled across match-winner AND
// player-prop picks: the question ("does the model's 70%+ actually land 70%+
// of the time") is the same regardless of which board the pick came from.
const CAL_BANDS=[
  {tier:"1",label:"<40%",lo:33,hi:40},
  {tier:"2",label:"40–50%",lo:40,hi:50},
  {tier:"3",label:"50–60%",lo:50,hi:60},
  {tier:"4",label:"60–70%",lo:60,hi:70},
  {tier:"5",label:"70%+",lo:70,hi:95}];
const calScale=v=>Math.max(0,Math.min(100,(v-30)/70*100));
function combinedByConfidence(){
  const out={};
  [(DATA.best||{}).record, (DATA.player_picks||{}).record].forEach(rec=>{
    const bc=(rec||{}).by_confidence||{};
    Object.keys(bc).forEach(t=>{
      const cur=out[t]||{correct:0,total:0};
      out[t]={correct:cur.correct+(bc[t].correct||0), total:cur.total+(bc[t].total||0)};
    });
  });
  return out;
}
function calibrationBlock(){
  const bc=combinedByConfidence();
  const rows=CAL_BANDS.map(b=>({...b, ...(bc[b.tier]||{correct:0,total:0})})).filter(r=>r.total>0);
  if(!rows.length){
    return `<div class="eyebrow mt">Calibration</div><div class="glass stat"><div class="k">—</div>
      <div class="l">Fills in once picks settle: does a stated confidence actually land that often?</div></div>`;
  }
  const body=rows.map(r=>{const actual=100*r.correct/r.total, expect=(r.lo+r.hi)/2;
    return `<div class="calrow"><div class="calband">${r.label}<span class="caln">n=${r.total}</span></div>
      <div class="caltrack"><div class="rail"></div>
        <div class="expect" style="left:${calScale(expect)}%"></div>
        <div class="actual" style="left:${calScale(actual)}%" title="${Math.round(actual)}% actual">${Math.round(actual)}</div>
      </div></div>`;}).join("");
  return `<div class="eyebrow mt">Calibration · stated confidence vs. actual hit rate</div>
    <div class="glass cal">${body}</div>
    <div class="callegend"><span><i class="dot" style="background:var(--sub)"></i>model's stated confidence</span>
      <span><i class="dot" style="background:linear-gradient(150deg,var(--cyan),var(--lime))"></i>actual result</span></div>
    <p class="note">If the dot sits near the grey tick, a stated confidence means what it says. Off to the right = the model is underselling itself; off to the left = overconfident.</p>`;
}
// bet365's 6 Scores Challenge. Built to be MEASURED, not to imply a jackpot:
// in the Premier League this engine hits 11.84% per scoreline against 12.37%
// for simply writing 1-1 every time, so the expected haul of six is under one.
// That number is printed at the top of the section rather than buried, because
// a correct-score board without it reads like a tip sheet.
function viewSix(){
  const s=DATA.six_scores;
  if(!s) return emptyState();
  const picks=s.picks||[], rec=s.record||{correct:0,total:0};
  let h=`<div class="glass stat"><div class="k">${s.expected_of_six!=null?s.expected_of_six:"—"}</div>
    <div class="l">expected correct of 6 · model ${s.hit_rate_pct}% vs ${s.baseline_pct}% for always 1-1</div></div>`;
  // Said up front, in words. A reader looking at 0/6 needs to know that is the
  // most likely single week, not a malfunction.
  if(s.outlook) h+=`<p class="note" style="margin-top:-2px">${esc(s.outlook)}</p>`;
  if(rec.total) h+=`<div class="glass stat"><div class="k">${rec.correct}/${rec.total}</div>
    <div class="l">Scorelines correct since launch</div></div>`;
  if(!picks.length){
    h+=`<div class="glass rowc">${emptyRow(s.missing_fixtures&&s.missing_fixtures.length
      ? "bet365's six include a fixture not in this matchweek — check the selection file"
      : "This week's six have not been published by bet365 yet")}</div>`;
  } else {
    h+=`<div class="eyebrow">${s.matchweek?`Matchweek ${s.matchweek} · `:""}the model's six</div>
      <div class="glass rowc">${picks.map(p=>{
      // TWO scores, side by side. The top one is the entry; the second is there
      // because the first is only ~12% likely and a lone number would overstate it.
      const alt=(p.alternatives||[])[0];
      return `<div class="rw static"><span class="lgtag" style="background:${LC.PL}"></span>
        <div class="info"><b>${p.rank?`${p.rank}. `:""}${esc(p.home)} v ${esc(p.away)}</b>
          <span>${whenStr(p.date)} · ${p.agrees_with_match_pick?"agrees with match pick":`match pick ${esc(p.match_pick||"—")}`}${p.provisional?"":" · locked"}</span></div>
        <div class="conf" style="min-width:104px">
          <b>${esc(p.score)}</b> <span style="font-size:11.5px">${p.score_pct}%</span>
          ${alt?`<span style="display:block;margin-top:2px;font-size:10.5px;opacity:.7">or ${esc(alt.score)} ${alt.pct}%${
            p.gap_to_next_pp!=null?` &middot; costs ${p.gap_to_next_pp}pp`:""}</span>`:""}
        </div></div>`;
    }).join("")}</div>`;
  }
  h+=`<p class="note">Ranked by how confident the model is, most confident first &mdash; these six are not equally hopeless, and that ordering is the only real steer this market allows. Two scores per fixture, because one would overstate it. &ldquo;Costs Xpp&rdquo; is what you give up by playing the second score instead of the first; it is usually two or three points, so differentiating from everyone else writing 1-1 is close to free. These are the likeliest and second-likeliest results from each side&rsquo;s expected goals — and the leader usually sits near 12%, so the model is really saying it does not know, and most weeks neither will be right. Evenly matched sides come out 1-1 because with about 1.3 goals a side that genuinely is the least unlikely score; where the gap is real, so is the prediction. The six fixtures are chosen by bet365, not by the model. In the Premier League the model does not beat always guessing 1-1 — this board is published so that can be checked week by week rather than argued about.</p>`;
  if((s.settled||[]).length){
    h+=`<div class="eyebrow mt">Settled</div><div class="glass rowc">${s.settled.map(x=>`
      <div class="rw static"><span class="lgtag" style="background:${LC.PL}"></span>
        <div class="info"><b>${esc(x.home)} ${esc(x.actual)} ${esc(x.away)}</b><span>predicted ${esc(x.predicted)}</span></div>
        <span class="res ${esc(x.graded)}">${x.graded==="correct"?"HIT":"MISS"}</span></div>`).join("")}</div>`;
  }
  return h+archiveLink();
}

function nflWhen(iso){
  // DATE ONLY. The schedule feed carries a gameday with no kickoff time, so the
  // shared whenStr rendered every game at "00:00" -- a precise-looking number
  // that is not merely unknown but wrong.
  try{
    const d=new Date(iso);
    if(isNaN(d)) return "";
    return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  }catch(e){return "";}
}

function nflLastFive(p){
  // The five games the projection was built from, oldest first, with the most
  // recent marked. Actual numbers rather than an average, because "23, 145, 0,
  // 71, 88" and "65.4 average" describe very different players.
  const v=p.last_five||[];
  if(!v.length) return "";
  const td=p.market==="anytime_touchdown";
  return `<div class="l5">${v.map((x,i)=>{
    const hit=td?x>0:(p.line!=null&&x>p.line);
    const label=td?(x>0?"TD":"·"):Math.round(x);
    const last=i===v.length-1?" now":"";
    return `<i class="${hit?"hit":""}${last}">${label}</i>`;
  }).join("")}</div>`;
}

function nflFig(p){
  // The sub-label under the percentage, matching how the football player cards
  // read: the line the pick is against, not just a bare number.
  if(p.market==="anytime_touchdown") return "anytime";
  return p.line==null?"":`over ${p.line}`;
}

// Strength bands, reusing the tier vocabulary the football boards already use.
// Colour that MEANS something: a 78% rushing over and a 51% touchdown are both
// "picks" and are not remotely the same claim, and a board where every row is the
// same shade makes the reader do that arithmetic themselves. Bands are set where
// these markets actually sit -- props cluster between 50% and 85%, so soccer's
// thresholds would paint almost everything a single colour.
function nflTier(prob){
  if(prob>=0.70) return {cls:"t-elite",label:"Strong"};
  if(prob>=0.60) return {cls:"t-strong",label:"Solid"};
  return {cls:"t-lean",label:"Lean"};
}
function nflConfColour(prob){
  if(prob>=0.70) return "var(--lime)";
  if(prob>=0.60) return "var(--cyan)";
  return "var(--ink)";
}

function nflPropRow(p){

  // ruled OUT never reaches here -- publish removes him.
  const doubt=p.availability==="doubt"
    ? `<span class="mk w" title="${esc(p.injury_note||"")}">Doubt</span>` : "";
  const t=nflTier(p.probability);
  return `<div class="rw static">
    <div class="av" style="background:${nc(p.team)};font-size:${p.team.length>2?"13px":"15px"}">${esc(p.team)}</div>

    ${/* DOUBT REPLACES THE STRENGTH TIER, never sits beside it. Both plus the

    ${doubt || `<span class="tier ${t.cls}">${t.label}</span>`}

      <span style="color:${p.line!=null?"var(--ink)":"var(--sub)"}">${esc(nflFig(p))}</span></div></div>`;
}

function nflGameRow(g){

function viewNFL(){
  const d=DATA.nfl;
  if(!d) return emptyState();
  const ev=d.evidence||{};
  const chips=[["all","All"],["team_winner","Winners"],["anytime_touchdown","Anytime TD"],
               ["receiving_yards","Receiving"],["rushing_yards","Rushing"],["passing_yards","Passing"]];
  // Every pick on the board -- games and props together -- so the tier counts
  // describe the whole tab rather than whichever market is showing.
  const nflAll=(d.games||[]).concat(
    Object.values(d.props||{}).flatMap(b=>(b&&b.released&&b.picks)||[]));
  let h=`<div class="chips">${chips.map(c=>`<button class="chip ${filter===c[0]?"on":""}" type="button" onclick="setFilter('${c[0]}')">${c[1]}</button>`).join("")}</div>`
    + tierChips(nflAll);

  const tw=ev.team_winner||{};
  if(tw.n) h+=`<div class="glass stat"><div class="k">${pc(tw.accuracy)}%</div>
    <div class="l">Team winners on ${tw.n} games the model never saw · ${(tw.seasons_scored||[]).length} seasons</div></div>`;

  // THE LIVE RECORD, kept apart from the backtest above it. One is what the model
  // scored on seasons it never saw; the other is what THIS board's frozen picks
  // have actually done. Showing them as one number would let a good backtest
  // stand in for a live record that does not exist yet.
  const rec=d.record||{}, rw=rec.team_winner||{}, rp=rec.props||{};
  const recLine=(label,r)=>!r||!(r.settled||r.pending)?"":
    `<div class="rw static"><div class="info"><b>${label}</b><span>${
      r.settled?`${Math.round(100*r.hit_rate)}% of ${r.settled} graded`:"nothing graded yet"}${
      r.pending?` · ${r.pending} pending`:""}${r.void?` · ${r.void} void`:""}</span></div>
      <div class="conf" style="min-width:78px"><b>${r.correct}–${r.wrong}</b><span>frozen</span></div></div>`;
  if((rw.settled||rw.pending)||(rp.settled||rp.pending))
    h+=`<div class="eyebrow" style="margin-top:18px">Live record · frozen picks</div>
      <div class="glass rowc">${recLine("Team winner",rw)}${recLine("Player props",rp)}</div>`;

  const allMarkets=["anytime_touchdown","receiving_yards","rushing_yards","passing_yards"];
  const markets = filter==="all" ? allMarkets : filter==="team_winner" ? [] : [filter];

  if(filter==="all"||filter==="team_winner"){
    const games=(d.games||[]).filter(inTier).sort((a,b)=>b.p_pick-a.p_pick);
    h+=`<div class="eyebrow" style="margin-top:18px">Team winner · ${
      d.season?`week ${d.week} · `:""}${games.length} game${games.length===1?"":"s"}</div>
      <div class="glass rowc">${games.map(nflGameRow).join("")
        ||emptyRow("No games in the current slate")}</div>`;
  }

  // ONE SECTION PER MARKET, the same reasoning as the football player picks: a
  // 53% anytime touchdown and an 80% rushing over are both near the top of their
  // own market, and a single ranked list buries every touchdown pick.
  for(const m of markets){
    const block=(d.props||{})[m];
    if(!block) continue;
    const e=ev[m]||{}, name=(NFLMK[m]||{}).name||m;
    const full=(d.markets||{})[m]||name;
    if(!block.released){
      h+=`<div class="eyebrow" style="margin-top:18px">${esc(name)}</div>
        <div class="glass rowc">${emptyRow("Withheld — did not clear the release gate")}</div>`;
      continue;
    }
    const picks=(block.picks||[]).filter(inTier);
    // "All" is an OVERVIEW, not the whole database. Four markets at full length
    // is 111 rows of nearly identical cards -- the reader scrolls past the
    // touchdown board looking for the end of it and takes nothing in. The top few
    // per market here, the full list behind that market's own chip, which is how
    // the football player picks already behave.
    const overview = filter==="all";
    const shown = overview ? picks.slice(0, NFL_OVERVIEW) : picks;
    const more = picks.length - shown.length;
    const proof=e.n?` · ${e.n.toLocaleString()} unseen`:"";
    h+=`<div class="eyebrow" style="margin-top:18px">${esc(full)} · ${
      picks.length} pick${picks.length===1?"":"s"}${proof}</div>
      <div class="glass rowc">${shown.map(nflPropRow).join("")
        ||emptyRow("No picks in this market this week")}${
        more>0?`<div class="rw" onclick="setFilter('${m}')"><div class="info">
          <span>Show all ${picks.length} ${esc(full.toLowerCase())} picks →</span></div></div>`:""}</div>`;
  }

  const through=d.player_data_through||{}, inj=d.injury_report||{}, od=d.odds||{};
  h+=`<p class="note">Boxes are the last five games, oldest first, filled where the game beat the line — the same five the projection was built from. Lines are each player&rsquo;s own median, not a bookmaker price, so &ldquo;over&rdquo; means a better day than his typical one. Player data runs through ${through.season||"?"} week ${through.week||"?"}${
    inj.players_listed?`, and ${inj.players_listed} players carry an injury status from ${esc(inj.source||"the feed")} — anyone ruled out is off the board entirely` : ""}.</p>`;
  if(od.note) h+=`<p class="note" style="margin-top:-4px">${esc(od.note)}</p>`;
  if((d.caveats||[]).length)
    h+=`<div class="glass warnbox" style="margin-top:10px">${d.caveats.map(c=>`<div>· ${esc(c)}</div>`).join("")}</div>`;
  return h+archiveLink();
}

function uclRow(m){
  const pickHome=m.pick===m.home, pickDraw=m.pick==="Draw";
  const thin=(m.thin||[]).length
    ? `<span class="mk w" title="few Champions League matches behind this number">thin</span>` : "";
  return `<div class="rw static">
    <div class="av" style="background:${tc(m.home)};font-size:13px">${esc(initials(m.home))}</div>
    <div class="info"><b>${esc(m.home)} v ${esc(m.away)}</b>
      <span>${whenStr(m.date)} · pot ${m.home_pot} v pot ${m.away_pot} · ${m.home_matches}/${m.away_matches} prior matches</span></div>
    ${thin}${m.graded
      ? `<span class="res ${esc(m.graded)}">${m.graded==="correct"?"WON":(m.graded==="void"?"VOID":"LOST")}</span>`
      : `<span class="tier ${nflTier(m.p_pick).cls}">${nflTier(m.p_pick).label}</span>`}
    <div class="conf" style="min-width:88px"><b>${pc(m.p_pick)}%</b>
      <span>${esc(pickDraw?"draw":m.pick)}${m.locked?" · locked":""}</span></div></div>`;
}

const NBAMK={points:"Points",rebounds:"Rebounds",assists:"Assists",
  threes:"Threes made",team_winner:"Team winner"};

function viewNBA(){
  const d=DATA.nba;
  if(!d) return emptyState();
  const ev=d.evidence||{};
  const tw=ev.team_winner||{};

  // THE STATE IS THE HEADLINE. This tab has no picks and says so first, because a
  // page of impressive backtest numbers with no visible caveat reads as a live
  // board that happens to be empty today.
  let h=`<div class="glass warnbox">${esc(d.status_note||"")}</div>`;

  // TIER CHIPS APPEAR WITH THE PICKS, NOT BEFORE THEM. This tab publishes
  // evidence and no picks -- `games` and every `props[m].picks` are empty until
  // the fixture feed is wired in -- so tierChips() renders nothing today rather
  // than four chips that all read 0 and filter a page containing no picks. A
  // control that looks live and does nothing is the thing this codebase refuses.
  const nbaAll=(d.games||[]).concat(
    Object.values(d.props||{}).flatMap(b=>(b&&b.released&&b.picks)||[]));
  h+=tierChips(nbaAll);

  if(tw.n) h+=`<div class="glass stat"><div class="k">${pc(tw.accuracy)}%</div>
    <div class="l">Team winner on ${tw.n.toLocaleString()} games the model never saw · ${(tw.seasons_scored||[]).length} seasons · Brier ${tw.brier} against ${tw.baseline_brier} for home court</div></div>`;

  // A per-market link must actually show that market, or the label is a lie.
  const all=["points","rebounds","assists","threes"];
  const shown=(filter==="all"||filter==="team_winner")?all:all.filter(m=>m===filter);
  h+=`<div class="eyebrow" style="margin-top:18px">${filter==="all"?"Player markets":esc(NBAMK[filter]||filter)} · ${(d.seasons_backtested||[]).length} seasons backtested</div><div class="glass rowc">`;
  for(const mk of shown){
    const v=ev[mk]; if(!v) continue;
    const af=v.above_floor||{};
    // BOTH NUMBERS, ALWAYS. Where MIN_LINE binds, the line is a constant rather
    // than the player's median, so the headline overstates the model on a
    // book-shaped line. Showing only the flattering one would be the kind of
    // number this repo refuses to publish.
    const floor=v.floor_share!=null?`${Math.round(v.floor_share*100)}% of lines sit at the quotable floor`:"";
    h+=`<div class="rw static">
      <div class="av" style="background:${v.released?"#00b767":"#7a3b3b"};font-size:13px">${v.released?"OK":"—"}</div>
      <div class="info"><b>${esc(NBAMK[mk]||mk)}</b>
        <span>${v.n.toLocaleString()} predictions · Brier ${v.brier} vs ${v.baseline_brier} baseline${floor?" · "+floor:""}</span>
        ${af.accuracy!=null?`<span>where the line is the player's own median: ${pc(af.accuracy)}% of ${af.n.toLocaleString()}</span>`:""}</div>
      ${v.released
        ? `<span class="tier ${nflTier(v.accuracy).cls}">${pc(v.accuracy)}%</span>`
        : `<span class="mk w" title="${esc((v.failures||[]).join('; '))}">withheld</span>`}
    </div>`;
  }
  h+=`</div>`;
  if(d.markets_withheld&&d.markets_withheld.length)
    h+=`<p class="note">Withheld: ${d.markets_withheld.map(m=>esc(NBAMK[m]||m)).join(", ")}. A market has to beat its baseline in EVERY scored season and stay calibrated; one that works in twelve seasons and fails in three is a coin that landed twelve times.</p>`;
  if((d.caveats||[]).length)
    h+=`<div class="glass warnbox" style="margin-top:10px">${d.caveats.map(c=>`<div>· ${esc(c)}</div>`).join("")}</div>`;
  return h+archiveLink();
}

function viewUCL(){
  const d=DATA.ucl;
  if(!d) return emptyState();
  const ev=d.evidence||{};
  let h=tierChips(d.matches||[]);
  if(ev.n) h+=`<div class="glass stat"><div class="k">${ev.rps}</div>
    <div class="l">RPS over ${ev.n.toLocaleString()} matches the model never saw, against ${ev.rps_baseline} for home advantage · ${(ev.seasons_scored||[]).length} seasons</div></div>`;

  // THE RECORD. Published from the frozen picks log, so what is counted here is
  // what the board showed before kickoff -- never a re-pick made afterwards.
  const rec=d.record||{};
  if(rec.settled)
    h+=`<div class="glass stat"><div class="k">${rec.correct}–${rec.wrong}</div>
      <div class="l">Champions League picks · ${Math.round(100*rec.hit_rate)}% of ${rec.settled} graded${
        rec.pending?` · ${rec.pending} pending`:""}${
        rec.void?` · ${rec.void} void`:""}</div></div>`;
  else if(rec.pending)
    h+=`<div class="glass stat"><div class="k">${rec.pending}</div>
      <div class="l">Picks frozen and awaiting results · nothing graded yet</div></div>`;

  const ms=(d.matches||[]).filter(inTier);
  h+=`<div class="eyebrow" style="margin-top:18px">League phase · ${ms.length} fixture${ms.length===1?"":"s"}</div>
    <div class="glass rowc">${ms.slice(0,40).map(uclRow).join("")
      ||emptyRow("The draw is made but the fixture list has not been published by the feed yet")}</div>`;

  // THE CLUBS AND WHAT STANDS BEHIND EACH NUMBER. A strength fitted from 182
  // matches and one seeded from none render identically unless the board says
  // which is which, and the second is the one to discount.
  const byPot={};
  for(const c of (d.clubs||[])) (byPot[c.pot]=byPot[c.pot]||[]).push(c);
  h+=`<div class="eyebrow" style="margin-top:18px">The 36, by draw pot</div><div class="glass rowc">`;
  for(const pot of Object.keys(byPot).sort()){
    h+=`<div class="rw static"><div class="info"><b>Pot ${pot}</b><span>${
      byPot[pot].map(c=>{
        const mark=c.basis==="seeded"?" †":c.basis==="thin"?" •":"";
        return esc(c.club)+mark;
      }).join(" · ")}</span></div></div>`;
  }
  h+=`</div>`;
  const seeded=(d.clubs||[]).filter(c=>c.basis==="seeded").length;
  const thin=(d.clubs||[]).filter(c=>c.basis==="thin").length;
  h+=`<p class="note">Strengths come from ${d.history.matches.toLocaleString()} Champions League and qualifying matches over ${d.history.seasons} seasons. &dagger; ${seeded} club${seeded===1?"":"s"} with no history in that window, seeded at the weakest sides&rsquo; strength. &bull; ${thin} more with fewer than 20 matches. Domestic form is not an input, so a club in poor league form still carries its European record.</p>`;
  if((d.caveats||[]).length)
    h+=`<div class="glass warnbox" style="margin-top:10px">${d.caveats.map(c=>`<div>· ${esc(c)}</div>`).join("")}</div>`;
  return h+archiveLink();
}

// HIT / MISS / VOID, the same three words everywhere. The tab previously said
// "WON"/"LOST" on matches and nothing at all on props.
function verdictChip(g){
  if(g==="correct") return `<span class="res correct">HIT</span>`;
  if(g==="void") return `<span class="res void">VOID</span>`;
  return `<span class="res wrong">MISS</span>`;
}
function tally(items){
  const t={correct:0,wrong:0,void:0};
  items.forEach(i=>{ if(t[i.graded]!=null) t[i.graded]++; });
  const settled=t.correct+t.wrong;
  return {...t, settled, pct: settled?Math.round(100*t.correct/settled):null};
}
function tallyLine(t){
  return `${t.correct} hit · ${t.wrong} missed${t.void?` · ${t.void} void`:""}`
    + (t.pct!=null?` · ${t.pct}%`:"");
}

// WHAT ACTUALLY HAPPENED, in the market's own units. A prop row that shows only
// HIT or MISS asks the reader to trust it; "0 on target" against "1+ shot on
// target" shows the working, and is the difference between a record and a claim.
function actualLabel(p){
  const a=p.actual;
  if(a==null) return "not recorded";
  if(p.market==="goal") return a===0?"no goal":`${a} goal${a===1?"":"s"}`;
  if(p.market==="shots") return `${a} attempt${a===1?"":"s"}`;
  if(p.market==="sot") return `${a} on target`;
  if(p.market==="anytime_touchdown") return a?`${a} TD`:"no TD";
  if(String(p.market||"").endsWith("_yards")) return `${a} yards`;
  return `${a}`;
}

// The soccer boards publish the line as a PHRASE ("1+ shot on target"); the NFL
// publishes a NUMBER, which on its own reads as a bare "45.5" with no hint of
// which side was taken. Both are rendered as something a reader can settle
// against without knowing which engine produced it.
function lineLabel(p){
  const name=(MK[p.market]||NFLMK[p.market]||{name:p.market}).name;
  if(p.line==null) return p.market==="anytime_touchdown"?"anytime TD":name;
  return typeof p.line==="number" ? `over ${p.line}` : p.line;
}

// `showMarket` is false inside a single-market view: the heading already says
// ATTEMPTS, so a chip repeating it on all 23 rows is noise that costs the width
// the fixture and date need, and pushes every row to four wrapped lines on a
// phone.
function gradedPropRow(p, showMarket){
  const m=MK[p.market]||NFLMK[p.market]||{tag:"a",name:p.market};
  return `<div class="rw static">
    <div class="av" style="background:${tc(p.team)}">${esc(initials(p.player))}</div>
    <div class="info"><b>${esc(p.player)}</b>
      <span>${esc(lineLabel(p))} → <b style="color:var(--txt)">${esc(actualLabel(p))}</b>
        · ${esc(p.home||"")} v ${esc(p.away||"")} · ${whenStr(p.date)}</span></div>
    ${showMarket===false?"":`<span class="mk ${m.tag}">${esc(m.name)}</span>`}
    <div class="conf" style="min-width:46px"><b>${p.p_pick!=null?pc(p.p_pick)+"%":"—"}</b></div>
    ${verdictChip(p.graded)}</div>`;
}

// EVERY settled prop, grouped by the market it was graded in. Markets are scored
// apart for the same reason publish.py records them apart: a 45% anytime pick and
// an 80% attempts pick are each near their own market's ceiling, so a pooled
// number describes neither.

function gradedMatchRow(m){
  // THE TWO ENGINES STORE A RESULT DIFFERENTLY. Soccer keeps {home_goals,
  // away_goals}; the NFL log keeps a formatted string ("SEA 24-20 NE") because
  // it is keyed by game_id and grading writes the scoreline whole. Reading
  // .home_goals off the string printed "undefined-undefined", so both shapes are
  // handled rather than one being assumed.
  const r=m.result;
  const score=(r&&typeof r==="object")?`${r.home_goals}–${r.away_goals}`:"";
  const line=(typeof r==="string"&&r) ? esc(r)
    : `${esc(m.home)} ${score} ${esc(m.away)}`;
  return `<div class="rw static"><span class="lgtag" style="background:${m.colour||"#37e6d8"}"></span>
    <div class="info"><b>${line}</b>
      <span>pick ${esc(m.pick||"—")} · ${esc(m.league||"")} · ${whenStr(m.date)}</span></div>
    ${m.p_pick!=null?`<div class="conf" style="min-width:46px"><b>${pc(m.p_pick)}%</b></div>`:""}
    ${verdictChip(m.graded)}</div>`;
}

// EVERY settled match pick, at any confidence -- not the Best board's slice. The
// board only publishes p>=0.65, so a record drawn from it alone describes the
// model's most confident calls and quietly omits the rest.

// The settled picks behind the record, collected once so the chip row and the
// lists cannot disagree about what exists. A chip is only drawn for a market
// that actually has graded picks -- this codebase's own rule is that a link
// which looks live and does nothing is worse than no link.

// Market order is the boards' own, not whatever order the settled list happens
// to arrive in, so the chips do not reshuffle as results land.
const GRADE_MARKETS=["goal","shots","sot",
                     "anytime_touchdown","receiving_yards","rushing_yards","passing_yards"];
// THE SAME WORDS THE OTHER TABS USE. MK calls the goalscorer market "Goal" for a
// narrow row chip, but Player Picks and the NFL board both label their filters
// "Anytime" / "Receiving" -- a reader who taps "Anytime" on one tab and finds
// "Goal" on another has to work out they are the same market.
const GRADE_LABEL={goal:"Anytime", shots:"Attempts", sot:"On target",
                   anytime_touchdown:"Anytime TD", receiving_yards:"Receiving",
                   rushing_yards:"Rushing", passing_yards:"Passing"};
const gradeName=m=>GRADE_LABEL[m]||(MK[m]||NFLMK[m]||{name:m}).name;

// THE ORDER IS CURATED; THE MEMBERSHIP IS NOT. GRADE_MARKETS fixes the order so
// the chips do not reshuffle as results land, but any market present in the data
// and missing from it is APPENDED rather than dropped. A hardcoded list is how
// Serie A went unaudited for its whole life, and here the failure would be worse
// than silent: with one market per chip, a market nobody listed would have no
// chip, and its graded picks would be unreachable from the tab entirely.
function gradeMarketsPresent(props){
  const found=[];
  props.forEach(p=>{ if(p.market&&!found.includes(p.market)) found.push(p.market); });
  return GRADE_MARKETS.filter(m=>found.includes(m))
    .concat(found.filter(m=>!GRADE_MARKETS.includes(m)));
}


// ONE market at a time. Every graded pick in it, uncapped -- the point of the
// chips is that the reader chooses a short list, not that the list is trimmed
// for them.
// --- Grades, scoped by sport ---------------------------------------------------
//
// SPORT FIRST, THEN MARKET. Every sport's record used to be poured into one list:
// NFL team winners and Champions League picks sat in "Every match pick" beside
// Premier League games, and NFL props sat among soccer's. Each sport is scored on
// its own model and its own markets, so a pooled row count describes none of
// them. The tab now scopes to one sport at a time and offers that sport's
// markets beneath it -- the same two-level filter the reader already uses to
// narrow a board.
const GSPORTS=[["soccer","Soccer"],["nfl","NFL"],["ucl","Champions League"],["nba","NBA"]];
const GMATCH_LABEL={soccer:"Every match pick", nfl:"Team winner",
                    ucl:"Every Champions League pick"};
let gsport="soccer";
function setGSport(s){ gsport=s; filter="all"; render(cur); }

function gradedProps(sport){
  sport=sport||gsport;
  let all=[];
  if(sport==="soccer") all=((DATA.player_picks||{}).settled||[]).slice();
  // NFL props settle into their own board's settled list.
  if(sport==="nfl") all=(((DATA.nfl||{}).settled)||[]).filter(p=>p.market&&p.player);
  return all.sort((a,b)=>new Date(b.date||b.kickoff)-new Date(a.date||a.kickoff));
}
function gradedMatches(sport){
  sport=sport||gsport;
  const all=[];
  if(sport==="soccer"){
    // THE PROBABILITY IS NOT IN THE SEASON ARRAY. Those entries carry id, teams,
    // result, pick and graded -- no p_pick, because the board publishes the
    // number only for picks that cleared the Best bar. So it is joined back from
    // best.settled by league and fixture id where it exists, and simply omitted
    // where it does not.
    const prob={};
    (((DATA.best||{}).settled)||[]).forEach(s=>{ prob[`${s.league_key}:${s.id}`]=s.p_pick; });
    Object.keys(FILES).forEach(k=>{
      ((DATA[FILES[k]]||{}).season||[]).forEach(m=>{
        if(m.result&&m.graded) all.push({...m, league:LG[k], colour:LC[k],
                                         p_pick:prob[`${k}:${m.id}`]});
      });
    });
  }
  if(sport==="ucl")
    (((DATA.ucl||{}).settled)||[]).forEach(m=>all.push({...m, league:"Champions League", colour:"#8b7bff"}));
  if(sport==="nfl")
    (((DATA.nfl||{}).settled)||[]).forEach(g=>{
      if(!g.market) all.push({...g, league:"NFL", colour:"#37a9e6", date:g.date||g.kickoff});
    });
  return all.sort((a,b)=>new Date(b.date)-new Date(a.date));
}
const gradedCount=s=>gradedProps(s).length+gradedMatches(s).length;

// One labelled row per filter level, the way the rest of the page narrows a
// board. A label names what the row controls, so "NFL" under SPORT and "Winners"
// under MARKET can never be mistaken for the same kind of choice.
function frow(label, chipsHtml){
  if(!chipsHtml) return "";
  return `<div class="frow"><div class="flab">${esc(label)}</div>${chipsHtml}</div>`;
}
function sportChips(){
  return `<div class="chips">${GSPORTS.map(([k,name])=>
    `<button class="chip ${gsport===k?"on":""}" type="button" onclick="setGSport('${k}')">${
      esc(name)} <span class="rng">${gradedCount(k)}</span></button>`).join("")}</div>`;
}
function gradeFilters(){
  return `<div class="glass fpanel">${frow("Sport", sportChips())}${frow("Market", gradeChips())}</div>`;
}

function gradeChips(){
  const props=gradedProps();
  const chips=[["all","Summary"]];
  if(gradedMatches().length) chips.push(["matches", gsport==="nfl"?"Winners":"Matches"]);
  gradeMarketsPresent(props).forEach(m=>{
    const n=props.filter(p=>p.market===m).length;
    if(n) chips.push([m, `${gradeName(m)} ${n}`]);
  });
  if(chips.length===1) return "";
  return `<div class="chips">${chips.map(c=>
    `<button class="chip ${filter===c[0]?"on":""}" type="button"
       onclick="setFilter('${c[0]}')">${esc(c[1])}</button>`).join("")}</div>`;
}

// A sport with nothing settled says WHY, rather than rendering an empty panel
// that looks like a failed load.
function gradeEmpty(msg){
  return `<div class="glass stat"><div class="k">0–0</div><div class="l">${esc(msg)}</div></div>`;
}

function nflGradeSummary(){
  const rec=(DATA.nfl||{}).record||{};
  const tw=rec.team_winner||{}, pm=rec.props_by_market||{};
  const settled=(tw.settled||0)+((rec.props||{}).settled||0);
  let h=`<div class="eyebrow">NFL track record</div>`;
  h+=settled
    ? `<div class="glass stat"><div class="k">${(tw.correct||0)+((rec.props||{}).correct||0)}–${(tw.wrong||0)+((rec.props||{}).wrong||0)}</div>
        <div class="l">Winners and props · each market scored on its own below</div></div>`
    : gradeEmpty("No NFL pick has settled yet. Picks freeze before kickoff and grade once nflverse publishes the week's box scores.");
  h+=`<div class="glass rowc">${tierRow("Team winner","Moneyline pick",tw)}${
    Object.keys(pm).map(m=>tierRow(gradeName(m),"Player prop",pm[m])).join("")}</div>`;
  h+=everyPropBlock();
  h+=`<p class="note">A prop settles only where the player feed holds his own team in that week; where the feed is silent the pick stays pending rather than being graded a loss. A tie is void, never a loss.</p>`;
  return h;
}

function uclGradeSummary(){
  const rec=(DATA.ucl||{}).record||{};
  let h=`<div class="eyebrow">Champions League track record</div>`;
  h+=rec.settled
    ? `<div class="glass stat"><div class="k">${rec.correct}–${rec.wrong}</div>
        <div class="l">${Math.round(100*(rec.hit_rate||0))}% of ${rec.settled} graded${rec.pending?` · ${rec.pending} pending`:""}${rec.void?` · ${rec.void} void`:""}</div></div>`
    : gradeEmpty("No Champions League pick has settled yet.");
  if(gradedMatches("ucl").length)
    h+=`<div class="glass rowc"><div class="rw" onclick="setFilter('matches')">
      <div class="info"><b>Every pick</b><span>${tallyLine(tally(gradedMatches("ucl")))}</span></div>
      <span class="chev">›</span></div></div>`;
  h+=`<p class="note">Graded on the ninety-minute result and joined on the fixture id, never on club names.</p>`;
  return h;
}

function nbaGradeSummary(){
  const d=DATA.nba||{};
  return `<div class="eyebrow">NBA track record</div>
    ${gradeEmpty("No NBA picks exist to grade. The tab publishes fifteen seasons of validated evidence, not picks, until a fixture feed is wired in.")}
    <div class="glass rowc"><div class="rw" onclick="go('NBA')">
      <div class="info"><b>See the backtest evidence</b><span>${esc((d.markets_released||[]).length+" markets released · "+(d.seasons_backtested||[]).length+" seasons")}</span></div>
      <span class="chev">›</span></div></div>`;
}

function propMarketBlock(market){
  const rows=gradedProps().filter(p=>p.market===market);
  if(!rows.length) return "";
  const t=tally(rows);
  const name=gradeName(market);
  return `<div class="eyebrow">${esc(name)} · ${rows.length} graded</div>
    <div class="glass stat"><div class="k">${t.correct}–${t.wrong}</div>
      <div class="l">${tallyLine(t)}</div></div>
    <div class="glass rowc">${rows.map(r=>gradedPropRow(r,false)).join("")}</div>
    <p class="note">Every settled pick in this market. A pick with no shot row grades MISS rather than void — the feed cannot separate "did not play" from "played, never shot", so the harsher reading is taken deliberately: it can understate the record, never inflate it. VOID means the pick was tainted or the player was confirmed out before kickoff.</p>`;
}

function everyMatchBlock(){
  const all=gradedMatches();
  if(!all.length) return "";
  const t=tally(all);
  return `<div class="eyebrow">${esc(GMATCH_LABEL[gsport]||"Every match pick")} · ${all.length} graded</div>
    <div class="glass stat"><div class="k">${t.correct}–${t.wrong}</div>
      <div class="l">${tallyLine(t)} · every match called, at any confidence</div></div>
    <div class="glass rowc">${all.map(gradedMatchRow).join("")}</div>
    <p class="note">This counts every match the model called, not only those that cleared the Best Picks bar — the fuller and less flattering number.</p>`;
}

// The summary's per-market lines. Each is a tally and a way in, so the reader
// sees the shape of the record immediately and reaches any market in one tap --
// which is the whole reason the single 133-row list was replaced.
function everyPropBlock(){
  const props=gradedProps();
  if(!props.length) return "";
  const t=tally(props);
  const markets=gradeMarketsPresent(props);
  return `<div class="eyebrow mt">Player props · ${props.length} graded</div>
    <div class="glass stat"><div class="k">${t.correct}–${t.wrong}</div>
      <div class="l">${tallyLine(t)}</div></div>
    <div class="glass rowc">${markets.map(m=>{
      const rows=props.filter(p=>p.market===m), mt=tally(rows);
      return `<div class="rw" onclick="setFilter('${m}')">
        <div class="info"><b>${esc(gradeName(m))}</b>
          <span>${tallyLine(mt)}</span></div>
        <div class="conf" style="min-width:52px"><b>${mt.pct!=null?mt.pct+"%":"—"}</b></div>
        <span class="chev">›</span></div>`;
    }).join("")}</div>
    <p class="note">Markets are scored apart, never pooled: a 45% anytime pick and an 80% attempts pick are each near their own market's ceiling, so one combined number would describe neither. Tap a market to see every graded pick in it.</p>`;
}

function viewGrades(){
  // ONE MARKET AT A TIME. Every settled pick on one page came to 133 rows and
  // was unreadable -- the completeness was real and the tab was still useless,
  // because finding one market's record meant scrolling past four others. The
  // picks are all still here; the chips decide which of them is on screen.
  const chips=gradeFilters();
  // Newest graded first, above every summary, so a result is never buried.
  const latest=(filter==="all"&&gsport!=="nba")?latestSettled():"";
  if(gsport==="nba") return chips+nbaGradeSummary()+archiveLink();
  if(filter==="matches") return chips+everyMatchBlock()+archiveLink();
  if(filter&&filter!=="all"){
    const block=propMarketBlock(filter);
    // An unknown or emptied market falls back to the summary rather than
    // rendering a blank tab.
    if(block) return chips+block+archiveLink();
  }
  if(gsport==="nfl") return chips+latest+nflGradeSummary()+archiveLink();
  if(gsport==="ucl") return chips+latest+uclGradeSummary()+archiveLink();
  const best=DATA.best||{}, pp=DATA.player_picks||{}, par=DATA.parlays||{};
  const br=best.record||{correct:0,wrong:0,total:0};
  const total=br.total||0;
  let h=chips+latest+`<div class="eyebrow">Track record</div>
    <div class="glass stat"><div class="k">${br.correct}–${br.wrong}</div><div class="l">${total?`Best Picks · ${Math.round(100*br.correct/total)}% of ${total} graded`:"Graded picks · season starts 15 Aug"}</div></div>`;
  const rbm=pp.record_by_market||{};
  h+=`<div class="glass rowc">${tierRow("Best Picks","Match-winner board",best.record)}
    ${tierRow("Player · Anytime","Goalscorer market",rbm.goal)}
    ${tierRow("Player · Attempts","2+ shot attempts",rbm.shots)}
    ${tierRow("Player · On target","Shots on target",rbm.sot)}
    ${tierRow("Parlays","All-or-nothing accas",par.record)}</div>`;
  h+=`<p class="note">Every pick locks before kickoff and is graded against the frozen call — never re-scored with hindsight. Each market, and the parlays, are scored on their own.</p>`;

  // PLAYED FIXTURES THAT NEVER FROZE A PICK. Without this the record above looks
  // complete while quietly omitting games -- and the omission is not random, it
  // is whichever fixtures kicked off when the scheduler happened not to run. A
  // reader is entitled to see the sample the number is drawn from.
  const missed=[];
  for(const k of LGSLUGS)
    for(const m of ((DATA[k]||{}).unrecorded||[]))
      missed.push({...m, league:(DATA[k]||{}).league||k});
  if(missed.length){
    missed.sort((a,b)=>(a.date<b.date?1:-1));
    h+=`<div class="eyebrow" style="margin-top:18px">Not in the record · ${missed.length} played fixture${missed.length===1?"":"s"}</div>
      <div class="glass rowc">${missed.slice(0,12).map(m=>`<div class="rw static">
        <div class="info"><b>${esc(m.home)} v ${esc(m.away)}</b>
          <span>${whenStr(m.date)} · ${esc(m.league)}${m.score?` · finished ${esc(m.score)}`:""}</span></div>
        <span class="mk w">no pick</span></div>`).join("")}</div>
      <p class="note">These were played but never froze a pick, so they count neither way. A pick only enters the record if it was frozen before kickoff; when a scheduled run is dropped, the fixture leaves no entry at all. They are listed here because a record that hides them would describe only the games that happened to kick off near a run.</p>`;
  }

  h+=allPicksBlock();
  h+=everyPropBlock();
  h+=calibrationBlock();
  return h+archiveLink();
}

// EVERY match pick, not just the ones that cleared the Best Picks bar.
// The board above only counts picks at p>=0.65, so a graded 47% call was
// invisible here: on 15 Aug the model went 2-0 on La Liga's openers and the
// Grades tab still read 0-0, because neither pick was confident enough to
// join the headline board. That understates the record AND hides the honest
// half of it -- the low-confidence calls are exactly the ones a reader should
// be able to judge.
function allPicksBlock(){
  const rows=[]; let c=0,w=0,v=0;
  Object.keys(FILES).forEach(k=>{
    const d=DATA[FILES[k]]||{}; const r=d.record||{};
    if(r.total) rows.push({k,r});
    c+=r.correct||0; w+=r.wrong||0; v+=r.void||0;
  });
  const tot=c+w;
  if(!tot) return "";
  // THE PER-MATCH LIST LIVES IN everyMatchBlock() NOW. It used to be here,
  // capped at twelve rows -- which on a tab whose whole job is showing the
  // record meant most graded picks were simply not shown, and the cap was
  // invisible so the list read as complete.
  let h=`<div class="eyebrow" style="margin-top:22px">By league</div>
    <div class="glass stat"><div class="k">${c}–${w}</div>
    <div class="l">All leagues · ${Math.round(100*c/tot)}% of ${tot} graded${v?` · ${v} void`:""}</div></div>`;
  h+=`<div class="glass rowc">${rows.map(({k,r})=>
      tierRow(LG[k],`Match-winner picks`,r)).join("")}</div>`;
  const bar=Math.round(100*(((DATA.best||{}).min_probability)||0.65));
  // BY TIER. Pooling a 77% call with a 41% one produces a headline describing
  // neither, and the low-confidence picks are the ones with no board of their
  // own -- so they were being graded invisibly. publish already bands every pick
  // 1-5 by probability at lock time, so this is a display of data that exists.
  const BAND={5:"Elite · 70%+",4:"Strong · 60-70%",3:"Even · 50-60%",2:"Lean · 40-50%",1:"Longshot · under 40%"};
  const tiers={};
  Object.keys(FILES).forEach(k=>{
    const bc=((DATA[FILES[k]]||{}).record||{}).by_confidence||{};
    Object.entries(bc).forEach(([c,v])=>{
      const s=tiers[c]||(tiers[c]={correct:0,total:0});
      s.correct+=v.correct||0; s.total+=v.total||0;
    });
  });
  const bands=Object.keys(tiers).sort((a,b)=>b-a);
  if(bands.length)
    h+=`<div class="eyebrow" style="margin-top:18px">By confidence</div><div class="glass rowc">${
      bands.map(c=>tierRow(BAND[c]||`Band ${c}`,`${tiers[c].total} graded`,
        {correct:tiers[c].correct,wrong:tiers[c].total-tiers[c].correct,total:tiers[c].total})).join("")}</div>`;
  h+=`<p class="note">The board above counts only picks at ${bar}% or higher. This counts every match the model called, at any confidence — the fuller and less flattering number.</p>`;
  return h;
}

function standingsBlock(k){
  const d=DATA[FILES[k]]; const st=(d&&d.standings)||[];
  if(!st.length) return "";
  const started=st.some(t=>t.played>0);
  let h=`<div class="glass rowc"><div class="tr head"><span class="pos">#</span><span class="team">Club</span><span class="stnum">Pl</span><span class="stnum">GD</span><span class="pts">Pts</span></div>`;
  st.forEach((t,i)=>{const cls=started?(i<4?"top":(i>=st.length-3?"rel":"")):"";
    const badge=started?(i<4?`<span class="badge b-ucl">UCL</span>`:(i>=st.length-3?`<span class="badge b-rel">REL</span>`:"")):"";
    h+=`<div class="tr"><span class="pos ${cls}">${i+1}</span><span class="team">${esc(t.team)}</span>${badge}<span class="stnum">${t.played}</span><span class="stnum">${t.gd>0?"+":""}${t.gd}</span><span class="pts">${t.points}</span></div>`;});
  return h+`</div>`;
}
function viewTables(){
  const any=Object.keys(FILES).some(k=>((DATA[FILES[k]]||{}).standings||[]).length);
  if(!any) return emptyState();
  const started=Object.keys(FILES).some(k=>((DATA[FILES[k]]||{}).standings||[]).some(t=>t.played>0));
  let h=`<div class="sectsub" style="margin:0 2px 14px">${started?"Live league tables — actual points from results so far.":"The season table — fills in from real results once matches kick off (15 Aug)."} UCL = top four, REL = relegation.</div>`;
  Object.keys(FILES).forEach(k=>{h+=`<div class="eyebrow" style="color:${LC[k]}">${esc(LG[k])}</div>${standingsBlock(k)}`;});
  return h;
}
function viewLeague(k){
  const d=DATA[FILES[k]]; if(!d) return emptyState();
  const ms=(d.matches||[]).filter(m=>!m.result);
  if(!ms.length) return emptyState();
  // Fixtures only -- the full standings live in the Tables tab, not repeated here.
  // The row shows p.score: the most likely scoreline GIVEN the pick, so the card
  // never reads "pick Manchester United ... 1-1". top_scores[0] is a DIFFERENT
  // number -- the highest-probability score across ALL results -- and is one tap
  // away in the match view, where correct-score betting needs it.
  let h=`<div class="sectsub" style="margin:0 2px 12px">Home · draw · away, out of 100. What may happen, not what will.</div>`;
  for(const g of groupByDay(ms)){
    h+=`<div class="eyebrow" style="color:${LC[k]}">${esc(dayHeading(g.date))} · ${g.items.length} match${g.items.length===1?"":"es"}</div>
      <div class="glass rowc">${g.items.map(m=>{const p=m.prediction||{};
      return `<div class="rw" onclick="openMatch('${k}',${m.id})"><span class="lgtag" style="background:${LC[k]}"></span>
        <div class="info"><b>${esc(m.home)} v ${esc(m.away)}</b><span>${whenStr(m.date)} · ${esc(p.pick)} · ${esc(p.score||"–")} if it lands</span>
          ${hdaStrip(p)}</div><span class="chev">›</span></div>`;}).join("")}</div>`;
  }
  h+=`<p class="note">The score shown is the most likely one if the pick lands, so it always agrees with the pick. Tap a match for the highest-probability score across every result -- the better number for correct-score betting. Full standings are in the Tables tab.</p>`;
  return h;
}

function openMatch(lk,id){
  const d=DATA[FILES[lk]]; if(!d) return;
  const m=(d.matches||[]).find(x=>x.id===id); if(!m){render(cur);return;}
  const p=m.prediction||{};
  document.getElementById("sub").textContent="Match breakdown";
  const ph=pc(p.p_home),pd=pc(p.p_draw),pa=pc(p.p_away);
  // The headline score is p.score: the most likely scoreline GIVEN the pick, so
  // the card reads as one coherent call rather than "Pick: Man City ... 1-1".
  //
  // top_scores[0] is a DIFFERENT number -- the highest-probability score across
  // every result, which is measurably the better exact-score bet (12.60% vs
  // 10.69% top-1 accuracy over 3,958 walk-forward matches; on a six-fold
  // correct-score parlay that is ~1-in-249k vs ~1-in-671k). It is deliberately
  // NOT the headline -- coherence was chosen over that accuracy -- but it must
  // stay visible and labelled directly underneath, because correct-score
  // betting needs it and it is the stronger number for that job.
  const topsArr=(p.top_scores||[]);
  const best=topsArr[0];
  const sc=(p.score||"–").split("-");
  const bestPct=best?Math.round(best.pct||0):null;
  const tops=topsArr.slice(0,3).map(t=>`<div class="sl"><span class="sc">${esc(t.score)}</span>
    <span class="sb"><i style="width:${Math.min(100,(t.pct||0)*4.5)}%"></i></span><span class="sp">${Math.round(t.pct||0)}%</span></div>`).join("")||`<div class="rl">No scoreline spread available.</div>`;
  const reasons=(p.reasons||[]).map(r=>`<div class="rl">${esc(r)}</div>`).join("")||`<div class="rl">${esc(p.why||"")}</div>`;
  // Grouped BY TEAM. Previously this was a flat slice(0,5) over a 6-entry list
  // (top 3 per side), which always dropped the away team's third player and left
  // an unexplained 3-v-2 split. Nothing named the team either: tc() gives 66 of
  // the 76 clubs the same default colour, so the avatar identified nobody.
  // Probabilities only, all three from the same calibrated scale -- pairing a
  // calibrated "32% anytime" with a raw "3.4 attempts" invited reading the two
  // as if they agreed.
  const pct1=v=>v==null?"–":`${Math.round(Number(v))}%`;
  const propTeams=[m.home,m.away].map(t=>{
    const list=(m.props||[]).filter(pr=>pr.team===t)
      .sort((a,b)=>(b.anytime_pct||0)-(a.anytime_pct||0));
    // Name the team even when it has NO players, rather than quietly rendering a
    // one-sided list. A promoted side with no top-flight history gets no props by
    // design (MIN_SQUAD_FOR_PROPS); showing only the opponent makes that look
    // like a bug or, worse, like the club has nobody worth listing.
    if(!list.length) return `<div class="ptm">${esc(t)}</div>`+
      `<div class="rl">No player markets -- not enough top-flight history for this squad.</div>`;
    return `<div class="ptm">${esc(t)}</div>` + list.map(pr=>
      `<div class="leg"><div class="av" style="width:36px;height:36px;font-size:13px;background:${tc(pr.team)}">${esc(initials(pr.player))}</div>
    <div class="li2"><b>${esc(pr.player)}</b><span>${pct1(pr.anytime_pct)} goal · ${pct1(pr.p_shots_2plus)} 2+ shots · ${pct1(pr.p_sot_1plus)} 1+ on target</span></div></div>`).join("");
  }).join("");
  const props=propTeams;
  const ua=p.unmodeled_absences||{}; const uaAll=[...(ua.home||[]),...(ua.away||[])];
  const pickPct=Number.isFinite(Number(p.p_pick))?`${pc(p.p_pick)}%`:"–";
  // Model vs bookmakers. p.market is the de-vigged 1X2 line plus `edge` (model
  // probability MINUS market probability on the picked side). It is display-only:
  // no odds reach leagues/model.py, so nothing here changes a single prediction.
  // A gap is a DISAGREEMENT, not an edge in the betting sense -- the market may
  // simply be pricing team news the model cannot see -- and the copy says so
  // rather than letting a green number read as free money.
  // m.market, NOT p.market. `p` is m.prediction, and the market line is a
  // SIBLING of it on the match object. Reading it off the prediction gave
  // undefined every time, so this whole section silently rendered its "no line
  // posted" fallback even for fixtures that were priced -- which is why it never
  // looked broken. Caught only when a bet365 price was added and still did not
  // appear.
  const mk=m.market;
  // Number(null) is 0, which IS finite -- a bare Number.isFinite guard let a
  // null price through and rendered "Bookmakers 0% 0% 0%" while claiming the
  // model agreed with it. Reject null/undefined/"" explicitly.
  const priced=v=>v!=null&&v!==""&&Number.isFinite(Number(v));
  let marketSec="";
  if(mk && priced(mk.p_home) && priced(mk.p_draw) && priced(mk.p_away)){
    const e=priced(mk.edge)?Number(mk.edge):NaN, pts=Number.isFinite(e)?Math.round(Math.abs(e)*1000)/10:null;
    const agrees=Number.isFinite(e)&&Math.abs(e)<0.02;
    const edgeLine=pts==null?"":`<div class="mktedge" style="color:${agrees?"var(--sub)":(e>0?"var(--lime)":"var(--hot)")}">${
      agrees?`The model and the bookmakers broadly agree on ${esc(p.pick||"this pick")}.`
            :`The model rates ${esc(p.pick||"the pick")} ${pts} points ${e>0?"higher":"lower"} than the bookmakers.`}</div>`;
    // The PRICE as offered, undevigged, on its own row. The two rows above are
    // probabilities with the margin stripped out; this one is the number you
    // would actually be quoted, so it must never be "corrected".
    const o=mk.odds||{};
    const oddsRow=(priced(o.home)&&priced(o.draw)&&priced(o.away))
      ? `<div class="mktrow"><span>${esc(mk.book||"bookmaker")}</span>
           <b>${Number(o.home).toFixed(2)}</b><b>${Number(o.draw).toFixed(2)}</b><b>${Number(o.away).toFixed(2)}</b></div>`
      : "";
    // Expected value at that price, straight from the model's own probability.
    // Deliberately understated: the model does NOT beat the closing line (see
    // Honest limitations), so a positive number here is the model disagreeing
    // with bet365, not a detected profit. Presenting it as the latter would be
    // the one dishonest thing on this page.
    const evLine=priced(mk.ev)&&priced(mk.pick_odds)
      ? `<div class="mktedge" style="color:var(--sub)">At ${Number(mk.pick_odds).toFixed(2)} on ${esc(p.pick||"the pick")}, the model's ${Math.round((p.p_pick||0)*100)}% implies ${Number(mk.ev)>0?"+":""}${Math.round(Number(mk.ev)*100)}% expected value — the model's own arithmetic, not a profit forecast.</div>`
      : "";
    marketSec=`<div class="glass dsec"><h3>Model vs bookmakers</h3>
      <div class="mktrow mkthead"><span></span><b>Home</b><b>Draw</b><b>Away</b></div>
      <div class="mktrow"><span>Model</span><b>${ph}%</b><b>${pd}%</b><b>${pa}%</b></div>
      <div class="mktrow"><span>Bookmakers</span><b>${pc(mk.p_home)}%</b><b>${pc(mk.p_draw)}%</b><b>${pc(mk.p_away)}%</b></div>
      ${oddsRow}
      ${edgeLine}${evLine}
      <p class="note" style="padding-top:8px">The percentage rows are bookmaker prices with the margin removed, for comparison only -- no odds feed the model. The ${esc(mk.book||"bookmaker")} row is the decimal price as offered. A gap means the two disagree, not that there is money in it: the market is usually pricing late team news the model has not seen, and the model does not beat the closing line.</p></div>`;
  } else {
    marketSec=`<div class="glass dsec"><h3>Model vs bookmakers</h3>
      <p class="note" style="padding-top:0">No bookmaker line is posted for this fixture yet. The odds feed only carries about a week ahead, so lines appear a few days before kickoff.</p></div>`;
  }
  const app=document.getElementById("app");
  app.innerHTML=`<button class="back" type="button" onclick="render(cur)">‹ Back</button>
    <div class="glass dhead"><div class="lg">${esc(LG[lk])} · MW${m.matchweek}</div><div class="vs">${esc(m.home)} v ${esc(m.away)}</div>
      <div style="font-size:12px;font-weight:700;color:var(--sub)">Match Pick</div>
      <div style="font-size:15px;font-weight:800">${esc(p.pick||"–")} <span style="color:var(--sub);font-weight:600">(${pickPct})</span></div>
      <div class="score"><b>${esc(sc[0])}</b><span>Projected Score If Pick Lands</span><b>${esc(sc[1]||"")}</b></div>
      <div class="split"><div class="sh" style="flex:${ph||1}">${ph}%</div><div class="sd" style="flex:${pd||1}">${pd}%</div><div class="sa" style="flex:${pa||1}">${pa}%</div></div>
      <div style="font-size:11px;color:var(--sub);font-weight:650;margin-top:8px">${esc(m.home)} win · draw · ${esc(m.away)} win</div>
      <div style="font-size:11px;color:var(--cyan);font-weight:700;margin-top:6px">Highest-Probability Exact Score: ${esc(best?best.score:"–")}${bestPct!=null?" · "+bestPct+"%":""}</div>
      <p style="font-size:10.5px;color:var(--sub);font-weight:550;margin-top:6px;line-height:1.4">The score above the bar is the most likely one if the pick lands, so it always agrees with the pick. The highest-probability score is the single likeliest final score whoever wins -- the two differ when a draw is the biggest individual scoreline even though the pick is more likely to win overall. For correct-score betting, use the highest-probability score.</p></div>
    ${uaAll.length?`<div class="glass warnbox">Confirmed defensive/keeper absence not priced by the shot-based model: ${esc(uaAll.join(", "))}. Read the win probability with that in mind.</div>`:""}
    <div class="glass dsec"><h3>Top Exact Scores</h3>${tops}
      <p class="note" style="padding-top:8px">No single exact score is likely in football -- even the highest-probability score above is usually right well under 1 time in 5. Treat this as the model's honest best shot, not a confident call.</p></div>
    ${marketSec}
    <div class="glass dsec"><h3>Why this pick</h3>${reasons}</div>
    ${props?`<div class="glass dsec"><h3>Top players in this match</h3>${props}</div>`:""}`;
  window.scrollTo(0,0);
}

// Renders the CURRENT tab, not a hardcoded one. This said render("players"),
// which was invisible while Player Picks was the only view with chips -- and
// then the NFL tab got chips, and every one of them navigated the reader to
// soccer. `cur` already tracks the active tab for exactly this reason.
function setFilter(f){filter=f;render(cur);}
function daysToKickoff(up){const ds=up.map(u=>new Date(u.date)).filter(d=>!isNaN(d));if(!ds.length)return null;
  const first=new Date(Math.min(...ds));const diff=Math.ceil((first-new Date())/864e5);return diff>0?diff:0;}
function emptyRow(t){return `<div class="rw static"><div class="info"><span>${esc(t)}</span></div></div>`;}
function emptyState(){return `<div class="glass stat"><div class="k">Soon</div><div class="l">The board fills as fixtures approach — season starts 15 August.</div></div>${archiveLink()}`;}
function archiveLink(){return `<div class="arch"><a href="worldcup.html">World Cup 2026 archive — final record 64-26 (71%), champion Spain →</a></div>`;}

boot();
</script>
</body>
