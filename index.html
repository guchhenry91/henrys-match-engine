<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Henry's Match Engine</title>
<style>
  /* Sportsbook palette, referencing the bet365 layout: a dark green chrome bar
     over a near-black body, one saturated green carrying every affirmative
     signal, and flat panels instead of glass. Deliberately OUR branding on it --
     borrowing a visual language is design reference; borrowing a bookmaker's
     marks would be passing this off as theirs. */
  :root{
    --ink:#eef1ee; --sub:#9aa4a0; --line:rgba(255,255,255,.09);
    --glass:#1c2521; --glass2:#243029;
    --bar:#0b3d2c; --bar2:#12654a;      /* header gradient */
    --cyan:#00b767;                      /* the affirmative green */
    --lime:#39e57f; --violet:#5ec6ff; --hot:#ff5a5f; --amber:#ffbe3d;
    --r:10px;                            /* sportsbook cards are square-ish */
    --safe:calc(28px + env(safe-area-inset-bottom));
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
    color:var(--ink);background:#121815;overflow-x:hidden;min-height:100%}
  /* The aurora and dot grid are gone. A sportsbook page is flat and quiet so the
     numbers carry the attention; a glowing gradient behind a price list reads as
     decoration competing with the content. */
  body::before{content:"";position:fixed;top:0;left:0;right:0;height:190px;z-index:-2;
    background:linear-gradient(180deg,var(--bar) 0%,#0e1a15 68%,transparent 100%)}


  /* SHELL. One row: sidebar then content. The sidebar only exists where there is
     room for it -- below 900px the bottom nav already does this job, and a drawer
     would hide the same links behind an extra tap. */
  .shell{display:flex;align-items:flex-start;gap:0;max-width:1180px;margin:0 auto}
  .wrap{flex:1;min-width:0;max-width:640px;margin:0 auto;padding:16px 15px var(--safe)}

  aside#side{display:none;flex:0 0 232px;position:sticky;top:0;align-self:flex-start;
    max-height:100vh;overflow-y:auto;padding:18px 10px 30px;scrollbar-width:thin}
  aside#side::-webkit-scrollbar{width:6px}
  aside#side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
  .sgroup{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
    color:var(--cyan);padding:16px 12px 8px}
  .sitem{display:flex;align-items:center;gap:11px;width:100%;border:0;cursor:pointer;
    background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:650;
    padding:9px 12px;border-radius:8px;text-align:left;transition:background .12s}
  .sitem:hover{background:var(--glass)}
  .sitem.on{background:var(--glass2);color:#fff;font-weight:800;
    box-shadow:inset 3px 0 0 var(--cyan)}
  .sitem .ic{width:22px;flex:0 0 auto;text-align:center;font-size:15px}
  .sitem .ct{margin-left:auto;font-size:11px;font-weight:700;color:var(--sub);
    font-variant-numeric:tabular-nums}

  /* RAIL. The icon strip across the top of the content, as the reference has
     above its promos. Same targets as the sidebar, because two navigations that
     can disagree is a bug waiting to happen -- both are built from `views`. */
  .rail{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 12px;scrollbar-width:none;
    position:sticky;top:0;z-index:5;background:#121815;
    box-shadow:0 6px 12px -8px rgba(0,0,0,.9)}
  .rail::-webkit-scrollbar{display:none}
  .rtile{flex:0 0 auto;width:78px;border:1px solid var(--line);background:var(--glass);
    color:var(--sub);cursor:pointer;font:inherit;border-radius:9px;padding:9px 4px 8px;
    display:flex;flex-direction:column;align-items:center;gap:5px;transition:background .12s}
  .rtile:hover{background:var(--glass2)}
  .rtile.on{background:var(--cyan);border-color:transparent;color:#fff}
  .rtile .ic{font-size:19px;line-height:1}
  .rtile .lb{font-size:10px;font-weight:750;letter-spacing:.01em;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:100%}

  @media (min-width:900px){
    aside#side{display:block}
    /* With a sidebar present the rail is a second copy of the same twelve links,
       so it stands down rather than repeating them. */
    .rail{display:none}
    .wrap{padding-bottom:40px}
  }

  /* Full-bleed green masthead, the one piece of chrome that is not black. */
  header{display:flex;align-items:center;justify-content:space-between;
    padding:12px 15px;margin:-16px -15px 14px;
    background:linear-gradient(180deg,var(--bar2),var(--bar));
    border-bottom:1px solid rgba(0,0,0,.35);box-shadow:0 2px 14px rgba(0,0,0,.4)}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-weight:850;font-size:17px;color:#07120d;
    background:linear-gradient(150deg,#ffe14d,#ffc400)}   /* the accent that is not green, so it reads as a mark */
  .brand h1{font-size:16.5px;font-weight:800;letter-spacing:-.02em}
  .brand p{font-size:11px;color:rgba(255,255,255,.62);font-weight:600}
  .live{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#0b3d2c;
    padding:6px 11px;border-radius:14px;border:0;background:#39e57f}

  /* Flat panels. Backdrop blur is a phone-OS idiom; a book uses opaque cards so
     a dense list of prices stays legible at small sizes. */
  .glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
    
    box-shadow:0 16px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08)}
  /* Uppercase section labels with a green marker, as the reference does for
     "HOT SHOTS" / "MAIN MEN ON TARGET" -- the market is named before the
     selections, so a scanning reader knows what they are looking at. */
  .eyebrow{border-left:3px solid var(--cyan);padding-left:9px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin:2px 2px 10px}
  .eyebrow.mt{margin-top:22px}
  main{animation:in .4s ease both}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip .rng{opacity:.62;font-weight:650;font-size:.92em}
  /* Labelled filter rows: SPORT, then MARKET. The label names the level so a
     sport chip and a market chip are never read as the same kind of choice. */
  .fpanel{padding:4px 16px;margin-bottom:16px}
  .frow{display:flex;align-items:center;gap:14px;padding:10px 0}
  .frow+.frow{border-top:1px solid var(--line)}
  .flab{flex:0 0 66px;font-size:11px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;color:var(--cyan)}
  .frow .chips{padding:0;flex:1;min-width:0}
  @media (max-width:520px){.frow{flex-direction:column;align-items:stretch;gap:8px}
    .flab{flex:none}}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--glass);color:var(--sub);
    font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:20px;cursor:pointer;transition:.2s;white-space:nowrap;
    }
  .chip.on{color:#fff;background:var(--cyan);border-color:transparent;font-weight:800}

  .hero{position:relative;padding:22px 20px;margin-bottom:14px;overflow:hidden;cursor:pointer}
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;
    background:radial-gradient(circle,rgba(0,183,103,.4),transparent 70%);filter:blur(6px)}
  .hero .lg{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
  .hero .mt2{font-size:26px;font-weight:850;letter-spacing:-.03em;margin:8px 0 4px;line-height:1.04;position:relative;z-index:1}
  .hero .pk{font-size:13.5px;color:var(--sub);font-weight:650;position:relative;z-index:1}
  .hero .pk b{color:var(--lime)}
  .hero .num{position:relative;z-index:1;margin-top:16px;display:flex;align-items:baseline;gap:8px}
  .hero .num b{font-size:50px;font-weight:850;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
    background:linear-gradient(150deg,var(--cyan),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .num span{font-size:13px;color:var(--sub);font-weight:650}
  .hero .go{position:absolute;right:18px;bottom:18px;z-index:1;font-size:12px;font-weight:750;color:var(--cyan)}

  .tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
  .tile{padding:14px 12px;text-align:center}
  .tile .k{font-size:24px;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .tile .k.grad{background:linear-gradient(150deg,var(--cyan),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tile .l{font-size:10.5px;color:var(--sub);font-weight:650;margin-top:3px;letter-spacing:.02em}

  .rowc{padding:6px;margin-bottom:14px}
  .rw{display:flex;align-items:center;gap:13px;padding:14px 14px;border-radius:16px;position:relative;cursor:pointer;transition:background .15s}
  .rw+.rw{margin-top:2px}
  .rw:active{background:var(--glass2)}
  .rw.static{cursor:default}
  .lgtag{width:4px;align-self:stretch;border-radius:4px;flex:0 0 auto;min-height:34px}
  .rw .info{flex:1;min-width:0}
  .rw .info b{font-size:15.5px;font-weight:750;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
  .rw .info span{font-size:12px;color:var(--sub);font-weight:600}
  .conf{flex:0 0 auto;text-align:right;min-width:96px}
  .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--lime));box-shadow:0 0 12px rgba(0,183,103,.6)}
  .conf b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
  .conf span{font-size:11px;color:var(--sub);font-weight:600}
  .chev{color:var(--sub);font-size:18px;flex:0 0 auto;margin-left:-4px}
  .tier{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;flex:0 0 auto}
  .t-elite{color:#05070f;background:var(--lime)}
  .t-strong{color:var(--cyan);background:rgba(0,183,103,.14);border:1px solid rgba(0,183,103,.25)}
  .t-lean{color:var(--sub);background:rgba(255,255,255,.06)}
  .res{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;flex:0 0 auto}
  .res.correct{color:#05070f;background:var(--lime)}.res.wrong{color:#fff;background:var(--hot)}.res.void{color:var(--sub);background:rgba(255,255,255,.06)}

  .av{width:44px;height:44px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;font-weight:800;font-size:15px;color:#05070f}
  .mk{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:8px;
    color:var(--cyan);background:rgba(0,183,103,.12);border:1px solid rgba(0,183,103,.22);flex:0 0 auto}
  .mk.g{color:var(--lime);background:rgba(57,229,127,.12);border-color:rgba(57,229,127,.25)}
  .mk.a{color:var(--cyan);background:rgba(0,183,103,.12);border-color:rgba(0,183,103,.22)}
  .mk.o{color:var(--violet);background:rgba(94,198,255,.14);border-color:rgba(94,198,255,.28)}
  .mk.w{color:var(--amber);background:rgba(255,190,61,.12);border-color:rgba(255,190,61,.28)}
  .mk.r{color:#ff8f6a;background:rgba(255,143,106,.12);border-color:rgba(255,143,106,.26)}
  .mk.p{color:#6ab8ff;background:rgba(106,184,255,.12);border-color:rgba(106,184,255,.26)}
  /* Confidence band. Same chip shape as .mk so a row reads as one object, but
     a distinct colour ramp: these are the model's own bands, cold for a coin
     flip and warm as it commits. */
  .cf{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;
    border-radius:8px;flex:0 0 auto;white-space:nowrap}
  .cf.c5{color:var(--lime);background:rgba(57,229,127,.14);border:1px solid rgba(57,229,127,.28)}
  .cf.c4{color:var(--cyan);background:rgba(0,183,103,.12);border:1px solid rgba(0,183,103,.24)}
  .cf.c3{color:#6ab8ff;background:rgba(106,184,255,.12);border:1px solid rgba(106,184,255,.26)}
  .cf.c2{color:var(--amber);background:rgba(255,190,61,.12);border:1px solid rgba(255,190,61,.26)}
  .cf.c1{color:#ff8f6a;background:rgba(255,143,106,.12);border:1px solid rgba(255,143,106,.26)}
  .cf.c0{color:var(--sub);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
  /* LIVE. Same chip footprint as .cf so a row does not reflow when a match
     kicks off and the confidence band is replaced by this. */
  .livetag{font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:4px 8px;border-radius:8px;
    flex:0 0 auto;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;
    color:#ff5c6a;background:rgba(255,92,106,.12);border:1px solid rgba(255,92,106,.3)}
  .livetag i{width:6px;height:6px;border-radius:50%;background:#ff5c6a;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.livetag i{animation:none}}
  /* Last five games. Tabular figures so the column of numbers reads as a series
     rather than ragged text, and a filled chip where the game beat the line --
     the shape of a player's form should be legible before any number is read. */
  .l5{display:flex;gap:3px;margin-top:5px}
  .l5 i{font-style:normal;flex:0 0 auto;min-width:27px;text-align:center;padding:2px 4px;
    border-radius:6px;font-size:10.5px;font-weight:750;font-variant-numeric:tabular-nums;
    background:var(--glass2);color:var(--sub);border:1px solid transparent}
  .l5 i.hit{background:rgba(0,183,103,.15);color:var(--cyan);border-color:rgba(0,183,103,.25)}
  .l5 i.now{box-shadow:0 0 0 1px rgba(255,255,255,.10) inset}

  .tr{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px}
  .tr.head{padding:8px 14px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:800}
  .tr:nth-child(even):not(.head){background:rgba(255,255,255,.03)}
  .pos{width:20px;text-align:center;font-weight:800;color:var(--sub);font-variant-numeric:tabular-nums}
  .pos.top{color:var(--cyan)}.pos.rel{color:var(--hot)}
  .tr .team{flex:1;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tr .pts{width:40px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:13.5px;flex:0 0 auto}
  .stnum{width:30px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--sub);flex:0 0 auto}
  .psc{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--cyan);flex:0 0 auto;min-width:40px;text-align:center;letter-spacing:.03em}
  .psc small{display:block;font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-top:1px}
  .badge{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 6px;border-radius:6px;flex:0 0 auto}
  .b-ucl{color:var(--cyan);border:1px solid rgba(0,183,103,.28)}.b-rel{color:var(--hot);border:1px solid rgba(255,90,95,.3)}

  .back{display:inline-flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);
    color:var(--ink);font-family:inherit;font-size:13px;font-weight:700;padding:9px 14px;border-radius:20px;cursor:pointer;margin-bottom:14px}
  .dhead{padding:20px;margin-bottom:14px;text-align:center;position:relative;overflow:hidden}
  .dhead .lg{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
  .dhead .vs{font-size:23px;font-weight:850;letter-spacing:-.03em;margin:8px 0 12px}
  .score{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:6px}
  .score b{font-size:42px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .score span{font-size:12px;color:var(--sub);font-weight:700}
  .split{display:flex;height:38px;border-radius:12px;overflow:hidden;margin:14px 6px 0;border:1px solid var(--line)}
  .split div{display:grid;place-items:center;font-size:12px;font-weight:800;color:#05070f;min-width:26px}
  .sh{background:linear-gradient(180deg,var(--cyan),#2bbfb4)}
  .sd{background:#39415c;color:var(--ink)}
  .sa{background:linear-gradient(180deg,var(--hot),#e04d7d)}
  .dsec{padding:16px 18px;margin-bottom:12px}
  .dsec h3{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:12px}
  .sl{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .sl .sc{font-size:13px;font-weight:800;width:40px;font-variant-numeric:tabular-nums}
  .sl .sb{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
  .sl .sb i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan))}
  .sl .sp{font-size:12px;font-weight:700;color:var(--sub);width:34px;text-align:right;font-variant-numeric:tabular-nums}
  .rl{padding:8px 0;font-size:13.5px;font-weight:650;color:var(--ink);line-height:1.4}
  .rl+.rl{border-top:1px solid var(--line)}
  .warnbox{padding:13px 16px;margin-bottom:12px;font-size:12.5px;font-weight:600;color:var(--amber);line-height:1.5;
    border:1px solid rgba(255,190,61,.25);background:rgba(255,190,61,.06)}

  .acca{padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
  .acca.feat{border:1px solid rgba(57,229,127,.28)}
  .acca .ah{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .acca .an{font-size:16px;font-weight:850;letter-spacing:-.01em}
  .acca .an small{display:block;font-size:11px;color:var(--sub);font-weight:650;margin-top:2px}
  .acca .ac{text-align:right;flex:0 0 auto}
  .acca .ac b{font-size:30px;font-weight:850;font-variant-numeric:tabular-nums;line-height:1;
    background:linear-gradient(150deg,var(--cyan),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
  .acca .ac span{display:block;font-size:10px;color:var(--sub);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:3px}
  .legs{margin-top:14px}
  .ptm{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);
       padding:12px 0 2px;border-top:1px solid var(--line)}
  .ptm:first-of-type{border-top:none;padding-top:4px}
  .leg{display:flex;align-items:center;gap:11px;padding:11px 0}
  .leg+.leg{border-top:1px solid var(--line)}
  .leg .stt{width:9px;height:9px;border-radius:50%;background:#59637e;flex:0 0 auto;box-shadow:0 0 0 3px rgba(89,99,126,.15)}
  .leg .li2{flex:1;min-width:0}
  .leg .li2 b{font-size:14px;font-weight:750;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
  .leg .li2 span{font-size:11.5px;color:var(--sub);font-weight:600}
  .leg .lp{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--sub);flex:0 0 auto}
  .acfoot{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--sub)}
  .acfoot .pend{color:var(--amber)}
  .secttl{font-size:15px;font-weight:850;letter-spacing:-.01em;margin:4px 2px 2px}
  .sectsub{font-size:11.5px;color:var(--sub);font-weight:600;margin:0 2px 12px;line-height:1.4}
  .explain{padding:18px}
  .explain h3{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:12px}
  .estep{display:flex;gap:12px;padding:8px 0;font-size:13px;font-weight:600;line-height:1.45}
  .estep .en{width:22px;height:22px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-size:11px;font-weight:850;color:#05070f;
    background:linear-gradient(150deg,var(--cyan),var(--lime))}
  .estep span{color:var(--sub);font-weight:600}

  .stat{padding:26px 20px;margin-bottom:14px;text-align:center}
  .stat .k{font-size:52px;font-weight:850;letter-spacing:-.04em;
    background:linear-gradient(150deg,var(--cyan),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .l{font-size:13px;color:var(--sub);font-weight:650;margin-top:4px}
  .note{font-size:12.5px;color:var(--sub);font-weight:600;text-align:center;padding:10px 24px 0;line-height:1.55}
  .mktrow{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:750;margin-top:6px}
  .mktrow span{flex:1;text-align:left;color:var(--sub);font-weight:650}

<script>
"use strict";
const FILES={PL:"pl",LALIGA:"laliga",BUNDESLIGA:"bundesliga",LIGUE1:"ligue1",SERIEA:"seriea"};
const LG={PL:"Premier League",LALIGA:"La Liga",BUNDESLIGA:"Bundesliga",LIGUE1:"Ligue 1",SERIEA:"Serie A"};
const LC={PL:"#ff5c6a",LALIGA:"#f5c518",BUNDESLIGA:"#ff5c8a",LIGUE1:"#37a9e6",SERIEA:"#3ddc84"};
// Every league payload slug, derived from FILES rather than repeated. Adding
// Serie A found the same four-item list written out in five separate places, and
// a sixth league would have had to find them all again.
const LGSLUGS=Object.values(FILES);
const TC={"Bayern Munich":"#37e6d8","Manchester City":"#8b7bff","Stuttgart":"#c8ff4d","Dortmund":"#f5c518",
  "Ath Madrid":"#ff5c8a","Arsenal":"#37e6d8","Paris SG":"#8b7bff","Real Madrid":"#c8ff4d","Barcelona":"#37e6d8","Liverpool":"#ff5c8a"};
const tc=n=>TC[n]||"#37e6d8";
// NFL sides get the same treatment clubs do -- a colour makes a 32-team board
// scannable in a way a wall of three-letter codes never is. Grouped by
// conference-ish families rather than exact brand colours, which would be
// unreadable at 44px against a dark glass panel.
const NFLC={KC:"#ff5c6a",BUF:"#37a9e6",PHI:"#37e6d8",SF:"#f5c518",BAL:"#8b7bff",
  DET:"#37a9e6",DAL:"#6ab8ff",GB:"#c8ff4d",MIN:"#8b7bff",CIN:"#ff8f6a",
  HOU:"#37a9e6",LAC:"#f5c518",LA:"#6ab8ff",TB:"#ff5c6a",PIT:"#f5c518",
  SEA:"#37e6d8",DEN:"#ff8f6a",MIA:"#37e6d8",NYJ:"#c8ff4d",NE:"#8b7bff",
  JAX:"#37e6d8",IND:"#6ab8ff",TEN:"#37a9e6",CLE:"#ff8f6a",LV:"#c9d1e0",
  ARI:"#ff5c8a",ATL:"#ff5c6a",CAR:"#37a9e6",CHI:"#ff8f6a",NO:"#f5c518",
  NYG:"#6ab8ff",WAS:"#ff5c6a"};
const nc=t=>NFLC[t]||"#37e6d8";
const NFL_OVERVIEW=5;     // rows per market on the "All" overview
const NFLMK={anytime_touchdown:{tag:"g",name:"TD"},receiving_yards:{tag:"o",name:"Rec"},
  rushing_yards:{tag:"r",name:"Rush"},passing_yards:{tag:"p",name:"Pass"}};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=n=>String(n).split(" ").map(w=>w[0]).slice(0,2).join("");
const pc=p=>Math.round((p||0)*100);
const num=n=>(n==null?"":Number(n).toFixed(1));
const MK={goal:{tag:"g",name:"Goal"},shots:{tag:"a",name:"Attempts"},sot:{tag:"o",name:"On target"}};
// The expected COUNT behind each market, shown under the pick probability so a
// card reads "0.6 on target", not just a percentage.
function figFor(p){
  if(p.market==="sot"&&p.exp_sot!=null) return `${num(p.exp_sot)} on tgt`;
  if(p.market==="shots"&&p.exp_shots!=null) return `${num(p.exp_shots)} attempts`;
  if(p.market==="goal") return "anytime";
  return "";
}

const DATA={};
let cur="today", filter="all";
let FRESH={stale:false, text:""};

const relAge=h=>h<1?"moments ago":h<24?Math.round(h)+"h ago":Math.round(h/24)+"d ago";
function computeFreshness(){
  const stamps=[];
  ["best","player_picks","parlays",...LGSLUGS].forEach(n=>{
    const u=(DATA[n]||{}).updated; if(u){const t=new Date(u); if(!isNaN(t)) stamps.push(+t);}});
  if(!stamps.length) return {stale:false, text:""};
  const ageH=(Date.now()-Math.max(...stamps))/36e5;
  // soonest upcoming fixture across leagues -> is this an active window?
  let soonest=Infinity;
  LGSLUGS.forEach(k=>((DATA[k]||{}).matches||[]).forEach(m=>{
    if(!m.result){const d=new Date(m.date); if(!isNaN(d)) soonest=Math.min(soonest,(+d-Date.now())/36e5);}}));
  // When a fixture is within 3 days the pipeline refreshes often, so data should
  // be fresh (warn at 14h). In a quiet stretch it legitimately doesn't republish,
  // so only warn once genuinely abandoned (5 days).
  const limit = soonest<=72 ? 14 : 120;

  // RESULTS AND PREDICTIONS AGE SEPARATELY NOW. scripts/refresh_results.py applies
  // scores on every trigger in seconds, while the predictions only move when the
  // ~18-minute refit runs. So the board can legitimately be showing yesterday's
  // model and this afternoon's results, and a single "last updated" figure
  // describes neither -- it reads as though the whole page were stale.
  const rstamps=[];
  LGSLUGS.forEach(n=>{
    const u=(DATA[n]||{}).results_updated; if(u){const t=new Date(u); if(!isNaN(t)) rstamps.push(+t);}});
  const resultsAgeH = rstamps.length ? (Date.now()-Math.max(...rstamps))/36e5 : null;
  return {stale: ageH>limit, text: relAge(ageH), ageH,
          resultsAgeH, resultsText: resultsAgeH==null?"":relAge(resultsAgeH),
          // Results count as current if they are fresher than the predictions
          // AND recent in their own right.
          resultsFresh: resultsAgeH!=null && resultsAgeH<3 && resultsAgeH<ageH};
}
function updateLivePill(){
  const el=document.getElementById("live"); if(!el) return;
  if(FRESH.stale){el.textContent="⚠ "+FRESH.text;
    el.style.color="var(--amber)"; el.style.borderColor="rgba(255,190,61,.4)"; el.style.background="rgba(255,190,61,.1)";}
  else {el.textContent="● Live"; el.style.color=""; el.style.borderColor=""; el.style.background="";}
}
function staleBanner(){
  if(!FRESH.stale) return "";
  // Say which half is old. "Predictions last updated 16h ago" on a board whose
  // scores and table are twenty minutes old reads as though nothing on the page
  // could be trusted, when in fact only the forecasts are behind.
  return FRESH.resultsFresh
    ? `<div class="glass warnbox">Scores, tables and grades are current (updated ${FRESH.resultsText}). The <b>predictions</b> are older — last recomputed ${FRESH.text} — so treat the upcoming picks as provisional until the model refreshes.</div>`
    : `<div class="glass warnbox">Predictions last updated ${FRESH.text}. The live feed may be catching up — treat these as provisional until it refreshes.</div>`;
}

async function boot(){
  const names=["best","player_picks","parlays","six_scores",...LGSLUGS];
  await Promise.all(names.map(async n=>{
    try{const r=await fetch(`data/leagues/${n}.json`,{cache:"no-cache"});DATA[n]=r.ok?await r.json():null;}
    catch(e){DATA[n]=null;}
  }));
  // NFL lives under its own path and its own engine. Fetched separately and
  // allowed to fail on its own: a missing NFL board must never blank the four
  // football leagues that were here first.
  try{const r=await fetch("data/nfl/board.json",{cache:"no-cache"});DATA.nfl=r.ok?await r.json():null;}
  catch(e){DATA.nfl=null;}
  try{const r=await fetch("data/ucl/board.json",{cache:"no-cache"});DATA.ucl=r.ok?await r.json():null;}
  catch(e){DATA.ucl=null;}
  try{const r=await fetch("data/nba/board.json",{cache:"no-cache"});DATA.nba=r.ok?await r.json():null;}
  catch(e){DATA.nba=null;}
  FRESH=computeFreshness(); updateLivePill();
  buildNav(); go("today");
  startLive();      // no-ops unless a fixture could actually be in play
}

const views=[{k:"today",t:"Today"},{k:"best",t:"★ Best"},{k:"players",t:"★ Players"},{k:"six",t:"6 Scores"},{k:"parlay",t:"Parlay"},{k:"tables",t:"Tables"},{k:"grades",t:"Grades"},{k:"NFL",t:"NFL"},{k:"NBA",t:"NBA"},{k:"UCL",t:"Champions League"},
  {k:"PL",t:"Premier League"},{k:"LALIGA",t:"La Liga"},{k:"BUNDESLIGA",t:"Bundesliga"},{k:"LIGUE1",t:"Ligue 1"},{k:"SERIEA",t:"Serie A"}];
const subFor={today:"Today · all leagues",best:"Best Picks",players:"Player Picks",parlay:"Model parlays",six:"bet365 6 Scores",tables:"League tables",grades:"Grades",NFL:"NFL · winners and player props",NBA:"NBA · model evidence",UCL:"Champions League · league phase",
  PL:"Premier League",LALIGA:"La Liga",BUNDESLIGA:"Bundesliga",LIGUE1:"Ligue 1",SERIEA:"Serie A"};

// ONE SOURCE OF TRUTH FOR EVERY NAVIGATION. The bottom nav, the sidebar and the
// rail are all built from `views` and all call go(). Three hand-maintained lists
// would drift, and a link that looks live and does nothing is worse than no link
// -- which is exactly what the NFL chips were when setFilter rendered a hardcoded
// tab.
const ICON={today:"⚡",best:"★",players:"👤",six:"🎯",parlay:"🧩",tables:"📊",grades:"✅",
  NFL:"🏈",NBA:"🏀",UCL:"🏆",PL:"🦁",LALIGA:"🇪🇸",BUNDESLIGA:"🇩🇪",LIGUE1:"🇫🇷",SERIEA:"🇮🇹"};
// EVERY PROP MARKET, ONE CLICK. Reaching a single market used to mean opening a
// board and then finding its chip row; these land straight on it. `view` is the
// board to open and `filter` the market to select there -- the same value the
// chips set, so the two navigations cannot disagree about what a market is.
//
// NBA is deliberately absent: this app has no NBA engine. Listing it would be a
// link that looks live and does nothing, which is worse than no link at all.
const PROPS=[
  {id:"pp:goal",  view:"players", filter:"goal",  ic:"⚽", t:"Anytime scorer"},
  {id:"pp:shots", view:"players", filter:"shots", ic:"🥅", t:"2+ shot attempts"},
  {id:"pp:sot",   view:"players", filter:"sot",   ic:"🎯", t:"Shots on target"},
  {id:"nfl:anytime_touchdown", view:"NFL", filter:"anytime_touchdown",
   ic:"🏈", t:"NFL anytime TD"},
  {id:"nfl:receiving_yards", view:"NFL", filter:"receiving_yards",
   ic:"🙌", t:"NFL receiving yards"},
  {id:"nfl:rushing_yards", view:"NFL", filter:"rushing_yards",
   ic:"🏃", t:"NFL rushing yards"},
  {id:"nfl:passing_yards", view:"NFL", filter:"passing_yards",
   ic:"🎯", t:"NFL passing yards"},
  {id:"nfl:team_winner", view:"NFL", filter:"team_winner",
   ic:"🏆", t:"NFL team winner"},
  // NBA. These land on the evidence tab, not on picks -- there are none yet, and
  // the tab says so. Every market is listed whatever the gate decided: release is
  // read from the payload per market, and a withheld one renders as withheld with
  // the gate's reason on hover. Hiding a market because it failed would be the
  // dishonest option, and hardcoding WHICH market failed would go stale the first
  // time one changed -- as points did once its training window was capped.
  {id:"nba:points", view:"NBA", filter:"points", ic:"🏀", t:"NBA points"},
  {id:"nba:rebounds", view:"NBA", filter:"rebounds", ic:"🙌", t:"NBA rebounds"},
  {id:"nba:assists", view:"NBA", filter:"assists", ic:"🎯", t:"NBA assists"},
  {id:"nba:threes", view:"NBA", filter:"threes", ic:"🏹", t:"NBA threes"},
];

// SPORT FIRST, THEN MARKET. The page is scoped to one sport at a time: the
// sidebar lists the sports, and both the sidebar's Markets list and the tab row
// under the header show only that sport's boards. Pooling NFL props beside
// Premier League fixtures in one flat list described neither sport.
const SPORTS=[["soccer","Soccer"],["nfl","NFL"],["nba","NBA"],["ucl","Champions League"]];
const SPORT_NAME=Object.fromEntries(SPORTS);
const SPORT_OF={NFL:"nfl",NBA:"nba",UCL:"ucl"};
const sportOf=k=>SPORT_OF[k]||"soccer";
function curSport(){ return cur==="grades" ? (gsport||"soccer") : sportOf(cur); }
const propLabel=p=>{const t=p.t.replace(/^(NFL|NBA) /,""); return t[0].toUpperCase()+t.slice(1);};

// Every tab is a real board. NFL and NBA markets are built from PROPS, so the tab
// row and the sidebar links cannot disagree about which markets exist. `loose`
// tabs stay lit while a chip inside the board narrows it; `gs` opens Results
// already scoped to that sport.
function tabsFor(s){
  const props=v=>PROPS.filter(p=>p.view===v).map(p=>({k:v,f:p.filter,t:propLabel(p),ic:"+"}));
  if(s==="nfl") return [{k:"NFL",t:"Board",ic:"⌂"},...props("NFL"),{k:"grades",gs:"nfl",t:"Results",ic:"✓"}];
  if(s==="nba") return [{k:"NBA",t:"Evidence",ic:"⌂"},...props("NBA"),{k:"grades",gs:"nba",t:"Results",ic:"✓"}];
  if(s==="ucl") return [{k:"UCL",t:"Today",ic:"⌂",loose:1},{k:"grades",gs:"ucl",t:"Results",ic:"✓"}];
  return [{k:"today",t:"Today",ic:"⌂",loose:1},{k:"best",t:"Best Picks",ic:"★",loose:1},
    {k:"players",t:"Player Props",ic:"+",loose:1},{k:"six",t:"Correct Scores",ic:"#",loose:1},
    {k:"parlay",t:"Parlays",ic:"⧉",loose:1},{k:"tables",t:"Tables",ic:"≡",loose:1},
    {k:"grades",gs:"soccer",t:"Results",ic:"✓"}];
}
// Soccer's extra sidebar sections. NFL and NBA markets ARE their tabs, so they
// are not listed a second time.
const SIDE_EXTRA={soccer:[{name:"Player props", props:true},
  {name:"Leagues", keys:["PL","LALIGA","BUNDESLIGA","LIGUE1","SERIEA"]}]};
const TITLE={today:"Today's markets",best:"Best picks",players:"Player props",six:"Correct scores",
  parlay:"Model parlays",tables:"League tables",grades:"Results & grading",NFL:"NFL board",
  NBA:"NBA model evidence",UCL:"Champions League"};

function openTab(t){
  go(t.k,t.f);
  if(t.gs&&t.gs!==gsport){ gsport=t.gs; render(cur); }
}
function goSport(s){ openTab(tabsFor(s)[0]); }

function go(k,f){
  // `f` lets a link open a board already filtered to one market. Defaults to
  // "all" so every existing caller behaves exactly as before.
  cur=k; filter=f||"all"; tier="all"; gsport="soccer";
  fdate="all"; fleague="all"; rkind="all"; rall=false; render(k);
  window.scrollTo(0,0);
}

function isOn(d){
  if(d.k!==cur) return false;
  if(d.k==="grades") return !d.gs||d.gs===gsport;
  if(d.loose) return true;
  return (d.f||"all")===filter;
}
// Marks the active target everywhere at once, so the sidebar and the tab row can
// never disagree about where the reader is.
function syncNav(){
  document.querySelectorAll("[data-k]").forEach(el=>el.classList.toggle("on",isOn(el.dataset)));
  const s=curSport();
  document.querySelectorAll("[data-sport]").forEach(el=>el.classList.toggle("on",el.dataset.sport===s));
}

// How many things a board is currently showing. A count that cannot be computed
// is omitted rather than shown as 0 -- "0 picks" and "not loaded" look identical
// and mean opposite things.
// How many picks a single market is showing. Same omission rule as countFor: a
// count that cannot be computed is left off rather than shown as 0, because
// "0 picks" and "not loaded" look identical and mean opposite things.
function propCount(item){
  if(item.view==="players"){
    const up=(DATA.player_picks||{}).upcoming;
    return Array.isArray(up)?up.filter(p=>p.market===item.filter).length:null;
  }
  if(item.view==="NBA"){
    const ev=((DATA.nba||{}).evidence||{})[item.filter];
    return ev&&ev.n!=null?ev.n:null;
  }
  if(item.view==="NFL"){
    if(!DATA.nfl) return null;
    if(item.filter==="team_winner") return (DATA.nfl.games||[]).length;
    const b=(DATA.nfl.props||{})[item.filter];
    return b?(b.picks||[]).length:null;
  }
  return null;
}

function countFor(k){
  const n=x=>Array.isArray(x)?x.length:null;
  if(k==="best")    return n((DATA.best||{}).upcoming);
  if(k==="players") return n((DATA.player_picks||{}).upcoming);
  if(k==="six")     return n((DATA.six_scores||{}).picks);
  if(k==="parlay")  return n((DATA.parlays||{}).upcoming);
  if(k==="NFL")     return DATA.nfl ? (DATA.nfl.games||[]).length : null;
  if(k==="UCL")     return DATA.ucl ? (DATA.ucl.matches||[]).length : null;
  // NBA counts RELEASED MARKETS, not picks: there are no picks yet and a "0"
  // beside the tab would read as a broken board rather than an honest state.
  if(k==="NBA")     return DATA.nba ? (DATA.nba.markets_released||[]).length : null;
  if(FILES[k])      return n((DATA[FILES[k]]||{}).matches);
  return null;
}

function buildNav(){ buildSidebar(); syncNav(); }

const stampOf=d=>d&&(d.updated||d.generated_at||null);
const agoOf=iso=>{const t=new Date(iso); return iso&&!isNaN(t)?relAge((Date.now()-t)/36e5):null;};

// LIVE only where a feed is actually publishing. NBA has evidence and no fixture
// feed, so it says NO FEED rather than looking like a board with nothing on it.
function feedBadge(s){
  let c="b-live",t="Live";
  if(s==="soccer"){
    if(!LGSLUGS.some(n=>DATA[n])){c="b-off";t="No feed";}
    else if(FRESH.stale){c="b-stale";t="Stale";}
  } else if(s==="nba"){ if(!DATA.nba||DATA.nba.status==="evidence_only"){c="b-off";t="No feed";} }
  else if(!DATA[s]){c="b-off";t="No feed";}
  return `<span class="badge ${c}">${t}</span>`;
}

function navBtn(cls,t,withIcon){
  const b=document.createElement("button"); b.type="button"; b.className=cls;
  b.dataset.k=t.k; if(t.f) b.dataset.f=t.f; if(t.gs) b.dataset.gs=t.gs; if(t.loose) b.dataset.loose="1";
  b.innerHTML=(withIcon?`<span class="gl">${esc(t.ic||"•")}</span>`:"")+`<span>${esc(t.t)}</span>`
    +(t.ct!=null?`<span class="ct">${t.ct}</span>`:"");
  b.onclick=()=>openTab(t);
  return b;
}
function sportBtn(cls,k,t,badge){
  const b=document.createElement("button"); b.type="button"; b.className=cls; b.dataset.sport=k;
  b.innerHTML=`<span>${esc(t)}</span>`+(badge?feedBadge(k):"");
  b.onclick=()=>goSport(k);
  return b;
}
function group(el,name){
  const h=document.createElement("div"); h.className="sgroup"; h.textContent=name; el.append(h);
}

function buildSidebar(){
  const s=curSport();
  const ms=document.getElementById("msports");
  if(ms){ ms.innerHTML=""; SPORTS.forEach(([k,t])=>ms.append(sportBtn("chip",k,t,false))); }
  // On a phone the sidebar is hidden, so the league boards need their own row or
  // they are unreachable there.
  const ml=document.getElementById("mleagues");
  if(ml){ ml.innerHTML=""; ml.hidden=s!=="soccer";
    for(const g of SIDE_EXTRA[s]||[]) for(const k of g.keys||[]) ml.append(navBtn("chip",{k,t:LG[k]||k,loose:1},false)); }
  const side=document.getElementById("side"); if(!side) return;
  side.innerHTML=`<div class="brand2"><div class="he">HE</div><div><small>Personal sports edge</small>
    <b>Henry&rsquo;s Engine</b></div></div>`;
  group(side,"Sports");
  SPORTS.forEach(([k,t])=>side.append(sportBtn("sitem",k,t,true)));
  group(side,"Markets");
  for(const t of tabsFor(s)){
    const ct=t.k==="grades"?null:t.f?propCount({view:t.k,filter:t.f}):countFor(t.k);
    side.append(navBtn("sitem",{...t,ct},true));
  }
  for(const g of SIDE_EXTRA[s]||[]){
    group(side,g.name);
    if(g.props){
      for(const item of PROPS.filter(p=>p.view==="players")){
        const b=navBtn("sitem",{k:item.view,f:item.filter,t:item.t,ic:item.ic,ct:propCount(item)},true);
        b.dataset.prop=item.id;
        side.append(b);
      }
      continue;
    }
    for(const k of g.keys) side.append(navBtn("sitem",{k,t:LG[k]||k,ic:ICON[k],loose:1,ct:countFor(k)},true));
  }
}

function buildTabs(s){
  const el=document.getElementById("tabs"); if(!el) return;
  el.innerHTML="";

function feedBanner(s){
  let ok=true, txt;

    if(FRESH.stale){ ok=false; txt=FRESH.resultsFresh
      ? `Scores current (${FRESH.resultsText}) · predictions last recomputed ${FRESH.text} — treat upcoming picks as provisional`
      : `Predictions last updated ${FRESH.text} — the feed may be catching up`; }
    else txt=`API-Football feed connected · Predictions updated ${FRESH.text||"—"}`
      +(FRESH.resultsText?` · Results ${FRESH.resultsText}`:"");

  } else if(s==="nba"){

// What every payload says about its own age. A reader asking "is this current?"
// gets the answer per board rather than one number describing none of them.
let showDetails=false;
function detailsHtml(){
  const rows=[["Best picks","best"],["Player picks","player_picks"],["Parlays","parlays"],["Correct scores","six_scores"],
    ...LGSLUGS.map(n=>[LG[Object.keys(FILES).find(k=>FILES[k]===n)]||n,n]),
    ["NFL","nfl"],["Champions League","ucl"],["NBA","nba"]];
  return `<div class="dgrid">`+rows.map(([t,n])=>{
    const a=agoOf(stampOf(DATA[n]));
    return `<span>${esc(t)}</span><b class="${DATA[n]?"":"off"}">${DATA[n]?(a?"updated "+a:"loaded"):"not loaded"}</b>`;
  }).join("")+`</div>`;
}
function toggleDetails(){
  showDetails=!showDetails;
  const d=document.getElementById("details"); if(!d) return;
  d.hidden=!showDetails; if(showDetails) d.innerHTML=detailsHtml();
}

// The page chrome around a board: eyebrow, title, feed banner, tabs, sidebar.
function chrome(){
  const s=curSport(), tabs=tabsFor(s);
  const on=tabs.find(t=>isOn(t));
  const nflMarket=(cur==="NFL"||cur==="NBA")&&filter!=="all"
    ? PROPS.find(p=>p.view===cur&&p.filter===filter) : null;
  const sub=document.getElementById("sub");
  if(sub) sub.textContent=`${SPORT_NAME[s]} · ${on?on.t:(LG[cur]||subFor[cur]||"")}`;
  const title=document.getElementById("ptitle");
  if(title) title.textContent=nflMarket?propLabel(nflMarket):(TITLE[cur]||LG[cur]||subFor[cur]||"");
  const feed=document.getElementById("feed"); if(feed) feed.innerHTML=feedBanner(s);
  buildSidebar(); buildTabs(s); syncNav();
}

// Kickoff shown in the READER'S OWN timezone. The payload stores UTC, which is
// right for storage and useless on a card -- a reader in London should not be
// converting 19:00Z in their head to know when Arsenal kick off. Date.toLocale*
// handles the offset and the DST switch on 25 October for free.
// Compact by design: "Fri 21 Aug, 20:00". Today and tomorrow say so instead,
// because that is what a reader actually wants to know on a matchday.
function whenStr(iso){
  const d=new Date(iso); if(isNaN(d)) return "";
  const time=d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit",hour12:false});
  const day0=new Date(); day0.setHours(0,0,0,0);
  const days=Math.round((new Date(d).setHours(0,0,0,0)-day0)/86400000);
  if(days===0) return `Today ${time}`;
  if(days===1) return `Tomorrow ${time}`;
  return `${d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})}, ${time}`;
}

// Group fixtures under the day they are played, with a count -- a flat list of
// 30 fixtures across four leagues is hard to scan, and "SATURDAY 22 AUGUST ·
// 9 matches" tells a reader where to look immediately.
function groupByDay(items){
  const out=[], seen=new Map();
  for(const it of items){
    const d=new Date(it.date); if(isNaN(d)) continue;
    const key=d.toDateString();
    if(!seen.has(key)){ const g={key,date:d,items:[]}; seen.set(key,g); out.push(g); }
    seen.get(key).items.push(it);
  }
  out.sort((a,b)=>a.date-b.date);
  return out;
}
function dayHeading(d){
  const day0=new Date(); day0.setHours(0,0,0,0);
  const days=Math.round((new Date(d).setHours(0,0,0,0)-day0)/86400000);
  const rel=days===0?"Today":days===1?"Tomorrow":null;
  const full=d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  return rel?`${rel} · ${full}`:full;
}
// All three outcomes, not just the picked one. A single number hides the draw
// risk: 44/28/28 and 44/12/44 are the same "44% pick" and completely different
// bets. The picked side is emphasised so the row still reads as a call.
function hdaStrip(p){
  // Stacked UNDER the fixture rather than beside it. As a right-hand column it
  // cost ~95px and truncated five of nine fixture names at 375px; the row has
  // full width to give underneath, so nothing is clipped.
  const cell=(lbl,v,on)=>`<span style="font-variant-numeric:tabular-nums;
    ${on?"color:var(--ink);font-weight:800":"color:var(--sub);font-weight:600"}">${lbl} ${pc(v)}</span>`;
  return `<div style="display:flex;gap:12px;font-size:11.5px;margin-top:4px">
    ${cell("H",p.p_home,p.pick_type==="home")}${cell("D",p.p_draw,p.pick_type==="draw")}${cell("A",p.p_away,p.pick_type==="away")}</div>`;
}

function tierOf(p){return p>=.75?`<span class="tier t-elite">Elite</span>`:p>=.68?`<span class="tier t-strong">Strong</span>`:`<span class="tier t-lean">Lean</span>`;}

function bestRow(u){
  // The bookmaker's price on the picked side, when the fixture is priced. Odds
  // only appear about a week out, so this is absent more often than not and the
  // row must read fine without it.
  const price=(u.odds!=null&&Number.isFinite(Number(u.odds)))
    ? ` · ${esc(u.book||"bookmaker")} ${Number(u.odds).toFixed(2)}` : "";
  return `<div class="rw" onclick="openMatch('${u.league_key}',${u.id})"><span class="lgtag" style="background:${LC[u.league_key]}"></span>
    <div class="info"><b>${esc(u.home)} v ${esc(u.away)}</b><span>${whenStr(u.date)} · ${esc(LG[u.league_key])} · pick ${esc(u.pick)}${price}</span></div>
    ${tierOf(u.p_pick)}<div class="conf" style="min-width:74px"><b>${pc(u.p_pick)}%</b><div class="bar"><i style="width:${pc(u.p_pick)}%"></i></div></div>
    <span class="chev">›</span></div>`;
}

function render(k){
  const app=document.getElementById("app");
  let h="";
  if(k==="today") h=viewToday();
  else if(k==="best") h=viewBest();
  else if(k==="players") h=viewPlayers();
  else if(k==="parlay") h=viewParlay();
  else if(k==="tables") h=viewTables();
  else if(k==="six") h=viewSix();
  else if(k==="grades") h=viewGrades();
  else if(k==="NFL") h=viewNFL();
  else if(k==="NBA") h=viewNBA();
  else if(k==="UCL") h=viewUCL();
  else h=viewLeague(k);
  app.innerHTML=h; chrome(); window.scrollTo(0,0);
}

// CONFIDENCE, THE ONE THE RECORD IS KEPT BY. These are leagues/publish.py's
// _confidence() bands (>=.70, .60, .50, .40), which is what every payload's
// `confidence` field holds and what Grades calibrates against.
//
// Deliberately NOT tierOf(), which is a second, three-way scheme (>=.75 Elite,
// >=.68 Strong, else Lean) used on the Best rows. The two disagree: a 72% pick
// is band 5 "Elite" in the record and "Strong" to tierOf, a 55% pick is "Even"
// in the record and "Lean" to tierOf. A tag whose accuracy has never been
// measured is worse than no tag, so today's board wears the measured one.
const CONF={5:{n:"Elite",r:"70%+"},4:{n:"Strong",r:"60–70%"},3:{n:"Even",r:"50–60%"},
  2:{n:"Lean",r:"40–50%"},1:{n:"Longshot",r:"under 40%"}};

// Mirrors _confidence() exactly. Only needed where a payload does not already
// carry the field -- the NFL board publishes p_pick but no band.
function confOf(p){
  if(p==null||!Number.isFinite(Number(p))) return null;
  const v=Number(p);
  return v>=.70?5:v>=.60?4:v>=.50?3:v>=.40?2:1;
}
function confTag(c){
  if(!c||!CONF[c]) return `<span class="cf c0" title="no model probability">—</span>`;
  return `<span class="cf c${c}" title="${CONF[c].r}">${CONF[c].n}</span>`;
}

// The reader's own calendar day, matching whenStr's "Today". A fixture at 00:20
// UTC is not on the same DATE for a reader in London and one in Los Angeles, and
// the tab has to agree with the clock the reader is looking at.
function isToday(iso){
  const d=new Date(iso); if(isNaN(d)) return false;
  const n=new Date();
  return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();
}

// EVERY fixture today, per competition -- played, in progress and still to come.
// A "Today" tab that hides this morning's finished games is not showing today.
// --- live in-play scores ------------------------------------------------------
//
// The page is a STATIC site, so it cannot hold an API key and cannot update a
// file without a deploy. Live scores are fetched at runtime from a small proxy
// that holds the key instead. One constant, so moving hosts is a one-line
// change.
const LIVE_URL="https://nba-stats-proxy.onrender.com/api/soccer/live";
const LIVE_POLL_MS=60000;      // matches the proxy's 30s cache; viewers share fetches
const LIVE_WINDOW_H=3.2;       // a match is plausibly in play for this long after kickoff
let LIVE={matches:[], available:null, at:0};
let LIVE_TIMER=null;

// NAME MATCHING IS THE DANGEROUS PART, so it refuses rather than guesses. The
// board says "Newcastle United" and the feed says "Newcastle" -- equality fails
// on the very first real fixture. But loose matching is worse: "Manchester"
// would match both Manchester clubs, and a live score attached to the wrong
// fixture is the same class of error as settling a bet against a stranger.
//
// The rule is token-subset in either direction, required for BOTH teams, and the
// pairing must be UNIQUE within its league. Anything ambiguous shows no live
// score at all, which is the honest outcome.
const liveTokens=s=>String(s||"").toLowerCase()
  .normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean);
function liveTeamMatches(a,b){
  const A=new Set(liveTokens(a)), B=new Set(liveTokens(b));
  if(!A.size||!B.size) return false;
  const subset=(x,y)=>[...x].every(t=>y.has(t));
  return subset(A,B)||subset(B,A);
}
// The live row for a board fixture, or null. Null is the normal case.
function liveFor(match, leagueKey){
  if(!LIVE.matches.length) return null;
  const hits=LIVE.matches.filter(l=>l.league===leagueKey
    && liveTeamMatches(l.home, match.home)
    && liveTeamMatches(l.away, match.away));
  return hits.length===1 ? hits[0] : null;   // 0 = not on; >1 = ambiguous, never guess
}

// "45'", "HT", "90+". Minute is what a reader actually wants; the raw status
// codes are the feed's vocabulary, not theirs.
function liveClock(l){
  if(l.status==="HT") return "HT";
  if(l.status==="P") return "PENS";
  if(l.status==="BT") return "ET break";
  if(l.status==="SUSP"||l.status==="INT") return "suspended";
  return l.elapsed!=null ? `${l.elapsed}'` : "live";
}

// POLL ONLY WHEN SOMETHING COULD BE ON. A timer running all night costs the
// reader battery and the proxy requests, to learn every minute that nothing is
// happening. Kickoff times are already on the board, so the page can tell.
function liveExpected(){
  const now=Date.now();
  return todayFixtures().some(c=>c.rows.some(r=>{
    if(r.result) return false;                       // already finished
    const k=new Date(r.date); if(isNaN(k)) return false;
    const h=(now-k)/3600000;
    return h>=-0.05 && h<=LIVE_WINDOW_H;
  }));
}

async function pollLive(){
  if(!liveExpected()){ LIVE.matches=[]; stopLive(); return; }
  try{
    const r=await fetch(LIVE_URL,{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json();
    LIVE={matches:Array.isArray(j.matches)?j.matches:[],
          available:j.available!==false, at:Date.now()};
  }catch(e){
    // A dead or sleeping proxy must never break the board. The page keeps
    // rendering exactly as it does without live data.
    LIVE={matches:[], available:false, at:Date.now()};
  }
  if(cur==="today") render(cur);
}
function startLive(){
  if(LIVE_TIMER) return;
  pollLive();
  LIVE_TIMER=setInterval(pollLive, LIVE_POLL_MS);
}
function stopLive(){
  if(LIVE_TIMER){ clearInterval(LIVE_TIMER); LIVE_TIMER=null; }
}

function todayFixtures(){
  const comps=[];
  Object.keys(FILES).forEach(k=>{
    const rows=(((DATA[FILES[k]]||{}).matches)||[]).filter(m=>isToday(m.date)).map(m=>{
      const pr=m.prediction||{};
      return {home:m.home, away:m.away, date:m.date, pick:pr.pick,
              p:pr.p_pick, conf:pr.confidence!=null?pr.confidence:confOf(pr.p_pick),
              result:m.result, graded:m.graded, void:m.void, lgKey:k,
              go:`openMatch('${k}',${m.id})`, colour:LC[k]};

  });

  const ucl=(((DATA.ucl||{}).matches)||[]).filter(m=>isToday(m.kickoff||m.date)).map(m=>({
    home:m.home, away:m.away, date:m.kickoff||m.date, pick:m.pick, p:m.p_pick,
    conf:m.confidence!=null?m.confidence:confOf(m.p_pick), lgKey:"UCL",
    result:m.result, graded:m.graded, go:`go('UCL')`, colour:"#8b7bff"}));
  comps.push({name:"Champions League", colour:"#8b7bff", rows:ucl, sport:"Football"});

  const nfl=(((DATA.nfl||{}).games)||[]).filter(g=>isToday(g.kickoff)).map(g=>({
    home:g.home, away:g.away, date:g.kickoff, pick:g.pick, p:g.p_pick,
    // The NFL board publishes a probability and no band, so it is computed here
    // with the same thresholds rather than given a scheme of its own.
    conf:confOf(g.p_pick), result:g.result, graded:g.graded,
    go:`go('NFL')`, colour:nc(g.home)}));
  comps.push({name:"NFL", colour:"#37a9e6", rows:nfl, sport:"NFL"});

  const nba=(((DATA.nba||{}).games)||[]).filter(g=>isToday(g.date||g.kickoff)).map(g=>({
    home:g.home, away:g.away, date:g.date||g.kickoff, pick:g.pick, p:g.p_pick,
    conf:confOf(g.p_pick), go:`go('NBA')`, colour:"#ff8f6a"}));
  comps.push({name:"NBA", colour:"#ff8f6a", rows:nba, sport:"NBA",
              // NBA has a model and fifteen seasons of validation but no fixture
              // feed, so "no games today" would be a lie -- there are games, the
              // board simply cannot see them. Say which it is.
              blocked:((DATA.nba||{}).status==="evidence_only")
                ? "No fixture feed wired in yet, so today’s NBA slate cannot be listed or priced."
                : null});
  return comps;
}

function todayRow(r){
  const t=new Date(r.date);
  const time=isNaN(t)?"":t.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit",hour12:false});
  const score=r.result?`${r.result.home_goals}-${r.result.away_goals}`:null;
  // A FINAL RESULT ALWAYS WINS over a live one. The engine's result is what the
  // record is graded on; a live feed still calling a finished match "90'" must
  // never overwrite it on screen.
  const l=score?null:liveFor(r, r.lgKey);
  // A finished game shows what happened and how the pick did; an upcoming one
  // shows the pick. Both show the confidence the model actually staked.
  const sub=score
    ? `${time} · final ${score}${r.pick?` · pick ${esc(r.pick)}`:""}`
    : l
      ? `${esc(liveClock(l))} · ${l.home_goals}-${l.away_goals}${r.pick?` · pick ${esc(r.pick)}`:""}`
      : `${time}${r.pick?` · pick ${esc(r.pick)}`:" · no pick"}`;
  const verdict=r.void?`<span class="res void">void</span>`
    : r.graded?`<span class="res ${r.graded}">${r.graded}</span>`:"";
  // THE PROBABILITY IS PRE-MATCH AND SAYS SO. The model does not condition on
  // the score, the clock or a red card -- it is the number computed before
  // kickoff. Beside a live scoreline a reader would otherwise assume it had
  // updated, which is the one misreading this feature could cause.
  const prob=r.p!=null?pc(r.p)+"%":"—";
  return `<div class="rw" onclick="${r.go}"><span class="lgtag" style="background:${r.colour}"></span>
    <div class="info"><b>${esc(r.home)} v ${esc(r.away)}</b><span>${sub}</span></div>
    ${l?`<span class="livetag"><i></i>LIVE</span>`:confTag(r.conf)}
    <div class="conf" style="min-width:64px"><b>${prob}</b>
      ${l?`<span style="font-size:8.5px;letter-spacing:.04em">pre-match</span>`
         :`<div class="bar"><i style="width:${r.p!=null?pc(r.p):0}%"></i></div>`}</div>
    ${verdict||'<span class="chev">›</span>'}</div>`;
}

function viewToday(){
  const comps=todayFixtures();
  const total=comps.reduce((n,c)=>n+c.rows.length,0);
  const best=DATA.best||{}, up=best.upcoming||[];
  const rec=best.record||{correct:0,wrong:0};
  const played=comps.reduce((n,c)=>n+c.rows.filter(r=>r.result).length,0);

  let h=`<div class="tiles"><div class="glass tile"><div class="k grad">${total}</div><div class="l">Games today</div></div>
    <div class="glass tile"><div class="k">${played}</div><div class="l">Played</div></div>
    <div class="glass tile"><div class="k">${rec.correct}–${rec.wrong}</div><div class="l">Record</div></div></div>`;

  // The top pick still leads the tab, but only when it is actually TODAY.
  // Heroing a fixture three days out on a tab called "Today" is the kind of
  // small dishonesty that makes a reader stop trusting the rest of the page.
  const d=up.find(u=>isToday(u.date));
  if(d) h+=`<div class="glass hero" onclick="openMatch('${d.league_key}',${d.id})"><div class="lg">${esc(LG[d.league_key])} · Top pick today</div>
    <div class="mt2">${esc(d.home)} v ${esc(d.away)}</div><div class="pk">Pick <b>${esc(d.pick)}</b> · ${whenStr(d.date)}</div>
    <div class="num"><b>${pc(d.p_pick)}%</b><span>win probability</span></div><div class="go">Tap for full breakdown ›</div></div>`;

  if(!total && !comps.some(c=>c.blocked))
    h+=`<div class="glass stat"><div class="k">No games</div><div class="l">Nothing is scheduled in any competition today.</div></div>`;

  // EVERY competition gets a line, including the empty ones. A section that
  // silently disappears on a quiet day is indistinguishable from one that broke,
  // and the reader cannot tell "no games" from "we failed to load them".
  for(const c of comps){
    if(!c.rows.length && !c.blocked){
      h+=`<div class="eyebrow mt">${esc(c.name)}</div><div class="glass rowc">${emptyRow("No games today")}</div>`;
      continue;
    }
    h+=`<div class="eyebrow mt">${esc(c.name)}${c.rows.length?` · ${c.rows.length} game${c.rows.length===1?"":"s"}`:""}</div>`;
    if(c.blocked){ h+=`<div class="glass rowc">${emptyRow(c.blocked)}</div>`; continue; }
    h+=btable(TCOLS, c.rows.sort((a,b)=>new Date(a.date)-new Date(b.date))
      .map(r=>todayTableRow({...r, comp:c.name})).join(""));
  }

  h+=`<p class="note">Confidence bands are the model's own — ${Object.keys(CONF).sort((a,b)=>b-a)
    .map(k=>`<b>${CONF[k].n}</b> ${CONF[k].r}`).join(" · ")} — and are the same bands the Grades tab
    checks its record against, so a label here means what it says there.</p>`;
  return h+archiveLink();
}

// --- confidence tier filter --------------------------------------------------
//
// THE NAMES ARE nflTier's, NOT NEW ONES. That function already labels the NFL
// and Champions League rows Strong/Solid/Lean at exactly 70/60, so on those tabs
// a chip and the rows under it say the same word. Thin is the one addition,
// splitting nflTier's catch-all "Lean" at 50 so the weakest picks can be found
// or avoided as a group.
//
// WHERE IT STILL DISAGREES, AND WHY THAT IS NOT HIDDEN. Two other vocabularies
// exist. Today and Grades use publish.py's _confidence() bands -- Elite, Strong,
// Even, Lean, Longshot -- which the RECORD is kept by, so renaming them would
// rename what the calibration chart measures. `tierOf` on the Best rows is a
// third, splitting at 75/68 and agreeing with neither. So a Best pick at 64%
// reads "Lean" on its row under the chip "Solid".
//
// Every chip therefore carries its percentage range, on the chip itself rather
// than in a title attribute: the ranges are what all the names actually refer
// to, and a tooltip is invisible on the phone this is read on.
const TIERS=[
  ["strong","Strong","70%+",     b=>b>=5],
  ["solid", "Solid", "60–70%",   b=>b===4],
  ["lean",  "Lean",  "50–60%",   b=>b===3],
  ["thin",  "Thin",  "under 50%",b=>b<=2],
];
let tier="all";
function setTier(t){ tier=(tier===t?"all":t); render(cur); }   // tapping again clears

// The band for a pick, from its published `confidence` where there is one and
// from its probability otherwise. confOf mirrors _confidence() exactly, so both
// routes land on the same band.
function bandOf(p){
  const c=p&&p.confidence;
  if(c!=null&&c>=1&&c<=5) return c;
  return confOf(p&&(p.p_pick!=null?p.p_pick:p.probability));
}
function inTier(p){
  if(tier==="all") return true;
  const row=TIERS.find(t=>t[0]===tier);
  const b=bandOf(p);
  return !!row && b!=null && row[3](b);
}
// Filter a list, and say how many each chip would hold so an empty tier is
// visibly empty rather than looking broken.
function tierCounts(items){
  const out={};
  TIERS.forEach(([k,,,test])=>{ out[k]=items.filter(p=>{const b=bandOf(p); return b!=null&&test(b);}).length; });
  return out;
}
function tierChips(items){
  if(!items||!items.length) return "";
  const n=tierCounts(items);
  // THE RANGE IS ON THE CHIP, not in a title attribute. These four names sit
  // over five differently-named bands, so a pick tagged "Strong" appears under
  // the chip "Solid" -- and a tooltip explaining that is invisible on a phone,
  // which is where this is read. The percentages are the thing both names refer
  // to, so they are the part that must always be on screen.
  return `<div class="chips">${TIERS.map(([k,name,range])=>
    `<button class="chip ${tier===k?"on":""}" type="button" onclick="setTier('${k}')">${
      esc(name)} <span class="rng">${esc(range)}</span> ${n[k]}</button>`).join("")}</div>`;
}
// A tier with nothing in it must say so, not render a blank panel.
function tierEmpty(){
  const row=TIERS.find(t=>t[0]===tier);
  return emptyRow(row?`No picks in ${row[1]} (${row[2]}) right now`:"No picks in this tier");
}

// --- Market-board tables (Today, Best Picks, Player Props) -------------------
//
// One row per selection, in fixed columns: when, what, its status, the model's
// probability, the line or the player's average, and the price/edge. The same
// columns on every board so a reader learns the layout once.
let fdate="all", fleague="all", rkind="all", rall=false;
function setFDate(d){ fdate=(fdate===d?"all":d); render(cur); }
function setFLeague(l){ fleague=l; render(cur); }
function setRKind(k){ rkind=k; rall=false; render(cur); }
function showAllSettled(){ rall=true; render(cur); }
const dayKey=iso=>{const d=new Date(iso); return isNaN(d)?"":d.toDateString();};
const dayChip=key=>new Date(key).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
function inBoard(p){
  return inTier(p) && (fdate==="all"||dayKey(p.date)===fdate)
    && (fleague==="all"||p.league_key===fleague);
}
// Date and league rows are drawn only when they would offer a real choice -- a
// single-option row is a control that does nothing.
function boardFilters(items, confChips, marketChips){
  const chip=(on,click,label)=>`<button class="chip ${on?"on":""}" type="button" onclick="${click}">${label}</button>`;
  const days=[...new Set(items.map(p=>dayKey(p.date)).filter(Boolean))].sort((a,b)=>new Date(a)-new Date(b));
  const lgs=Object.keys(LG).filter(k=>items.some(p=>p.league_key===k));
  const dateRow=days.length>1?`<div class="chips">${chip(fdate==="all","setFDate('all')","All dates")}${
    days.map(d=>chip(fdate===d,`setFDate('${d}')`,esc(dayChip(d)))).join("")}</div>`:"";
  const lgRow=lgs.length>1?`<div class="chips">${chip(fleague==="all","setFLeague('all')","All leagues")}${
    lgs.map(k=>chip(fleague===k,`setFLeague('${k}')`,esc(LG[k]))).join("")}</div>`:"";
  const rows=frow("Match date",dateRow)+frow("League",lgRow)+frow("Confidence",confChips);
  let h=rows?`<div class="glass fpanel">${rows}</div>`:"";
  if(marketChips) h+=`<div class="glass fpanel">${frow("Market",marketChips)}</div>`;
  return h;
}

const PCOLS=["Time","Event / selection","Status","Probability","Line / avg.","Edge / price"];
const TCOLS=["Time","Event / selection","Status","Probability","Result"];
function btable(cols, rows){
  return `<div class="btable glass${cols.length===5?" t5":""}"><div class="bhead">${
    cols.map(c=>`<span>${esc(c)}</span>`).join("")}</div>${rows}</div>`;
}
function sectHead(eb, title, note){
  return `<div class="sech"><div><div class="eb">${esc(eb)}</div><h2>${esc(title)}</h2></div>${
    note?`<p>${esc(note)}</p>`:""}</div>`;
}
function timeCell(iso){
  const d=new Date(iso); if(isNaN(d)) return `<div class="bt"></div>`;
  const day=d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  const t=d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit",hour12:false});
  const tz=d.toLocaleTimeString(undefined,{timeZoneName:"short"}).split(" ").pop()||"";
  return `<div class="bt"><b>${esc(day)},<br>${t}</b><small>${esc(tz)}</small></div>`;
}
function probCell(p, label){
  return `<div class="bc"><small>${esc(label||"Model")}</small><b class="bn">${p!=null?pc(p)+"%":"—"}</b>
    <div class="bar"><i style="width:${p!=null?pc(p):0}%"></i></div></div>`;
}
function valCell(label, val, cls){
  return `<div class="bc"><small>${esc(label)}</small><b class="bn ${cls||""}">${val}</b></div>`;
}

// The selection in bet-slip words. "2+ shot attempts" and "Over 1.5 shots" are
// the same bet; the second is how a book prints it.
const PSEL={goal:"Anytime goal",shots:"Over 1.5 shots",sot:"Over 0.5 SOT"};
const PMK={goal:"Anytime goal",shots:"Total shots",sot:"Shots on target"};

function lastFiveTiles(p){
  const v=p.last_five||[]; if(!v.length) return "";
  const line=p.last_five_line!=null?p.last_five_line:(p.market==="goal"?1:null);
  const hits=line==null?null:v.filter(x=>x>=line).length;
  return `<div class="l5h"><span>Last five appearances</span>${
      hits!=null?`<span>${Math.round(100*hits/v.length)}% hit (${hits}/${v.length})</span>`:""}</div>
    <div class="l5t">${v.map(x=>`<i class="${line!=null?(x>=line?"hit":"miss"):""}">${x}</i>`).join("")}</div>`;
}

// PRICE SAYS "—" ON PURPOSE. No bookmaker prop price is fetched for soccer, so an
// edge here would be invented. The column stays so the layout matches the other
// boards, and says plainly that there is nothing in it.
function propTableRow(p){
  const v=p.last_five||[];
  const avg=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2).replace(/\.?0+$/,""):"—";
  const xi=p.lineup_confirmed?"Confirmed starting XI":"Waiting for confirmed starting XI";
  return `<div class="brow">${timeCell(p.date)}
    <div class="be"><div class="beb">${esc(LG[p.league_key]||p.league||"")} · ${esc(PMK[p.market]||p.market)}</div>
      <b>${esc(p.player)}</b>
      <span>${esc(p.home||"")} vs ${esc(p.away||"")} · ${esc(p.team||"")} · ${xi}${
        p.doubt?" · fitness doubt":""}${p.penalty_taker?" · takes penalties":""}</span>
      ${lastFiveTiles(p)}</div>
    <div class="bs"><b class="sel">${esc(PSEL[p.market]||p.line||p.market)}</b>${confTag(bandOf(p))}</div>
    ${probCell(p.p_pick)}${valCell("Per appearance",avg)}${valCell("Price","—","off")}</div>`;
}

// Edge = model probability minus the book's implied probability (1/odds). The
// implied figure still carries the bookmaker's margin, so this understates the
// edge rather than flattering it.
function bestTableRow(u){
  const odds=Number(u.odds), priced=u.odds!=null&&Number.isFinite(odds)&&odds>1;
  const edge=priced?(u.p_pick-1/odds)*100:null;
  return `<div class="brow click" onclick="openMatch('${u.league_key}',${u.id})">${timeCell(u.date)}
    <div class="be"><div class="beb">${esc(LG[u.league_key]||"")} · Match winner</div>
      <b>${esc(u.home)} vs ${esc(u.away)}</b>
      <span>Model selection: <em>${esc(u.pick)}</em>${u.score?` · Correct score: <em>${esc(u.score)}</em>`:""}</span></div>
    <div class="bs">${confTag(bandOf(u))}</div>
    ${probCell(u.p_pick)}
    ${valCell(priced?(u.book||"Bookmaker"):"Price",priced?odds.toFixed(2):"—",priced?"":"off")}
    ${valCell("Edge",edge!=null?`${edge>0?"+":""}${edge.toFixed(1)} pp`:"—",edge==null?"off":edge>=0?"pos":"neg")}</div>`;
}

function todayTableRow(r){
  const score=r.result?`${r.result.home_goals}-${r.result.away_goals}`:null;
  const l=score?null:liveFor(r, r.lgKey);
  const verdict=r.void?`<span class="res void">void</span>`:r.graded?`<span class="res ${r.graded}">${r.graded}</span>`:"";
  const state=score?`Final ${score}`:l?`${esc(liveClock(l))} · ${l.home_goals}-${l.away_goals}`:"Not started";
  return `<div class="brow click" onclick="${r.go}">${timeCell(r.date)}
    <div class="be"><div class="beb">${esc(r.comp||"")} · Winner</div>
      <b>${esc(r.home)} vs ${esc(r.away)}</b>
      <span>${r.pick?`Model selection: <em>${esc(r.pick)}</em>`:"No pick"}${score&&verdict?` · final ${score}`:""}</span></div>
    <div class="bs">${l?`<span class="livetag"><i></i>LIVE</span>`:confTag(r.conf)}</div>
    ${probCell(r.p)}
    <div class="bc"><small>Result</small>${verdict||`<b class="bn off" style="font-size:13px">${state}</b>`}</div></div>`;
}

// --- Results: newest graded first --------------------------------------------
function settledRows(){
  const m=gradedMatches(gsport).map(x=>({kind:"team",x,date:x.date}));
  const p=gradedProps(gsport).map(x=>({kind:"prop",x,date:x.date||x.kickoff}));
  return m.concat(p).sort((a,b)=>new Date(b.date)-new Date(a.date));
}
function propSel(p){
  if(PSEL[p.market]) return PSEL[p.market];
  if(p.market==="anytime_touchdown") return "Anytime TD";
  return p.line!=null?`Over ${p.line} ${gradeName(p.market).toLowerCase()} yards`:gradeName(p.market);
}
function winChip(x){
  const g=x.void?"void":x.graded;
  if(g==="correct") return `<span class="wv win">WIN</span>`;
  if(g==="void") return `<span class="wv void">VOID</span>`;
  return `<span class="wv loss">LOSS</span>`;
}
function settledRow(r){
  const x=r.x;
  if(r.kind==="prop"){
    const lg=x.league||LG[x.league_key]||(gsport==="nfl"?"NFL":"");
    return `<div class="srow"><div class="be"><div class="beb">${esc(lg)} · ${esc(PMK[x.market]||gradeName(x.market))}</div>
      <b>${esc(x.player)} · ${esc(propSel(x))}</b>
      <span>${esc(x.home||"")} vs ${esc(x.away||"")} · ${esc(actualLabel(x))} · settled ${whenStr(r.date)}</span></div>
      <div class="sty"><small>Type</small><b>Player prop</b></div>${winChip(x)}</div>`;
  }
  const res=x.result;
  const teams=(typeof res==="string"&&res)?esc(res)
    :`${esc(x.home)} ${res&&typeof res==="object"?`${res.home_goals}–${res.away_goals}`:"vs"} ${esc(x.away)}`;
  return `<div class="srow"><div class="be"><div class="beb">${esc(x.league||"")} · Match winner</div>
    <b>${esc(x.pick||"—")}${x.p_pick!=null?` · ${pc(x.p_pick)}%`:""}</b>
    <span>${teams} · settled ${whenStr(r.date)}</span></div>
    <div class="sty"><small>Type</small><b>Team pick</b></div>${winChip(x)}</div>`;
}
const SETTLED_SHOW=25;
function latestSettled(){
  const all=settledRows();
  if(!all.length) return "";
  const nT=all.filter(r=>r.kind==="team").length, nP=all.length-nT;
  const rows=all.filter(r=>rkind==="all"||r.kind===rkind);
  const shown=rall?rows:rows.slice(0,SETTLED_SHOW);
  const chip=(k,l,n)=>`<button class="chip ${rkind===k?"on":""}" type="button" onclick="setRKind('${k}')">${l} <span class="rng">${n}</span></button>`;
  return `<section class="glass settled">
    <div class="sech"><div><div class="eb">Latest settled</div><h2>Newest graded results</h2>
      <p>Team predictions and player props that finished most recently appear here first.</p></div>
      <div class="chips">${chip("all","All",all.length)}${chip("team","Team picks",nT)}${chip("prop","Player props",nP)}</div></div>
    <div class="slist">${shown.map(settledRow).join("")||emptyRow("Nothing settled in this view yet")}</div>
    ${rows.length>shown.length?`<button class="dbtn more" type="button" onclick="showAllSettled()">Show all ${rows.length}</button>`:""}
  </section>`;
}

function viewBest(){
  const best=DATA.best||{}, all=best.upcoming||[], settled=(best.settled||[]);
  if(!all.length && !settled.length) return emptyState();
  // Counts come from the UNFILTERED list so the chips do not renumber
  // themselves as the reader moves between them.
  let h=boardFilters(all, tierChips(all));
  const up=all.filter(inBoard).sort((a,b)=>new Date(a.date)-new Date(b.date));
  h+=sectHead("Henry's live model",`Strongest model picks · p ≥ ${pc(best.min_probability||.65)}%`,
    "Edge is the model's probability minus the bookmaker's implied probability, shown only where a price is published.");
  h+=up.length?btable(PCOLS,up.map(bestTableRow).join(""))
    :`<div class="glass rowc">${emptyRow(all.length?"No picks match these filters":"No picks on the board")}</div>`;
  if(settled.length){h+=`<div class="eyebrow mt">Settled</div><div class="glass rowc">${settled.slice(0,12).map(s=>`
    <div class="rw static"><span class="lgtag" style="background:${LC[s.league_key]}"></span>
      <div class="info"><b>${esc(s.home)} v ${esc(s.away)}</b><span>pick ${esc(s.pick)}${s.result?` · ${s.result.home_goals}-${s.result.away_goals}`:""}</span></div>
      <span class="res ${s.graded}">${s.graded}</span></div>`).join("")}</div>`;}
  return h;
}

// The last five matches, same component the NFL board uses -- the actual games,
// filled where the game cleared this market's line. "0, 2, 0, 1, 3 shots" and
// "1.2 average" describe very different players, and only one of them tells you
// whether a 2+ shots pick is a habit or a hope.
function soccerLastFive(p){
  const v=p.last_five||[];
  if(!v.length) return "";

function viewPlayers(){
  const pp=DATA.player_picks||{}, up=pp.upcoming||[];
  if(!up.length) return emptyState();
  const chips=[["all","All markets"],["sot","Shots on target"],["shots","Total shots"],["goal","Anytime goal"]];
  const NAME={goal:"Anytime goalscorer",shots:"2+ shot attempts",sot:"1+ shot on target"};
  const rbm=pp.record_by_market||{};
  const mchips=`<div class="chips">${chips.map(c=>`<button class="chip ${filter===c[0]?"on":""}" type="button" onclick="setFilter('${c[0]}')">${c[1]}</button>`).join("")}</div>`;
  let h=boardFilters(up, tierChips(up), mchips);
  // ONE SECTION PER MARKET, always -- including under "All". The three markets
  // have completely different ceilings (a 31% anytime pick and a 69% shots pick
  // are both near the top of their own market), so a single mixed list ranked by
  // probability buries every goalscorer under every shots pick.
  const markets=(filter==="all")?["sot","shots","goal"]:[filter];
  for(const mk of markets){
    const list=up.filter(p=>p.market===mk&&inBoard(p)).sort((a,b)=>b.p_pick-a.p_pick);
    const r=rbm[mk]||{};
    h+=sectHead("Live board",`${NAME[mk]||mk} · ${list.length} pick${list.length===1?"":"s"}`,
      (r.total?`${r.correct}–${r.wrong} graded in this market. `:"")
      +"No bookmaker prop price is fetched, so Price shows — rather than an invented edge.");
    h+=list.length?btable(PCOLS,list.map(propTableRow).join(""))
      :`<div class="glass rowc">${emptyRow("No picks match these filters")}</div>`;
  }
  if((pp.ungradeable_leagues||[]).length)
    h+=`<p class="note">${esc(pp.ungradeable_leagues.join(", "))} player picks publish but are not graded — no shot-level feed there.</p>`;
  // Played, frozen, still waiting on the shot feed -- said out loud, because a
  // pick that silently vanished between kickoff and the record would hide it.
  const aw=pp.awaiting_data||[];
  if(aw.length)
    h+=`<p class="note">${aw.length} settled pick${aw.length===1?"":"s"} awaiting result data — `
      +`${esc(aw.slice(0,3).map(a=>a.player).join(", "))}${aw.length>3?` and ${aw.length-3} more`:""}. `
      +`Graded as soon as the feed publishes those fixtures; never guessed.</p>`;
  return h;
}

function tierRow(label,sub,rec){const done=(rec&&rec.total)?`${rec.correct}–${rec.wrong}`:"—";
