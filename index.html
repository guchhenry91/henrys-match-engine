<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Henry's Match Engine</title>
<style>
  :root{
    --ink:#eaf0ff; --sub:#8a96b8; --line:rgba(255,255,255,.10);
    --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09);
    --cyan:#37e6d8; --lime:#c8ff4d; --violet:#8b7bff; --hot:#ff5c8a; --amber:#ffcf5c;
    --r:22px; --safe:calc(90px + env(safe-area-inset-bottom));
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
    color:var(--ink);background:#05070f;overflow-x:hidden;min-height:100%}
  body::before{content:"";position:fixed;inset:-30%;z-index:-2;
    background:
      radial-gradient(38% 30% at 20% 6%, rgba(55,230,216,.34) 0%, transparent 60%),
      radial-gradient(42% 34% at 88% 4%, rgba(139,123,255,.34) 0%, transparent 62%),
      radial-gradient(46% 40% at 82% 96%, rgba(200,255,77,.20) 0%, transparent 60%),
      radial-gradient(50% 44% at 8% 90%, rgba(255,92,138,.24) 0%, transparent 60%);
    filter:blur(20px);animation:aur 24s ease-in-out infinite alternate}
  @keyframes aur{to{transform:translate3d(0,-4%,0) scale(1.08)}}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:3px 3px}
  @media (prefers-reduced-motion:reduce){body::before{animation:none}}

  .wrap{max-width:540px;margin:0 auto;padding:16px 15px var(--safe)}
  header{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 14px}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:850;font-size:18px;color:#05070f;
    background:linear-gradient(150deg,var(--cyan),var(--lime));box-shadow:0 0 24px rgba(55,230,216,.5)}
  .brand h1{font-size:16.5px;font-weight:800;letter-spacing:-.02em}
  .brand p{font-size:11px;color:var(--sub);font-weight:600}
  .live{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--lime);
    padding:6px 11px;border-radius:20px;border:1px solid rgba(200,255,77,.3);background:rgba(200,255,77,.08)}

  .glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
    backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
    box-shadow:0 16px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08)}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin:2px 2px 10px}
  .eyebrow.mt{margin-top:22px}
  main{animation:in .4s ease both}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--glass);color:var(--sub);
    font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:20px;cursor:pointer;transition:.2s;white-space:nowrap;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .chip.on{color:#05070f;background:linear-gradient(150deg,var(--cyan),#5ff0e4);border-color:transparent;box-shadow:0 5px 18px rgba(55,230,216,.4)}

  .hero{position:relative;padding:22px 20px;margin-bottom:14px;overflow:hidden;cursor:pointer}
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;
    background:radial-gradient(circle,rgba(55,230,216,.4),transparent 70%);filter:blur(6px)}
  .hero .lg{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
  .hero .mt2{font-size:26px;font-weight:850;letter-spacing:-.03em;margin:8px 0 4px;line-height:1.04;position:relative;z-index:1}
  .hero .pk{font-size:13.5px;color:var(--sub);font-weight:650;position:relative;z-index:1}
  .hero .pk b{color:var(--lime)}
  .hero .num{position:relative;z-index:1;margin-top:16px;display:flex;align-items:baseline;gap:8px}
  .hero .num b{font-size:50px;font-weight:850;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
    background:linear-gradient(150deg,var(--cyan),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .num span{font-size:13px;color:var(--sub);font-weight:650}
  .hero .go{position:absolute;right:18px;bottom:18px;z-index:1;font-size:12px;font-weight:750;color:var(--cyan)}

  .tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
  .tile{padding:14px 12px;text-align:center}
  .tile .k{font-size:24px;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .tile .k.grad{background:linear-gradient(150deg,var(--cyan),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tile .l{font-size:10.5px;color:var(--sub);font-weight:650;margin-top:3px;letter-spacing:.02em}

  .rowc{padding:6px;margin-bottom:14px}
  .rw{display:flex;align-items:center;gap:13px;padding:14px 14px;border-radius:16px;position:relative;cursor:pointer;transition:background .15s}
  .rw+.rw{margin-top:2px}
  .rw:active{background:var(--glass2)}
  .rw.static{cursor:default}
  .lgtag{width:4px;align-self:stretch;border-radius:4px;flex:0 0 auto;min-height:34px}
  .rw .info{flex:1;min-width:0}
  .rw .info b{font-size:15.5px;font-weight:750;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
  .rw .info span{font-size:12px;color:var(--sub);font-weight:600}
  .conf{flex:0 0 auto;text-align:right;min-width:96px}
  .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--lime));box-shadow:0 0 12px rgba(55,230,216,.6)}
  .conf b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
  .conf span{font-size:11px;color:var(--sub);font-weight:600}
  .chev{color:var(--sub);font-size:18px;flex:0 0 auto;margin-left:-4px}
  .tier{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;flex:0 0 auto}
  .t-elite{color:#05070f;background:var(--lime)}
  .t-strong{color:var(--cyan);background:rgba(55,230,216,.14);border:1px solid rgba(55,230,216,.25)}
  .t-lean{color:var(--sub);background:rgba(255,255,255,.06)}
  .res{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;flex:0 0 auto}
  .res.correct{color:#05070f;background:var(--lime)}.res.wrong{color:#fff;background:var(--hot)}.res.void{color:var(--sub);background:rgba(255,255,255,.06)}

  .av{width:44px;height:44px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;font-weight:800;font-size:15px;color:#05070f}
  .mk{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:8px;
    color:var(--cyan);background:rgba(55,230,216,.12);border:1px solid rgba(55,230,216,.22);flex:0 0 auto}
  .mk.g{color:var(--lime);background:rgba(200,255,77,.12);border-color:rgba(200,255,77,.25)}
  .mk.a{color:var(--cyan);background:rgba(55,230,216,.12);border-color:rgba(55,230,216,.22)}
  .mk.o{color:var(--violet);background:rgba(139,123,255,.14);border-color:rgba(139,123,255,.28)}
  .mk.w{color:var(--amber);background:rgba(255,207,92,.12);border-color:rgba(255,207,92,.28)}
  .mk.r{color:#ff8f6a;background:rgba(255,143,106,.12);border-color:rgba(255,143,106,.26)}
  .mk.p{color:#6ab8ff;background:rgba(106,184,255,.12);border-color:rgba(106,184,255,.26)}
  /* Last five games. Tabular figures so the column of numbers reads as a series
     rather than ragged text, and a filled chip where the game beat the line --
     the shape of a player's form should be legible before any number is read. */
  .l5{display:flex;gap:3px;margin-top:5px}
  .l5 i{font-style:normal;flex:0 0 auto;min-width:27px;text-align:center;padding:2px 4px;
    border-radius:6px;font-size:10.5px;font-weight:750;font-variant-numeric:tabular-nums;
    background:var(--glass2);color:var(--sub);border:1px solid transparent}
  .l5 i.hit{background:rgba(55,230,216,.15);color:var(--cyan);border-color:rgba(55,230,216,.25)}
  .l5 i.now{box-shadow:0 0 0 1px rgba(255,255,255,.10) inset}

  .tr{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px}
  .tr.head{padding:8px 14px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:800}
  .tr:nth-child(even):not(.head){background:rgba(255,255,255,.03)}
  .pos{width:20px;text-align:center;font-weight:800;color:var(--sub);font-variant-numeric:tabular-nums}
  .pos.top{color:var(--cyan)}.pos.rel{color:var(--hot)}
  .tr .team{flex:1;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tr .pts{width:40px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:13.5px;flex:0 0 auto}
  .stnum{width:30px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--sub);flex:0 0 auto}
  .psc{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--cyan);flex:0 0 auto;min-width:40px;text-align:center;letter-spacing:.03em}
  .psc small{display:block;font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-top:1px}
  .badge{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 6px;border-radius:6px;flex:0 0 auto}
  .b-ucl{color:var(--cyan);border:1px solid rgba(55,230,216,.28)}.b-rel{color:var(--hot);border:1px solid rgba(255,92,138,.3)}

  .back{display:inline-flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);
    color:var(--ink);font-family:inherit;font-size:13px;font-weight:700;padding:9px 14px;border-radius:20px;cursor:pointer;margin-bottom:14px}
  .dhead{padding:20px;margin-bottom:14px;text-align:center;position:relative;overflow:hidden}
  .dhead .lg{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
  .dhead .vs{font-size:23px;font-weight:850;letter-spacing:-.03em;margin:8px 0 12px}
  .score{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:6px}
  .score b{font-size:42px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .score span{font-size:12px;color:var(--sub);font-weight:700}
  .split{display:flex;height:38px;border-radius:12px;overflow:hidden;margin:14px 6px 0;border:1px solid var(--line)}
  .split div{display:grid;place-items:center;font-size:12px;font-weight:800;color:#05070f;min-width:26px}
  .sh{background:linear-gradient(180deg,var(--cyan),#2bbfb4)}
  .sd{background:#39415c;color:var(--ink)}
  .sa{background:linear-gradient(180deg,var(--hot),#e04d7d)}
  .dsec{padding:16px 18px;margin-bottom:12px}
  .dsec h3{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:12px}
  .sl{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .sl .sc{font-size:13px;font-weight:800;width:40px;font-variant-numeric:tabular-nums}
  .sl .sb{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
  .sl .sb i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan))}
  .sl .sp{font-size:12px;font-weight:700;color:var(--sub);width:34px;text-align:right;font-variant-numeric:tabular-nums}
  .rl{padding:8px 0;font-size:13.5px;font-weight:650;color:var(--ink);line-height:1.4}
  .rl+.rl{border-top:1px solid var(--line)}
  .warnbox{padding:13px 16px;margin-bottom:12px;font-size:12.5px;font-weight:600;color:var(--amber);line-height:1.5;
    border:1px solid rgba(255,207,92,.25);background:rgba(255,207,92,.06)}

  .acca{padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
  .acca.feat{border:1px solid rgba(200,255,77,.28)}
  .acca .ah{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .acca .an{font-size:16px;font-weight:850;letter-spacing:-.01em}
  .acca .an small{display:block;font-size:11px;color:var(--sub);font-weight:650;margin-top:2px}
  .acca .ac{text-align:right;flex:0 0 auto}
  .acca .ac b{font-size:30px;font-weight:850;font-variant-numeric:tabular-nums;line-height:1;
    background:linear-gradient(150deg,var(--cyan),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
  .acca .ac span{display:block;font-size:10px;color:var(--sub);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:3px}
  .legs{margin-top:14px}
  .ptm{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);
       padding:12px 0 2px;border-top:1px solid var(--line)}
  .ptm:first-of-type{border-top:none;padding-top:4px}
  .leg{display:flex;align-items:center;gap:11px;padding:11px 0}
  .leg+.leg{border-top:1px solid var(--line)}
  .leg .stt{width:9px;height:9px;border-radius:50%;background:#59637e;flex:0 0 auto;box-shadow:0 0 0 3px rgba(89,99,126,.15)}
  .leg .li2{flex:1;min-width:0}
  .leg .li2 b{font-size:14px;font-weight:750;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
  .leg .li2 span{font-size:11.5px;color:var(--sub);font-weight:600}
  .leg .lp{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--sub);flex:0 0 auto}
  .acfoot{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--sub)}
  .acfoot .pend{color:var(--amber)}
  .secttl{font-size:15px;font-weight:850;letter-spacing:-.01em;margin:4px 2px 2px}
  .sectsub{font-size:11.5px;color:var(--sub);font-weight:600;margin:0 2px 12px;line-height:1.4}
  .explain{padding:18px}
  .explain h3{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:12px}
  .estep{display:flex;gap:12px;padding:8px 0;font-size:13px;font-weight:600;line-height:1.45}
  .estep .en{width:22px;height:22px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-size:11px;font-weight:850;color:#05070f;
    background:linear-gradient(150deg,var(--cyan),var(--lime))}
  .estep span{color:var(--sub);font-weight:600}

  .stat{padding:26px 20px;margin-bottom:14px;text-align:center}
  .stat .k{font-size:52px;font-weight:850;letter-spacing:-.04em;
    background:linear-gradient(150deg,var(--cyan),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .l{font-size:13px;color:var(--sub);font-weight:650;margin-top:4px}
  .note{font-size:12.5px;color:var(--sub);font-weight:600;text-align:center;padding:10px 24px 0;line-height:1.55}
  .mktrow{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:750;margin-top:6px}
  .mktrow span{flex:1;text-align:left;color:var(--sub);font-weight:650}
  .mktrow b{width:48px;flex:0 0 auto;text-align:center;font-variant-numeric:tabular-nums;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mktrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mkthead b{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--sub)}
  .mktedge{font-size:12.5px;font-weight:800;margin-top:10px}

  /* calibration / reliability chart */
  .cal{padding:8px 6px 4px;margin-bottom:8px}
  .calrow{display:flex;align-items:center;gap:12px;padding:12px 14px}
  .calrow+.calrow{border-top:1px solid var(--line)}
  .calband{width:64px;flex:0 0 auto;font-size:13px;font-weight:750;color:var(--ink)}
  .caln{font-size:10.5px;color:var(--sub);font-weight:650;display:block;margin-top:1px}
  .caltrack{flex:1;position:relative;height:22px}
  .caltrack .rail{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:4px;background:rgba(255,255,255,.08)}
  .caltrack .expect{position:absolute;top:2px;bottom:2px;width:2px;background:var(--sub);border-radius:2px}
  .caltrack .actual{position:absolute;top:0;height:22px;width:22px;margin-left:-11px;border-radius:50%;
    background:linear-gradient(150deg,var(--cyan),var(--lime));box-shadow:0 0 10px rgba(55,230,216,.5);
    display:grid;place-items:center;font-size:9px;font-weight:850;color:#05070f}
  .callegend{display:flex;gap:16px;justify-content:center;padding:10px 4px 2px;font-size:11px;color:var(--sub);font-weight:650}
  .callegend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .arch{text-align:center;padding:22px 10px 4px}
  .arch a{color:var(--sub);font-size:12px;font-weight:650;text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
  .loading{text-align:center;padding:60px 0;color:var(--sub);font-weight:650}

  nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
    width:calc(100% - 26px);max-width:512px;z-index:40;display:flex;gap:2px;padding:7px;border-radius:24px;
    background:rgba(12,16,28,.72);border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);
    box-shadow:0 16px 44px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;border:0;background:transparent;color:var(--sub);cursor:pointer;font-family:inherit;
    font-size:12px;font-weight:750;padding:9px 13px;border-radius:18px;white-space:nowrap;transition:.2s}
  nav button.on{color:#05070f;background:linear-gradient(150deg,var(--cyan),#5ff0e4);box-shadow:0 6px 16px rgba(55,230,216,.4)}
  nav button:not(.on):active{background:rgba(255,255,255,.07)}
  nav button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">H</div><div><h1>Henry's Match Engine</h1><p id="sub">Today</p></div></div>
    <span class="live" id="live">● Live</span>
  </header>
  <main id="app"><div class="loading">Loading the model…</div></main>
</div>
<nav id="nav" aria-label="Sections"></nav>

<script>
"use strict";
const FILES={PL:"pl",LALIGA:"laliga",BUNDESLIGA:"bundesliga",LIGUE1:"ligue1"};
const LG={PL:"Premier League",LALIGA:"La Liga",BUNDESLIGA:"Bundesliga",LIGUE1:"Ligue 1"};
const LC={PL:"#ff5c6a",LALIGA:"#f5c518",BUNDESLIGA:"#ff5c8a",LIGUE1:"#37a9e6"};
const TC={"Bayern Munich":"#37e6d8","Manchester City":"#8b7bff","Stuttgart":"#c8ff4d","Dortmund":"#f5c518",
  "Ath Madrid":"#ff5c8a","Arsenal":"#37e6d8","Paris SG":"#8b7bff","Real Madrid":"#c8ff4d","Barcelona":"#37e6d8","Liverpool":"#ff5c8a"};
const tc=n=>TC[n]||"#37e6d8";
// NFL sides get the same treatment clubs do -- a colour makes a 32-team board
// scannable in a way a wall of three-letter codes never is. Grouped by
// conference-ish families rather than exact brand colours, which would be
// unreadable at 44px against a dark glass panel.
const NFLC={KC:"#ff5c6a",BUF:"#37a9e6",PHI:"#37e6d8",SF:"#f5c518",BAL:"#8b7bff",
  DET:"#37a9e6",DAL:"#6ab8ff",GB:"#c8ff4d",MIN:"#8b7bff",CIN:"#ff8f6a",
  HOU:"#37a9e6",LAC:"#f5c518",LA:"#6ab8ff",TB:"#ff5c6a",PIT:"#f5c518",
  SEA:"#37e6d8",DEN:"#ff8f6a",MIA:"#37e6d8",NYJ:"#c8ff4d",NE:"#8b7bff",
  JAX:"#37e6d8",IND:"#6ab8ff",TEN:"#37a9e6",CLE:"#ff8f6a",LV:"#c9d1e0",

const relAge=h=>h<1?"moments ago":h<24?Math.round(h)+"h ago":Math.round(h/24)+"d ago";
function computeFreshness(){
  const stamps=[];
  ["best","player_picks","parlays","pl","laliga","bundesliga","ligue1"].forEach(n=>{
    const u=(DATA[n]||{}).updated; if(u){const t=new Date(u); if(!isNaN(t)) stamps.push(+t);}});
  if(!stamps.length) return {stale:false, text:""};
  const ageH=(Date.now()-Math.max(...stamps))/36e5;
  // soonest upcoming fixture across leagues -> is this an active window?
  let soonest=Infinity;
  ["pl","laliga","bundesliga","ligue1"].forEach(k=>((DATA[k]||{}).matches||[]).forEach(m=>{
    if(!m.result){const d=new Date(m.date); if(!isNaN(d)) soonest=Math.min(soonest,(+d-Date.now())/36e5);}}));
  // When a fixture is within 3 days the pipeline refreshes often, so data should
  // be fresh (warn at 14h). In a quiet stretch it legitimately doesn't republish,
  // so only warn once genuinely abandoned (5 days).
  const limit = soonest<=72 ? 14 : 120;
  return {stale: ageH>limit, text: relAge(ageH), ageH};
}

// Kickoff shown in the READER'S OWN timezone. The payload stores UTC, which is
// right for storage and useless on a card -- a reader in London should not be
// converting 19:00Z in their head to know when Arsenal kick off. Date.toLocale*
// handles the offset and the DST switch on 25 October for free.
// Compact by design: "Fri 21 Aug, 20:00". Today and tomorrow say so instead,
// because that is what a reader actually wants to know on a matchday.
function whenStr(iso){
  const d=new Date(iso); if(isNaN(d)) return "";
  const time=d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit",hour12:false});
  const day0=new Date(); day0.setHours(0,0,0,0);
  const days=Math.round((new Date(d).setHours(0,0,0,0)-day0)/86400000);
  if(days===0) return `Today ${time}`;
  if(days===1) return `Tomorrow ${time}`;
  return `${d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})}, ${time}`;
}

// Group fixtures under the day they are played, with a count -- a flat list of
// 30 fixtures across four leagues is hard to scan, and "SATURDAY 22 AUGUST ·
// 9 matches" tells a reader where to look immediately.
function groupByDay(items){
  const out=[], seen=new Map();
  for(const it of items){
    const d=new Date(it.date); if(isNaN(d)) continue;
    const key=d.toDateString();
    if(!seen.has(key)){ const g={key,date:d,items:[]}; seen.set(key,g); out.push(g); }
    seen.get(key).items.push(it);
  }
  out.sort((a,b)=>a.date-b.date);
  return out;
}
function dayHeading(d){
  const day0=new Date(); day0.setHours(0,0,0,0);
  const days=Math.round((new Date(d).setHours(0,0,0,0)-day0)/86400000);
  const rel=days===0?"Today":days===1?"Tomorrow":null;
  const full=d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  return rel?`${rel} · ${full}`:full;
}
// All three outcomes, not just the picked one. A single number hides the draw
// risk: 44/28/28 and 44/12/44 are the same "44% pick" and completely different
// bets. The picked side is emphasised so the row still reads as a call.
function hdaStrip(p){
  // Stacked UNDER the fixture rather than beside it. As a right-hand column it
  // cost ~95px and truncated five of nine fixture names at 375px; the row has
  // full width to give underneath, so nothing is clipped.
  const cell=(lbl,v,on)=>`<span style="font-variant-numeric:tabular-nums;
    ${on?"color:var(--ink);font-weight:800":"color:var(--sub);font-weight:600"}">${lbl} ${pc(v)}</span>`;
  return `<div style="display:flex;gap:12px;font-size:11.5px;margin-top:4px">
    ${cell("H",p.p_home,p.pick_type==="home")}${cell("D",p.p_draw,p.pick_type==="draw")}${cell("A",p.p_away,p.pick_type==="away")}</div>`;
}

function tierOf(p){return p>=.75?`<span class="tier t-elite">Elite</span>`:p>=.68?`<span class="tier t-strong">Strong</span>`:`<span class="tier t-lean">Lean</span>`;}

function bestRow(u){
  // The bookmaker's price on the picked side, when the fixture is priced. Odds
  // only appear about a week out, so this is absent more often than not and the
  // row must read fine without it.
  const price=(u.odds!=null&&Number.isFinite(Number(u.odds)))
    ? ` · ${esc(u.book||"bookmaker")} ${Number(u.odds).toFixed(2)}` : "";
  return `<div class="rw" onclick="openMatch('${u.league_key}',${u.id})"><span class="lgtag" style="background:${LC[u.league_key]}"></span>
    <div class="info"><b>${esc(u.home)} v ${esc(u.away)}</b><span>${whenStr(u.date)} · ${esc(LG[u.league_key])} · pick ${esc(u.pick)}${price}</span></div>

  // have completely different ceilings (a 31% anytime pick and a 69% shots pick
  // are both near the top of their own market), so a single mixed list ranked by

  const markets=(filter==="all")?["goal","shots","sot"]:[filter];

    h+=`<p class="note">${esc(pp.ungradeable_leagues.join(", "))} player picks publish but are not graded — no shot-level feed there.</p>`;

  // filed, which published a 0% hit rate that was pure fiction. Showing nothing
  // at all would be the quieter version of the same dishonesty -- the reader

  const aw=pp.awaiting_data||[];

      +`Graded as soon as the feed publishes those fixtures; never guessed.</p>`;

function tierRow(label,sub,rec){const done=(rec&&rec.total)?`${rec.correct}–${rec.wrong}`:"—";

// Reliability / calibration: does a stated confidence actually match its real
// hit rate? Confidence tiers (1-5) already map to fixed probability bands via
// publish.py's _confidence(), and by_confidence already tracks correct/total
// per tier on BOTH boards -- this is a pure display of data that already
// exists, not a new measurement. Tiers are pooled across match-winner AND
// player-prop picks: the question ("does the model's 70%+ actually land 70%+
// of the time") is the same regardless of which board the pick came from.
const CAL_BANDS=[
  {tier:"1",label:"<40%",lo:33,hi:40},
  {tier:"2",label:"40–50%",lo:40,hi:50},
  {tier:"3",label:"50–60%",lo:50,hi:60},
  {tier:"4",label:"60–70%",lo:60,hi:70},
  {tier:"5",label:"70%+",lo:70,hi:95}];
const calScale=v=>Math.max(0,Math.min(100,(v-30)/70*100));
function combinedByConfidence(){
  const out={};
  [(DATA.best||{}).record, (DATA.player_picks||{}).record].forEach(rec=>{
    const bc=(rec||{}).by_confidence||{};
    Object.keys(bc).forEach(t=>{
      const cur=out[t]||{correct:0,total:0};
      out[t]={correct:cur.correct+(bc[t].correct||0), total:cur.total+(bc[t].total||0)};
    });
  });
  return out;
}
function calibrationBlock(){
  const bc=combinedByConfidence();
  const rows=CAL_BANDS.map(b=>({...b, ...(bc[b.tier]||{correct:0,total:0})})).filter(r=>r.total>0);
  if(!rows.length){
    return `<div class="eyebrow mt">Calibration</div><div class="glass stat"><div class="k">—</div>
      <div class="l">Fills in once picks settle: does a stated confidence actually land that often?</div></div>`;
  }
  const body=rows.map(r=>{const actual=100*r.correct/r.total, expect=(r.lo+r.hi)/2;
    return `<div class="calrow"><div class="calband">${r.label}<span class="caln">n=${r.total}</span></div>
      <div class="caltrack"><div class="rail"></div>
        <div class="expect" style="left:${calScale(expect)}%"></div>
        <div class="actual" style="left:${calScale(actual)}%" title="${Math.round(actual)}% actual">${Math.round(actual)}</div>
      </div></div>`;}).join("");
  return `<div class="eyebrow mt">Calibration · stated confidence vs. actual hit rate</div>
    <div class="glass cal">${body}</div>
    <div class="callegend"><span><i class="dot" style="background:var(--sub)"></i>model's stated confidence</span>
      <span><i class="dot" style="background:linear-gradient(150deg,var(--cyan),var(--lime))"></i>actual result</span></div>
    <p class="note">If the dot sits near the grey tick, a stated confidence means what it says. Off to the right = the model is underselling itself; off to the left = overconfident.</p>`;
}
// bet365's 6 Scores Challenge. Built to be MEASURED, not to imply a jackpot:
// in the Premier League this engine hits 11.84% per scoreline against 12.37%
// for simply writing 1-1 every time, so the expected haul of six is under one.
// That number is printed at the top of the section rather than buried, because

    <div class="l">expected correct of 6 · model ${s.hit_rate_pct}% vs ${s.baseline_pct}% for always 1-1</div></div>`;
  // Said up front, in words. A reader looking at 0/6 needs to know that is the
  // most likely single week, not a malfunction.
  if(s.outlook) h+=`<p class="note" style="margin-top:-2px">${esc(s.outlook)}</p>`;
  if(rec.total) h+=`<div class="glass stat"><div class="k">${rec.correct}/${rec.total}</div>
    <div class="l">Scorelines correct since launch</div></div>`;
  if(!picks.length){
    h+=`<div class="glass rowc">${emptyRow(s.missing_fixtures&&s.missing_fixtures.length
      ? "bet365's six include a fixture not in this matchweek — check the selection file"
      : "This week's six have not been published by bet365 yet")}</div>`;
  } else {
    h+=`<div class="eyebrow">${s.matchweek?`Matchweek ${s.matchweek} · `:""}the model's six</div>
      <div class="glass rowc">${picks.map(p=>{
      // TWO scores, side by side. The top one is the entry; the second is there
      // because the first is only ~12% likely and a lone number would overstate it.
      const alt=(p.alternatives||[])[0];
      return `<div class="rw static"><span class="lgtag" style="background:${LC.PL}"></span>
        <div class="info"><b>${p.rank?`${p.rank}. `:""}${esc(p.home)} v ${esc(p.away)}</b>
          <span>${whenStr(p.date)} · ${p.agrees_with_match_pick?"agrees with match pick":`match pick ${esc(p.match_pick||"—")}`}${p.provisional?"":" · locked"}</span></div>
        <div class="conf" style="min-width:104px">
          <b>${esc(p.score)}</b> <span style="font-size:11.5px">${p.score_pct}%</span>
          ${alt?`<span style="display:block;margin-top:2px;font-size:10.5px;opacity:.7">or ${esc(alt.score)} ${alt.pct}%${
            p.gap_to_next_pp!=null?` &middot; costs ${p.gap_to_next_pp}pp`:""}</span>`:""}
        </div></div>`;
    }).join("")}</div>`;
  }
  h+=`<p class="note">Ranked by how confident the model is, most confident first &mdash; these six are not equally hopeless, and that ordering is the only real steer this market allows. Two scores per fixture, because one would overstate it. &ldquo;Costs Xpp&rdquo; is what you give up by playing the second score instead of the first; it is usually two or three points, so differentiating from everyone else writing 1-1 is close to free. These are the likeliest and second-likeliest results from each side&rsquo;s expected goals — and the leader usually sits near 12%, so the model is really saying it does not know, and most weeks neither will be right. Evenly matched sides come out 1-1 because with about 1.3 goals a side that genuinely is the least unlikely score; where the gap is real, so is the prediction. The six fixtures are chosen by bet365, not by the model. In the Premier League the model does not beat always guessing 1-1 — this board is published so that can be checked week by week rather than argued about.</p>`;
  if((s.settled||[]).length){
    h+=`<div class="eyebrow mt">Settled</div><div class="glass rowc">${s.settled.map(x=>`
      <div class="rw static"><span class="lgtag" style="background:${LC.PL}"></span>
        <div class="info"><b>${esc(x.home)} ${esc(x.actual)} ${esc(x.away)}</b><span>predicted ${esc(x.predicted)}</span></div>
        <span class="res ${esc(x.graded)}">${x.graded==="correct"?"HIT":"MISS"}</span></div>`).join("")}</div>`;
  }
  return h+archiveLink();
}

function nflWhen(iso){
  // DATE ONLY. The schedule feed carries a gameday with no kickoff time, so the
  // shared whenStr rendered every game at "00:00" -- a precise-looking number
  // that is not merely unknown but wrong.
  try{
    const d=new Date(iso);
    if(isNaN(d)) return "";
    return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  }catch(e){return "";}
}

function nflLastFive(p){
  // The five games the projection was built from, oldest first, with the most
  // recent marked. Actual numbers rather than an average, because "23, 145, 0,
  // 71, 88" and "65.4 average" describe very different players.
  const v=p.last_five||[];
  if(!v.length) return "";
  const td=p.market==="anytime_touchdown";
  return `<div class="l5">${v.map((x,i)=>{
    const hit=td?x>0:(p.line!=null&&x>p.line);
    const label=td?(x>0?"TD":"·"):Math.round(x);
    const last=i===v.length-1?" now":"";
    return `<i class="${hit?"hit":""}${last}">${label}</i>`;
  }).join("")}</div>`;
}

function nflFig(p){
  // The sub-label under the percentage, matching how the football player cards
  // read: the line the pick is against, not just a bare number.
  if(p.market==="anytime_touchdown") return "anytime";
  return p.line==null?"":`over ${p.line}`;
}

// Strength bands, reusing the tier vocabulary the football boards already use.
// Colour that MEANS something: a 78% rushing over and a 51% touchdown are both
// "picks" and are not remotely the same claim, and a board where every row is the
// same shade makes the reader do that arithmetic themselves. Bands are set where
// these markets actually sit -- props cluster between 50% and 85%, so soccer's
// thresholds would paint almost everything a single colour.
function nflTier(prob){
  if(prob>=0.70) return {cls:"t-elite",label:"Strong"};
  if(prob>=0.60) return {cls:"t-strong",label:"Solid"};
  return {cls:"t-lean",label:"Lean"};
}
function nflConfColour(prob){
  if(prob>=0.70) return "var(--lime)";
  if(prob>=0.60) return "var(--cyan)";
  return "var(--ink)";
}

function nflPropRow(p){
  const m=NFLMK[p.market]||{tag:"a",name:p.market};
  const venue=p.home?"vs":"@";
  // Doubt rides in the market-tag vocabulary rather than a bespoke pill. Anyone
  // ruled OUT never reaches here -- publish removes him.
  const doubt=p.availability==="doubt"
    ? `<span class="mk w" title="${esc(p.injury_note||"")}">Doubt</span>` : "";
  const t=nflTier(p.probability);
  return `<div class="rw static">
    <div class="av" style="background:${nc(p.team)};font-size:${p.team.length>2?"13px":"15px"}">${esc(p.team)}</div>
    <div class="info"><b>${esc(p.player)}</b>
      <span>${esc(p.team)} ${venue} ${esc(p.opponent)} · ${nflWhen(p.kickoff)}</span>
      ${nflLastFive(p)}</div>
    ${doubt}<span class="tier ${t.cls}">${t.label}</span>
    <span class="mk ${m.tag}">${esc(m.name)}</span>
    <div class="conf" style="min-width:80px"><b style="color:${nflConfColour(p.probability)}">${pc(p.probability)}%</b>
      <span style="color:${p.line!=null?"var(--ink)":"var(--sub)"}">${esc(nflFig(p))}</span></div></div>`;
}

function nflGameRow(g){
  const pickHome=g.pick===g.home;
  return `<div class="rw static">
    <div class="av" style="background:${nc(g.pick)};font-size:${g.pick.length>2?"13px":"15px"}">${esc(g.pick)}</div>
    <div class="info"><b>${esc(g.away)} @ ${esc(g.home)}</b>
      <span>${nflWhen(g.kickoff)}${g.neutral?" · neutral":""} · Elo ${Math.round(g.rating_away)} v ${Math.round(g.rating_home)}</span></div>
    <span class="tier ${nflTier(g.p_pick).cls}">${nflTier(g.p_pick).label}</span>

    <div class="conf" style="min-width:80px"><b style="color:${nflConfColour(g.p_pick)}">${pc(g.p_pick)}%</b>

}

function viewNFL(){
  const d=DATA.nfl;
  if(!d) return emptyState();
  const ev=d.evidence||{};
  const chips=[["all","All"],["team_winner","Winners"],["anytime_touchdown","Anytime TD"],
               ["receiving_yards","Receiving"],["rushing_yards","Rushing"],["passing_yards","Passing"]];
  let h=`<div class="chips">${chips.map(c=>`<button class="chip ${filter===c[0]?"on":""}" type="button" onclick="setFilter('${c[0]}')">${c[1]}</button>`).join("")}</div>`;

  const tw=ev.team_winner||{};
  if(tw.n) h+=`<div class="glass stat"><div class="k">${pc(tw.accuracy)}%</div>
    <div class="l">Team winners on ${tw.n} games the model never saw · ${(tw.seasons_scored||[]).length} seasons</div></div>`;

  const allMarkets=["anytime_touchdown","receiving_yards","rushing_yards","passing_yards"];
  const markets = filter==="all" ? allMarkets : filter==="team_winner" ? [] : [filter];

  if(filter==="all"||filter==="team_winner"){
    const games=(d.games||[]).slice().sort((a,b)=>b.p_pick-a.p_pick);
    h+=`<div class="eyebrow" style="margin-top:18px">Team winner · ${
      d.season?`week ${d.week} · `:""}${games.length} game${games.length===1?"":"s"}</div>
      <div class="glass rowc">${games.map(nflGameRow).join("")
        ||emptyRow("No games in the current slate")}</div>`;
  }

  // ONE SECTION PER MARKET, the same reasoning as the football player picks: a
  // 53% anytime touchdown and an 80% rushing over are both near the top of their
  // own market, and a single ranked list buries every touchdown pick.
  for(const m of markets){
    const block=(d.props||{})[m];
    if(!block) continue;
    const e=ev[m]||{}, name=(NFLMK[m]||{}).name||m;
    const full=(d.markets||{})[m]||name;
    if(!block.released){
      h+=`<div class="eyebrow" style="margin-top:18px">${esc(name)}</div>
        <div class="glass rowc">${emptyRow("Withheld — did not clear the release gate")}</div>`;
      continue;
    }
    const picks=block.picks||[];
    // "All" is an OVERVIEW, not the whole database. Four markets at full length
    // is 111 rows of nearly identical cards -- the reader scrolls past the
    // touchdown board looking for the end of it and takes nothing in. The top few
    // per market here, the full list behind that market's own chip, which is how
    // the football player picks already behave.
    const overview = filter==="all";
    const shown = overview ? picks.slice(0, NFL_OVERVIEW) : picks;
    const more = picks.length - shown.length;
    const proof=e.n?` · ${e.n.toLocaleString()} unseen`:"";
    h+=`<div class="eyebrow" style="margin-top:18px">${esc(full)} · ${
      picks.length} pick${picks.length===1?"":"s"}${proof}</div>
      <div class="glass rowc">${shown.map(nflPropRow).join("")
        ||emptyRow("No picks in this market this week")}${
        more>0?`<div class="rw" onclick="setFilter('${m}')"><div class="info">
          <span>Show all ${picks.length} ${esc(full.toLowerCase())} picks →</span></div></div>`:""}</div>`;
  }

  const through=d.player_data_through||{}, inj=d.injury_report||{};
  h+=`<p class="note">Boxes are the last five games, oldest first, filled where the game beat the line — the same five the projection was built from. Lines are each player&rsquo;s own median, not a bookmaker price, so &ldquo;over&rdquo; means a better day than his typical one. Player data runs through ${through.season||"?"} week ${through.week||"?"}${
    inj.players_listed?`, and ${inj.players_listed} players carry an injury status from ${esc(inj.source||"the feed")} — anyone ruled out is off the board entirely` : ""}.</p>`;
  if((d.caveats||[]).length)
    h+=`<div class="glass warnbox" style="margin-top:10px">${d.caveats.map(c=>`<div>· ${esc(c)}</div>`).join("")}</div>`;
  return h+archiveLink();
}

// EVERY match pick, not just the ones that cleared the Best Picks bar.
// The board above only counts picks at p>=0.65, so a graded 47% call was
// invisible here: on 15 Aug the model went 2-0 on La Liga's openers and the
// Grades tab still read 0-0, because neither pick was confident enough to
// join the headline board. That understates the record AND hides the honest
// half of it -- the low-confidence calls are exactly the ones a reader should
// be able to judge.
function allPicksBlock(){
  const rows=[]; let c=0,w=0,v=0;
  Object.keys(FILES).forEach(k=>{
    const d=DATA[FILES[k]]||{}; const r=d.record||{};
    if(r.total) rows.push({k,r});
    c+=r.correct||0; w+=r.wrong||0; v+=r.void||0;
  });
  const tot=c+w;
  if(!tot) return "";
  // Most recent settled matches across all four leagues, newest first.
  const settled=[];
  Object.keys(FILES).forEach(k=>{
    ((DATA[FILES[k]]||{}).season||[]).forEach(m=>{
      if(m.result&&m.graded) settled.push({k,m});
    });
  });
  settled.sort((a,b)=>new Date(b.m.date)-new Date(a.m.date));
  let h=`<div class="eyebrow" style="margin-top:22px">Every match pick</div>
    <div class="glass stat"><div class="k">${c}–${w}</div>
    <div class="l">All leagues · ${Math.round(100*c/tot)}% of ${tot} graded${v?` · ${v} void`:""}</div></div>`;
  h+=`<div class="glass rowc">${rows.map(({k,r})=>
      tierRow(LG[k],`Match-winner picks`,r)).join("")}</div>`;
  h+=`<div class="glass rowc">${settled.slice(0,12).map(({k,m})=>
    `<div class="rw static"><span class="lgtag" style="background:${LC[k]}"></span>
      <div class="info"><b>${esc(m.home)} ${m.result.home_goals}–${m.result.away_goals} ${esc(m.away)}</b>
      <span>Pick: ${esc(m.pick||"—")}</span></div>
      <span class="res ${esc(m.graded)}">${m.graded==="correct"?"WON":(m.graded==="void"?"VOID":"LOST")}</span></div>`
  ).join("")}</div>`;
  const bar=Math.round(100*(((DATA.best||{}).min_probability)||0.65));
  // BY TIER. Pooling a 77% call with a 41% one produces a headline describing
  // neither, and the low-confidence picks are the ones with no board of their
  // own -- so they were being graded invisibly. publish already bands every pick
  // 1-5 by probability at lock time, so this is a display of data that exists.
  const BAND={5:"Elite · 70%+",4:"Strong · 60-70%",3:"Even · 50-60%",2:"Lean · 40-50%",1:"Longshot · under 40%"};
  const tiers={};
  Object.keys(FILES).forEach(k=>{
    const bc=((DATA[FILES[k]]||{}).record||{}).by_confidence||{};
    Object.entries(bc).forEach(([c,v])=>{
      const s=tiers[c]||(tiers[c]={correct:0,total:0});
      s.correct+=v.correct||0; s.total+=v.total||0;
    });
  });
  const bands=Object.keys(tiers).sort((a,b)=>b-a);
  if(bands.length)
    h+=`<div class="eyebrow" style="margin-top:18px">By confidence</div><div class="glass rowc">${
      bands.map(c=>tierRow(BAND[c]||`Band ${c}`,`${tiers[c].total} graded`,
        {correct:tiers[c].correct,wrong:tiers[c].total-tiers[c].correct,total:tiers[c].total})).join("")}</div>`;
  h+=`<p class="note">The board above counts only picks at ${bar}% or higher. This counts every match the model called, at any confidence — the fuller and less flattering number.</p>`;
  return h;
}

function standingsBlock(k){

function viewLeague(k){

  const ms=(d.matches||[]).filter(m=>!m.result);

  // Fixtures only -- the full standings live in the Tables tab, not repeated here.
  // The row shows p.score: the most likely scoreline GIVEN the pick, so the card
  // never reads "pick Manchester United ... 1-1". top_scores[0] is a DIFFERENT
  // number -- the highest-probability score across ALL results -- and is one tap
  // away in the match view, where correct-score betting needs it.
  let h=`<div class="sectsub" style="margin:0 2px 12px">Home · draw · away, out of 100. What may happen, not what will.</div>`;

      <div class="glass rowc">${g.items.map(m=>{const p=m.prediction||{};

function openMatch(lk,id){
  const d=DATA[FILES[lk]]; if(!d) return;
  const m=(d.matches||[]).find(x=>x.id===id); if(!m){render(cur);return;}
  const p=m.prediction||{};
  document.getElementById("sub").textContent="Match breakdown";
  const ph=pc(p.p_home),pd=pc(p.p_draw),pa=pc(p.p_away);
  // The headline score is p.score: the most likely scoreline GIVEN the pick, so
  // the card reads as one coherent call rather than "Pick: Man City ... 1-1".
  //
  // top_scores[0] is a DIFFERENT number -- the highest-probability score across
  // every result, which is measurably the better exact-score bet (12.60% vs
  // 10.69% top-1 accuracy over 3,958 walk-forward matches; on a six-fold
  // correct-score parlay that is ~1-in-249k vs ~1-in-671k). It is deliberately
  // NOT the headline -- coherence was chosen over that accuracy -- but it must
  // stay visible and labelled directly underneath, because correct-score
  // betting needs it and it is the stronger number for that job.
  const topsArr=(p.top_scores||[]);
  const best=topsArr[0];
  const sc=(p.score||"–").split("-");
  const bestPct=best?Math.round(best.pct||0):null;
  const tops=topsArr.slice(0,3).map(t=>`<div class="sl"><span class="sc">${esc(t.score)}</span>
    <span class="sb"><i style="width:${Math.min(100,(t.pct||0)*4.5)}%"></i></span><span class="sp">${Math.round(t.pct||0)}%</span></div>`).join("")||`<div class="rl">No scoreline spread available.</div>`;
  const reasons=(p.reasons||[]).map(r=>`<div class="rl">${esc(r)}</div>`).join("")||`<div class="rl">${esc(p.why||"")}</div>`;
  // Grouped BY TEAM. Previously this was a flat slice(0,5) over a 6-entry list
  // (top 3 per side), which always dropped the away team's third player and left
  // an unexplained 3-v-2 split. Nothing named the team either: tc() gives 66 of
  // the 76 clubs the same default colour, so the avatar identified nobody.
  // Probabilities only, all three from the same calibrated scale -- pairing a
  // calibrated "32% anytime" with a raw "3.4 attempts" invited reading the two
  // as if they agreed.
  const pct1=v=>v==null?"–":`${Math.round(Number(v))}%`;
  const propTeams=[m.home,m.away].map(t=>{
    const list=(m.props||[]).filter(pr=>pr.team===t)
      .sort((a,b)=>(b.anytime_pct||0)-(a.anytime_pct||0));
    // Name the team even when it has NO players, rather than quietly rendering a
    // one-sided list. A promoted side with no top-flight history gets no props by
    // design (MIN_SQUAD_FOR_PROPS); showing only the opponent makes that look
    // like a bug or, worse, like the club has nobody worth listing.
    if(!list.length) return `<div class="ptm">${esc(t)}</div>`+
      `<div class="rl">No player markets -- not enough top-flight history for this squad.</div>`;
    return `<div class="ptm">${esc(t)}</div>` + list.map(pr=>
      `<div class="leg"><div class="av" style="width:36px;height:36px;font-size:13px;background:${tc(pr.team)}">${esc(initials(pr.player))}</div>
    <div class="li2"><b>${esc(pr.player)}</b><span>${pct1(pr.anytime_pct)} goal · ${pct1(pr.p_shots_2plus)} 2+ shots · ${pct1(pr.p_sot_1plus)} 1+ on target</span></div></div>`).join("");
  }).join("");
  const props=propTeams;
  const ua=p.unmodeled_absences||{}; const uaAll=[...(ua.home||[]),...(ua.away||[])];
  const pickPct=Number.isFinite(Number(p.p_pick))?`${pc(p.p_pick)}%`:"–";
  // Model vs bookmakers. p.market is the de-vigged 1X2 line plus `edge` (model
  // probability MINUS market probability on the picked side). It is display-only:
  // no odds reach leagues/model.py, so nothing here changes a single prediction.
  // A gap is a DISAGREEMENT, not an edge in the betting sense -- the market may
  // simply be pricing team news the model cannot see -- and the copy says so
  // rather than letting a green number read as free money.
  // m.market, NOT p.market. `p` is m.prediction, and the market line is a
  // SIBLING of it on the match object. Reading it off the prediction gave
  // undefined every time, so this whole section silently rendered its "no line
  // posted" fallback even for fixtures that were priced -- which is why it never
  // looked broken. Caught only when a bet365 price was added and still did not
  // appear.
  const mk=m.market;
  // Number(null) is 0, which IS finite -- a bare Number.isFinite guard let a
  // null price through and rendered "Bookmakers 0% 0% 0%" while claiming the
  // model agreed with it. Reject null/undefined/"" explicitly.
  const priced=v=>v!=null&&v!==""&&Number.isFinite(Number(v));
  let marketSec="";
  if(mk && priced(mk.p_home) && priced(mk.p_draw) && priced(mk.p_away)){
    const e=priced(mk.edge)?Number(mk.edge):NaN, pts=Number.isFinite(e)?Math.round(Math.abs(e)*1000)/10:null;
    const agrees=Number.isFinite(e)&&Math.abs(e)<0.02;
    const edgeLine=pts==null?"":`<div class="mktedge" style="color:${agrees?"var(--sub)":(e>0?"var(--lime)":"var(--hot)")}">${
      agrees?`The model and the bookmakers broadly agree on ${esc(p.pick||"this pick")}.`
            :`The model rates ${esc(p.pick||"the pick")} ${pts} points ${e>0?"higher":"lower"} than the bookmakers.`}</div>`;
    // The PRICE as offered, undevigged, on its own row. The two rows above are
    // probabilities with the margin stripped out; this one is the number you
    // would actually be quoted, so it must never be "corrected".
    const o=mk.odds||{};
    const oddsRow=(priced(o.home)&&priced(o.draw)&&priced(o.away))
      ? `<div class="mktrow"><span>${esc(mk.book||"bookmaker")}</span>
           <b>${Number(o.home).toFixed(2)}</b><b>${Number(o.draw).toFixed(2)}</b><b>${Number(o.away).toFixed(2)}</b></div>`
      : "";
    // Expected value at that price, straight from the model's own probability.
    // Deliberately understated: the model does NOT beat the closing line (see
    // Honest limitations), so a positive number here is the model disagreeing
    // with bet365, not a detected profit. Presenting it as the latter would be
    // the one dishonest thing on this page.
    const evLine=priced(mk.ev)&&priced(mk.pick_odds)
      ? `<div class="mktedge" style="color:var(--sub)">At ${Number(mk.pick_odds).toFixed(2)} on ${esc(p.pick||"the pick")}, the model's ${Math.round((p.p_pick||0)*100)}% implies ${Number(mk.ev)>0?"+":""}${Math.round(Number(mk.ev)*100)}% expected value — the model's own arithmetic, not a profit forecast.</div>`
      : "";
    marketSec=`<div class="glass dsec"><h3>Model vs bookmakers</h3>
      <div class="mktrow mkthead"><span></span><b>Home</b><b>Draw</b><b>Away</b></div>
      <div class="mktrow"><span>Model</span><b>${ph}%</b><b>${pd}%</b><b>${pa}%</b></div>
      <div class="mktrow"><span>Bookmakers</span><b>${pc(mk.p_home)}%</b><b>${pc(mk.p_draw)}%</b><b>${pc(mk.p_away)}%</b></div>
      ${oddsRow}
      ${edgeLine}${evLine}
      <p class="note" style="padding-top:8px">The percentage rows are bookmaker prices with the margin removed, for comparison only -- no odds feed the model. The ${esc(mk.book||"bookmaker")} row is the decimal price as offered. A gap means the two disagree, not that there is money in it: the market is usually pricing late team news the model has not seen, and the model does not beat the closing line.</p></div>`;
  } else {
    marketSec=`<div class="glass dsec"><h3>Model vs bookmakers</h3>
      <p class="note" style="padding-top:0">No bookmaker line is posted for this fixture yet. The odds feed only carries about a week ahead, so lines appear a few days before kickoff.</p></div>`;
  }
  const app=document.getElementById("app");
  app.innerHTML=`<button class="back" type="button" onclick="render(cur)">‹ Back</button>
    <div class="glass dhead"><div class="lg">${esc(LG[lk])} · MW${m.matchweek}</div><div class="vs">${esc(m.home)} v ${esc(m.away)}</div>
      <div style="font-size:12px;font-weight:700;color:var(--sub)">Match Pick</div>
      <div style="font-size:15px;font-weight:800">${esc(p.pick||"–")} <span style="color:var(--sub);font-weight:600">(${pickPct})</span></div>
      <div class="score"><b>${esc(sc[0])}</b><span>Projected Score If Pick Lands</span><b>${esc(sc[1]||"")}</b></div>
      <div class="split"><div class="sh" style="flex:${ph||1}">${ph}%</div><div class="sd" style="flex:${pd||1}">${pd}%</div><div class="sa" style="flex:${pa||1}">${pa}%</div></div>
      <div style="font-size:11px;color:var(--sub);font-weight:650;margin-top:8px">${esc(m.home)} win · draw · ${esc(m.away)} win</div>
      <div style="font-size:11px;color:var(--cyan);font-weight:700;margin-top:6px">Highest-Probability Exact Score: ${esc(best?best.score:"–")}${bestPct!=null?" · "+bestPct+"%":""}</div>
      <p style="font-size:10.5px;color:var(--sub);font-weight:550;margin-top:6px;line-height:1.4">The score above the bar is the most likely one if the pick lands, so it always agrees with the pick. The highest-probability score is the single likeliest final score whoever wins -- the two differ when a draw is the biggest individual scoreline even though the pick is more likely to win overall. For correct-score betting, use the highest-probability score.</p></div>
    ${uaAll.length?`<div class="glass warnbox">Confirmed defensive/keeper absence not priced by the shot-based model: ${esc(uaAll.join(", "))}. Read the win probability with that in mind.</div>`:""}
    <div class="glass dsec"><h3>Top Exact Scores</h3>${tops}
      <p class="note" style="padding-top:8px">No single exact score is likely in football -- even the highest-probability score above is usually right well under 1 time in 5. Treat this as the model's honest best shot, not a confident call.</p></div>
    ${marketSec}
    <div class="glass dsec"><h3>Why this pick</h3>${reasons}</div>
    ${props?`<div class="glass dsec"><h3>Top players in this match</h3>${props}</div>`:""}`;
  window.scrollTo(0,0);
}

// Renders the CURRENT tab, not a hardcoded one. This said render("players"),
// which was invisible while Player Picks was the only view with chips -- and
// then the NFL tab got chips, and every one of them navigated the reader to
// soccer. `cur` already tracks the active tab for exactly this reason.
function setFilter(f){filter=f;render(cur);}
function daysToKickoff(up){const ds=up.map(u=>new Date(u.date)).filter(d=>!isNaN(d));if(!ds.length)return null;
  const first=new Date(Math.min(...ds));const diff=Math.ceil((first-new Date())/864e5);return diff>0?diff:0;}
function emptyRow(t){return `<div class="rw static"><div class="info"><span>${esc(t)}</span></div></div>`;}
function emptyState(){return `<div class="glass stat"><div class="k">Soon</div><div class="l">The board fills as fixtures approach — season starts 15 August.</div></div>${archiveLink()}`;}
function archiveLink(){return `<div class="arch"><a href="worldcup.html">World Cup 2026 archive — final record 64-26 (71%), champion Spain →</a></div>`;}

boot();
</script>
